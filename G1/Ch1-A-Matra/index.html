<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8e8">
  <title>स्वर अ की खोज | Innovine</title>
  <style>
    :root {
      --ink: #24324a;
      --muted: #667085;
      --cream: #fff8e8;
      --card: rgba(255, 255, 255, 0.97);
      --primary: #6558e8;
      --primary-dark: #463db6;
      --a-colour: #ef6c00;
      --yellow: #ffd166;
      --green: #2eaf68;
      --green-soft: #e9f8ef;
      --red: #dc5151;
      --red-soft: #fff0f0;
      --blue-soft: #eef4ff;
      --line: #e5e8f0;
      --shadow: 0 12px 34px rgba(36, 50, 74, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Noto Sans Devanagari", "Mangal", "Arial Unicode MS", Arial, sans-serif;
      color: var(--ink);
      background: var(--cream);
      touch-action: manipulation;
    }

    button { font: inherit; }

    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 13% 17%, rgba(255, 209, 102, 0.25), transparent 25%),
        radial-gradient(circle at 88% 17%, rgba(101, 88, 232, 0.16), transparent 23%),
        linear-gradient(145deg, #fffaf0 0%, #f3f6ff 55%, #fef4ff 100%);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    .screen.active { display: flex; }

    #logo-screen {
      z-index: 30;
      background: #ffffff;
      flex-direction: column;
      gap: 20px;
    }

    #logo-screen img {
      display: block;
      width: min(65vw, 320px);
      max-height: 40vh;
      object-fit: contain;
    }

    .ambient-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient {
      position: absolute;
      opacity: 0.2;
      animation: floaty 8s ease-in-out infinite;
      will-change: transform;
    }

    .ambient.star {
      color: #f4b942;
      font-size: 24px;
    }

    .ambient.ribbon {
      width: 8px;
      height: 42px;
      border-radius: 8px;
      background: rgba(101, 88, 232, 0.48);
      transform: rotate(18deg);
    }

    .a1 { left: 5%; top: 12%; animation-delay: -1s; }
    .a2 { left: 86%; top: 16%; animation-delay: -3s; }
    .a3 { left: 10%; top: 76%; animation-delay: -5s; }
    .a4 { left: 90%; top: 72%; animation-delay: -2s; }
    .a5 { left: 48%; top: 6%; animation-delay: -4s; }
    .a6 { left: 62%; top: 86%; animation-delay: -6s; }
    .a7 { left: 25%; top: 32%; animation-delay: -7s; }
    .a8 { left: 76%; top: 42%; animation-delay: -2.5s; }

    @keyframes floaty {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(0, -13px, 0) rotate(8deg); }
    }

    .panel {
      position: relative;
      z-index: 2;
      width: min(92vw, 760px);
      max-height: 94vh;
      max-height: 94dvh;
      padding: clamp(20px, 4vw, 40px);
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .title-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      min-height: 68px;
      margin-bottom: 12px;
      border-radius: 22px;
      background: linear-gradient(145deg, var(--yellow), #ffb84c);
      color: #543a00;
      font-size: 2.5rem;
      font-weight: 900;
      box-shadow: 0 8px 0 #e7a536;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 6vw, 3.35rem);
      line-height: 1.15;
    }

    .intro-copy {
      max-width: 620px;
      margin: 0 auto 18px;
      color: var(--muted);
      font-size: clamp(1rem, 2.8vw, 1.22rem);
      line-height: 1.55;
    }

    .rules {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0 22px;
    }

    .rule {
      padding: 13px 10px;
      border-radius: 16px;
      background: var(--blue-soft);
      font-size: 0.97rem;
      line-height: 1.42;
      font-weight: 800;
    }

    .swar-a {
      color: var(--a-colour);
      font-weight: 1000;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    }

    .primary-btn, .secondary-btn, .small-btn {
      min-height: 52px;
      padding: 11px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 900;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .primary-btn {
      min-width: 190px;
      border: 0;
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 7px 0 var(--primary-dark);
      font-size: 1.08rem;
    }

    .secondary-btn, .small-btn {
      border: 2px solid var(--primary);
      background: #ffffff;
      color: var(--primary-dark);
      box-shadow: 0 4px 0 #d7d3ff;
    }

    .small-btn {
      min-height: 46px;
      padding: 9px 17px;
      font-size: 0.96rem;
    }

    .primary-btn:active,
    .secondary-btn:active,
    .small-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }

    button:focus-visible {
      outline: 4px solid rgba(101, 88, 232, 0.27);
      outline-offset: 3px;
    }

    #game-screen {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
    }

    .game-shell {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      width: min(100%, 960px);
      height: 100%;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.89);
      box-shadow: 0 0 35px rgba(36, 50, 74, 0.12);
    }

    .topbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 10px;
      min-height: 76px;
      padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 12px max(14px, env(safe-area-inset-left));
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.97);
    }

    .level-info { min-width: 0; }

    .level-name {
      display: block;
      overflow: hidden;
      color: var(--primary-dark);
      font-size: clamp(0.98rem, 2.5vw, 1.16rem);
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .challenge-count {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.87rem;
      font-weight: 750;
    }

    .score-box, .timer-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 8px 12px;
      border-radius: 14px;
      background: var(--blue-soft);
      font-weight: 900;
      white-space: nowrap;
    }

    .timer-box.low {
      color: #a61b1b;
      background: #ffeaea;
      animation: timerPulse 0.9s ease-in-out infinite;
    }

    @keyframes timerPulse {
      50% { transform: scale(1.04); }
    }

    .sound-btn {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 3px 12px rgba(36, 50, 74, 0.12);
      cursor: pointer;
      font-size: 1.22rem;
    }

    .progress-track {
      flex: 0 0 auto;
      width: 100%;
      height: 8px;
      overflow: hidden;
      background: #e9ecf4;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #9b8cff);
      transition: width 0.35s ease;
    }

    .game-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: clamp(12px, 2.8vw, 26px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .prompt-card {
      width: min(100%, 790px);
      margin: 0 auto 14px;
      padding: clamp(14px, 2.8vw, 22px);
      border: 1px solid #eceef5;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(36, 50, 74, 0.08);
      text-align: center;
    }

    .prompt-label {
      display: inline-block;
      margin-bottom: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #f1efff;
      color: var(--primary-dark);
      font-size: 0.9rem;
      font-weight: 900;
    }

    .question-text {
      margin: 0;
      font-size: clamp(1.3rem, 3.8vw, 1.95rem);
      line-height: 1.42;
      font-weight: 900;
    }

    .task-area {
      width: min(100%, 790px);
      margin: 0 auto;
    }

    .word-display {
      display: block;
      width: fit-content;
      text-align: center;
      min-width: min(78vw, 270px);
      min-height: 72px;
      margin: 2px auto 16px;
      padding: 10px 22px;
      border: 3px solid #f2d18c;
      border-radius: 22px;
      background: #fff9e9;
      box-shadow: 0 6px 0 #ead19b;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 1000;
      line-height: 1.1;
    }

    .piece-tray {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 13px;
      width: 100%;
    }

    .letter-piece {
      min-width: 76px;
      min-height: 68px;
      padding: 10px 16px;
      border: 3px solid #dce1ec;
      border-radius: 20px;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 6px 0 #d6dbe6;
      cursor: pointer;
      font-size: clamp(1.55rem, 5vw, 2.2rem);
      font-weight: 1000;
      transition: transform 0.13s ease, background 0.13s ease, border-color 0.13s ease;
    }

    .letter-piece:active { transform: translateY(3px); box-shadow: 0 2px 0 #d6dbe6; }

    .letter-piece.wrong, .build-slot.wrong {
      border-color: var(--red);
      background: var(--red-soft);
      animation: shake 0.35s ease;
    }

    .letter-piece.correct, .build-slot.correct {
      border-color: var(--green);
      background: var(--green-soft);
      color: #17623b;
      box-shadow: none;
    }

    @keyframes shake {
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    .sort-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .word-card {
      display: block;
      width: fit-content;
      text-align: center;
      min-width: min(74vw, 270px);
      min-height: 76px;
      margin: 0 auto 14px;
      padding: 10px 24px;
      border: 4px solid #f2c25b;
      border-radius: 20px;
      background: #fff7d9;
      box-shadow: 0 7px 0 #e2b448;
      cursor: grab;
      touch-action: none;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 1000;
      transition: transform 0.3s ease, opacity 0.3s ease, border-color 0.2s ease;
      will-change: transform;
    }

    .word-card.dragging {
      z-index: 5;
      cursor: grabbing;
      transition: none;
      box-shadow: 0 14px 28px rgba(36, 50, 74, 0.2);
    }

    .baskets-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(12px, 3vw, 24px);
      width: min(100%, 680px);
      margin: 0 auto;
    }

    .basket-drop {
      min-width: 0;
      min-height: 188px;
      padding: 12px 10px 14px;
      border: 3px solid #e7dbff;
      border-radius: 26px;
      background: linear-gradient(180deg, #ffffff 0%, #f8f5ff 100%);
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
      box-shadow: 0 8px 18px rgba(101, 88, 232, 0.08);
    }

    .basket-drop:hover,
    .basket-drop.drag-over {
      transform: translateY(-3px);
      border-color: #8b80ff;
      background: #f5f3ff;
    }

    .basket-drop.wrong-target {
      border-color: var(--red);
      background: var(--red-soft);
      animation: shake 0.35s ease;
    }

    .basket-drop.correct-target {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .basket-label {
      display: block;
      min-height: 30px;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: clamp(1rem, 3vw, 1.18rem);
      font-weight: 1000;
      line-height: 1.25;
    }

    .basket-emoji {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 82px;
      margin: 0 auto 8px;
      font-size: clamp(3.2rem, 8vw, 4.8rem);
      line-height: 1;
    }

    .basket-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      min-height: 38px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #ffe8b1;
      color: #7a4c00;
      font-size: 1.05rem;
      font-weight: 1000;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.06);
    }

    .picture-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(100%, 280px);
      margin: 0 auto 14px;
      padding: 14px;
      border-radius: 24px;
      background: linear-gradient(180deg, #fffefc 0%, #f7fbff 100%);
      border: 3px solid #dce9ff;
      box-shadow: 0 8px 18px rgba(36, 50, 74, 0.08);
    }

    .picture-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 800;
    }

    .picture-clue {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 128px;
      height: 128px;
      border-radius: 26px;
      background: #fff9e9;
      border: 3px solid #f2d18c;
      box-shadow: 0 6px 0 #ead19b;
      font-size: 4.2rem;
      line-height: 1;
      user-select: none;
    }

    .picture-clue svg {
      width: 92px;
      height: 92px;
      display: block;
    }

    .build-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .build-slots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 74px;
      margin-bottom: 16px;
    }

    .build-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      min-height: 66px;
      padding: 8px 12px;
      border: 3px dashed #bfc5d2;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.74);
      color: var(--ink);
      font-size: clamp(1.45rem, 4.6vw, 2rem);
      font-weight: 1000;
    }

    .build-slot.filled {
      border-style: solid;
      border-color: #9e96ff;
      background: #f2f0ff;
    }

    .build-tray {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 11px;
      width: 100%;
      margin-bottom: 14px;
    }

    .build-tile {
      min-width: 72px;
      min-height: 60px;
      padding: 8px 14px;
      border: 3px solid #f0bd54;
      border-radius: 17px;
      background: #fff6d4;
      color: var(--ink);
      box-shadow: 0 5px 0 #dba83e;
      cursor: pointer;
      font-size: clamp(1.4rem, 4.5vw, 1.95rem);
      font-weight: 1000;
    }

    .build-tile:disabled { visibility: hidden; }

    .build-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .feedback-line {
      width: min(100%, 790px);
      min-height: 50px;
      margin: 13px auto 0;
      padding: 10px 14px;
      border-radius: 15px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
      font-weight: 850;
      text-align: center;
    }

    .feedback-line.good { color: #17623b; background: var(--green-soft); }
    .feedback-line.bad { color: #8f2020; background: var(--red-soft); }
    .feedback-line.info { color: #3f3a91; background: #f1efff; }

    .feedback-pop {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 4.1rem;
      font-weight: 900;
      box-shadow: 0 14px 35px rgba(36, 50, 74, 0.25);
      pointer-events: none;
    }

    .feedback-pop.show { display: flex; animation: popIn 0.55s ease both; }
    .feedback-pop.correct-pop { background: var(--green); }
    .feedback-pop.wrong-pop { width: 80px; height: 80px; background: rgba(220, 81, 81, 0.93); font-size: 3rem; }

    @keyframes popIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35); }
      60% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      z-index: 39;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti-star {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 24px;
      animation: starBurst 900ms ease-out forwards;
      will-change: transform, opacity;
    }

    @keyframes starBurst {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.15) rotate(300deg); }
    }

    .level-overlay {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(40, 45, 72, 0.5);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }

    .level-overlay.show { display: flex; }

    .level-card {
      width: min(90vw, 480px);
      padding: 28px 22px;
      border-radius: 26px;
      background: #ffffff;
      box-shadow: var(--shadow);
      text-align: center;
      animation: levelRise 0.45s ease both;
    }

    .level-card .big-icon { margin-bottom: 8px; font-size: 3.2rem; }
    .level-card h2 { margin-bottom: 8px; font-size: 2rem; }
    .level-card p { margin-bottom: 0; color: var(--muted); font-size: 1.04rem; line-height: 1.45; }

    @keyframes levelRise {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .result-stars {
      margin: 10px 0 14px;
      color: #f4b942;
      font-size: clamp(2rem, 7vw, 3.3rem);
      letter-spacing: 4px;
    }

    .result-score {
      margin: 10px auto;
      color: var(--primary-dark);
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      font-weight: 1000;
    }

    .result-summary {
      margin: 0 auto 20px;
      color: var(--muted);
      font-size: 1.07rem;
      line-height: 1.55;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 620px) {
      .rules { grid-template-columns: 1fr; }
      .rule { padding: 9px 10px; }
      .topbar { min-height: 68px; gap: 7px; }
      .score-box, .timer-box { min-height: 43px; padding: 7px 9px; font-size: 0.9rem; }
      .sound-btn { width: 42px; height: 42px; }
      .baskets-row { gap: 9px; }
      .basket-drop { min-height: 172px; }
      .picture-clue { width: 110px; height: 110px; font-size: 3.5rem; }
      .picture-clue svg { width: 78px; height: 78px; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <!-- Logo Screen (Displays for 10 seconds) -->
    <section class="screen active" id="logo-screen" aria-label="Innovine logo">
      <img src="assets/innovine-logo.png" alt="Innovine Logo" draggable="false">
    </section>

    <!-- Ambient Floating Stars -->
    <div class="ambient-layer" aria-hidden="true">
      <span class="ambient star a1">★</span>
      <span class="ambient ribbon a2"></span>
      <span class="ambient star a3">★</span>
      <span class="ambient ribbon a4"></span>
      <span class="ambient star a5">★</span>
      <span class="ambient ribbon a6"></span>
      <span class="ambient star a7">★</span>
      <span class="ambient ribbon a8"></span>
    </div>

    <!-- Intro / Start Screen -->
    <section class="screen" id="intro-screen">
      <div class="panel">

      var state = {

      var dom = {

        soundBtn: document.getElementById("sound-btn"),

      };

      function initApp() {
        // Keeps the logo screen active for 10000ms (10 seconds)
        setTimeout(function () {
          showScreen(dom.introScreen);
        }, 10000);

        dom.startBtn.addEventListener("click", startGame);
        dom.playAgainBtn.addEventListener("click", startGame);
        dom.soundBtn.addEventListener("click", toggleSound);
      }

      function showScreen(screenEl) {
        var screens = [dom.logoScreen, dom.introScreen, dom.gameScreen, dom.resultScreen];
        screens.forEach(function (s) {
          s.classList.remove("active");
        });
        screenEl.classList.add("active");
      }

      function toggleSound() {
        state.soundOn = !state.soundOn;
        dom.soundBtn.textContent = state.soundOn ? "🔊" : "🔇";
        dom.soundBtn.title = state.soundOn ? "ध्वनि बंद करें" : "ध्वनि चालू करें";
        dom.soundBtn.setAttribute("aria-label", dom.soundBtn.title);
      }

      function playAudio(audioEl) {
        if (!state.soundOn || !audioEl) return;
        try {
          audioEl.currentTime = 0;
          audioEl.play().catch(function () {});
        } catch (e) {}
      }

      function speak(text) {
        var announce = dom.liveRegion;
        if (announce) announce.textContent = text;
      }

      function startGame() {
        state.levelIndex = 0;
        state.questionIndex = 0;
        state.totalIndex = 0;
        state.score = 0;
        dom.scoreValue.textContent = "0";
        showScreen(dom.gameScreen);
        showLevelIntro(0);
      }

      function showLevelIntro(levelIdx) {
        stopTimer();
        var level = levels[levelIdx];
        dom.levelIcon.textContent = level.icon;
        dom.overlayTitle.textContent = level.name;
        dom.overlayCopy.textContent = level.intro;
        dom.levelOverlay.classList.add("show");

        setTimeout(function () {
          dom.levelOverlay.classList.remove("show");
          loadQuestion();
        }, 2200);
      }

      function loadQuestion() {
        state.attemptCount = 0;
        state.buildSlots = [];

        var currentLevel = levels[state.levelIndex];
        var q = currentLevel.questions[state.questionIndex];

        dom.levelName.textContent = currentLevel.name;
        dom.challengeCount.textContent = "चुनौती " + (state.questionIndex + 1) + "/" + QUESTIONS_PER_LEVEL;
        dom.promptLabel.textContent = currentLevel.label;
        dom.progressFill.style.width = ((state.totalIndex / TOTAL_QUESTIONS) * 100) + "%";

        setFeedback("", "");
        dom.taskArea.innerHTML = "";

        if (currentLevel.type === "find") {
          renderFindQuestion(q);
        } else if (currentLevel.type === "sort") {
          renderSortQuestion(q);
        } else if (currentLevel.type === "build") {
          renderBuildQuestion(q);
        }

        resetTimer();
      }

      function resetTimer() {
        stopTimer();
        state.timeLeft = QUESTION_TIME;
        updateTimerDisplay();
        state.timerId = setInterval(function () {
          state.timeLeft--;
          updateTimerDisplay();
          if (state.timeLeft <= 0) {
            stopTimer();
            handleTimeout();
          }
        }, 1000);
      }

      function stopTimer() {
        if (state.timerId) {
          clearInterval(state.timerId);
          state.timerId = null;
        }
      }

      function updateTimerDisplay() {
        dom.timerValue.textContent = state.timeLeft;
        if (state.timeLeft <= 10) {
          dom.timerBox.classList.add("low");
        } else {
          dom.timerBox.classList.remove("low");
        }
      }

      function handleTimeout() {
        var currentLevel = levels[state.levelIndex];
        var q = currentLevel.questions[state.questionIndex];
        playAudio(dom.audioWrong);
        showFeedbackPop(false);
        setFeedback("समय समाप्त! सही उत्तर: " + (q.word || q.target.join("")), "bad");
        speak("समय समाप्त!");

        setTimeout(function () {
          advanceQuestion();
        }, 2000);
      }

      function renderFindQuestion(q) {
        dom.questionText.innerHTML = 'इस शब्द में <span class="swar-a">स्वर "अ"</span> कहाँ है? टैप करें:';

        var wrap = document.createElement("div");
        var wordBox = document.createElement("div");
        wordBox.className = "word-display";
        wordBox.textContent = q.word;

        var tray = document.createElement("div");
        tray.className = "piece-tray";

        q.pieces.forEach(function (p) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "letter-piece";
          btn.textContent = p;
          btn.addEventListener("click", function () {
            checkFindAnswer(p, btn, q);
          });
          tray.appendChild(btn);
        });

        wrap.appendChild(wordBox);
        wrap.appendChild(tray);
        dom.taskArea.appendChild(wrap);
      }

      function checkFindAnswer(piece, btn, q) {
        if (piece === "अ") {
          btn.classList.add("correct");
          handleSuccess(q.explanation);
        } else {
          btn.classList.add("wrong");
          handleFailure("फिर से कोशिश करें! यह स्वर 'अ' नहीं है।");
        }
      }

      function renderSortQuestion(q) {
        dom.questionText.innerHTML = 'क्या यह शब्द <span class="swar-a">"अ"</span> से शुरू होता है? सही टोकरी में रखें:';

        var wrap = document.createElement("div");
        wrap.className = "sort-game";

        var wordCard = document.createElement("div");
        wordCard.className = "word-card";
        wordCard.textContent = q.word;
        wordCard.draggable = true;

        var basketsRow = document.createElement("div");
        basketsRow.className = "baskets-row";

        var basketA = createBasket("a", "स्वर अ वाली टोकरी", "🧺", "अ");
        var basketOther = createBasket("other", "अन्य अक्षर", "🧺", "अन्य");

        basketsRow.appendChild(basketA);
        basketsRow.appendChild(basketOther);

        wrap.appendChild(wordCard);
        wrap.appendChild(basketsRow);
        dom.taskArea.appendChild(wrap);

        setupDragAndDrop(wordCard, [basketA, basketOther], q);
      }

      function createBasket(groupKey, title, emoji, badge) {
        var b = document.createElement("div");
        b.className = "basket-drop";
        b.dataset.group = groupKey;
        b.innerHTML = '<span class="basket-label">' + title + '</span>' +
                      '<div class="basket-emoji">' + emoji + '</div>' +
                      '<span class="basket-badge">' + badge + '</span>';
        return b;
      }

      function setupDragAndDrop(card, baskets, q) {
        card.addEventListener("dragstart", function (e) {
          e.dataTransfer.setData("text/plain", q.group);
          card.classList.add("dragging");
        });

        card.addEventListener("dragend", function () {
          card.classList.remove("dragging");
        });

        baskets.forEach(function (b) {
          b.addEventListener("dragover", function (e) {
            e.preventDefault();
            b.classList.add("drag-over");
          });

          b.addEventListener("dragleave", function () {
            b.classList.remove("drag-over");
          });

          b.addEventListener("drop", function (e) {
            e.preventDefault();
            b.classList.remove("drag-over");
            checkSortAnswer(b.dataset.group, b, q);
          });

          b.addEventListener("click", function () {
            checkSortAnswer(b.dataset.group, b, q);
          });
        });
      }

      function checkSortAnswer(selectedGroup, basketEl, q) {
        if (selectedGroup === q.group) {
          basketEl.classList.add("correct-target");
          handleSuccess(q.explanation);
        } else {
          basketEl.classList.add("wrong-target");
          setTimeout(function () {
            basketEl.classList.remove("wrong-target");
          }, 400);
          handleFailure("गलत टोकरी! फिर से ध्यान से सोचिए।");
        }
      }

      function renderBuildQuestion(q) {
        dom.questionText.textContent = "चित्र पहचानकर अक्षर जोड़िए और शब्द बनाइए:";

        var wrap = document.createElement("div");
        wrap.className = "build-game";

        var picCard = document.createElement("div");
        picCard.className = "picture-card";
        picCard.innerHTML = '<span class="picture-label">चित्र सुराग</span>' +
                            '<div class="picture-clue">' + getPictureMarkup(q.pictureKey) + '</div>';

        var slotsContainer = document.createElement("div");
        slotsContainer.className = "build-slots";

        for (var i = 0; i < q.target.length; i++) {
          var slot = document.createElement("div");
          slot.className = "build-slot";
          slot.dataset.index = i;
          slotsContainer.appendChild(slot);
        }

        var tray = document.createElement("div");
        tray.className = "build-tray";

        q.tiles.forEach(function (tileText, idx) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "build-tile";
          btn.textContent = tileText;
          btn.dataset.tileIndex = idx;
          btn.addEventListener("click", function () {
            addTileToBuild(tileText, btn, q);
          });
          tray.appendChild(btn);
        });

        var actions = document.createElement("div");
        actions.className = "build-actions";

        var clearBtn = document.createElement("button");
        clearBtn.type = "button";
        clearBtn.className = "small-btn";
        clearBtn.textContent = "मिटाएँ";
        clearBtn.addEventListener("click", function () {
          resetBuildSlots(q);
        });

        actions.appendChild(clearBtn);

        wrap.appendChild(picCard);
        wrap.appendChild(slotsContainer);
        wrap.appendChild(tray);
        wrap.appendChild(actions);

        dom.taskArea.appendChild(wrap);
      }

      function addTileToBuild(tileText, tileBtn, q) {
        if (state.buildSlots.length >= q.target.length) return;

        state.buildSlots.push({ text: tileText, btnEl: tileBtn });
        tileBtn.disabled = true;

        updateBuildSlotsUI();

        if (state.buildSlots.length === q.target.length) {
          checkBuildAnswer(q);
        }
      }

      function resetBuildSlots(q) {
        state.buildSlots.forEach(function (item) {
          if (item.btnEl) item.btnEl.disabled = false;
        });
        state.buildSlots = [];
        updateBuildSlotsUI();
        setFeedback("", "");
      }

      function updateBuildSlotsUI() {
        var slots = dom.taskArea.querySelectorAll(".build-slot");
        slots.forEach(function (slot, idx) {
          if (state.buildSlots[idx]) {
            slot.textContent = state.buildSlots[idx].text;
            slot.classList.add("filled");
          } else {
            slot.textContent = "";
            slot.classList.remove("filled", "wrong", "correct");
          }
        });
      }

      function checkBuildAnswer(q) {
        var userWord = state.buildSlots.map(function (s) { return s.text; }).join("");
        var targetWord = q.target.join("");

        var slots = dom.taskArea.querySelectorAll(".build-slot");

        if (userWord === targetWord) {
          slots.forEach(function (s) { s.classList.add("correct"); });
          handleSuccess(q.explanation);
        } else {
          slots.forEach(function (s) { s.classList.add("wrong"); });
          handleFailure("शब्द सही नहीं बना। मिटाएँ दबाकर फिर से कोशिश करें!");
        }
      }

      function handleSuccess(explanation) {
        stopTimer();
        state.attemptCount++;

        var points = (state.attemptCount === 1) ? POINTS_FIRST_TRY : POINTS_SECOND_TRY;
        state.score += points;
        dom.scoreValue.textContent = state.score;

        playAudio(dom.audioCorrect);
        triggerConfetti();
        showFeedbackPop(true);

        setFeedback("शाबाश! सही उत्तर! (+ " + points + " अंक) " + (explanation || ""), "good");
        speak("शाबाश! सही उत्तर!");

        setTimeout(function () {
          advanceQuestion();
        }, 1800);
      }

      function handleFailure(msg) {
        state.attemptCount++;
        playAudio(dom.audioWrong);
        showFeedbackPop(false);
        setFeedback(msg, "bad");
        speak("गलत उत्तर! फिर कोशिश करें।");
      }

      function advanceQuestion() {
        state.questionIndex++;
        state.totalIndex++;

        if (state.questionIndex >= QUESTIONS_PER_LEVEL) {
          state.levelIndex++;
          state.questionIndex = 0;

          if (state.levelIndex >= levels.length) {
            finishGame();
          } else {
            showLevelIntro(state.levelIndex);
          }
        } else {
          loadQuestion();
        }
      }

      function finishGame() {
        stopTimer();
        playAudio(dom.audioClap);

        dom.finalScore.textContent = state.score;

        var stars = "★☆☆";
        var title = "अच्छा प्रयास!";
        var summary = "आपने स्वर 'अ' का अच्छा अभ्यास किया। थोड़ा और प्रयास करके आप full marks ला सकते हैं!";

        if (state.score >= 250) {
          stars = "★★★";
          title = "अद्भुत! आप स्वर अ के विजेता हैं!";
          summary = "शानदार प्रदर्शन! आपने सभी चुनौतियों को बहुत ही बेहतरीन तरीके से पूरा किया।";
        } else if (state.score >= 180) {
          stars = "★★☆";
          title = "बहुत बढ़िया!";
          summary = "आपने स्वर 'अ' को अच्छे से पहचान लिया है। बहुत अच्छा खेल!";
        }

        dom.resultStars.textContent = stars;
        dom.resultTitle.textContent = title;
        dom.resultSummary.textContent = summary;

        showScreen(dom.resultScreen);
      }

      function setFeedback(msg, type) {
        dom.feedbackLine.textContent = msg;
        dom.feedbackLine.className = "feedback-line " + (type || "");
      }

      function showFeedbackPop(isCorrect) {
        dom.feedbackPop.textContent = isCorrect ? "✓" : "✗";
        dom.feedbackPop.className = "feedback-pop show " + (isCorrect ? "correct-pop" : "wrong-pop");

        setTimeout(function () {
          dom.feedbackPop.className = "feedback-pop";
        }, 600);
      }

      function triggerConfetti() {
        dom.confettiLayer.innerHTML = "";
        var colors = ["#ffd166", "#ef6c00", "#6558e8", "#2eaf68", "#dc5151"];

        for (var i = 0; i < 18; i++) {
          var star = document.createElement("span");
          star.className = "confetti-star";
          star.textContent = "★";
          star.style.color = colors[Math.floor(Math.random() * colors.length)];

          var angle = Math.random() * Math.PI * 2;
          var dist = 80 + Math.random() * 140;
          var tx = Math.cos(angle) * dist + "px";
          var ty = Math.sin(angle) * dist + "px";

          star.style.setProperty("--tx", tx);
          star.style.setProperty("--ty", ty);

          dom.confettiLayer.appendChild(star);
        }

        setTimeout(function () {
          dom.confettiLayer.innerHTML = "";
        }, 950);
      }

      window.addEventListener("DOMContentLoaded", initApp);
    })();
  </script>
</body>
</html>
