<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वैभव की सैर - 'ऐ' की मात्रा (Levels Game)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: linear-gradient(135deg, #ffedd5, #fed7aa); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #27272a;
        }

        /* 1. Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            padding: 20px;
        }

        #splash-screen img {
            max-width: 220px;
            width: 65%;
            height: auto;
            margin-bottom: 20px;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f97316;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 2. Main Game Container */
        #game-container { 
            display: none; 
            width: 100%;
            max-width: 650px; 
            background: white; 
            border-radius: 20px; 
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center;
        }

        /* Top Header Info */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fed7aa;
        }

        .badge {
            background-color: #f97316;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .score-box {
            font-weight: bold;
            color: #c2410c;
            font-size: 16px;
        }

        /* Question Box */
        .question-box {
            margin: 20px 0;
        }

        .question-title {
            font-size: 20px;
            color: #9a3412;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .question-text {
            font-size: 24px;
            font-weight: bold;
            color: #18181b;
            background: #fff7ed;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #fdba74;
            margin-bottom: 20px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .opt-btn {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            background: #fafafa;
            border: 2px solid #fed7aa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #3f3f46;
        }

        .opt-btn:active {
            transform: scale(0.97);
        }

        .opt-btn.correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }

        .opt-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }

        /* Action & Result Buttons */
        .btn-action { 
            padding: 12px 28px; 
            font-size: 18px; 
            cursor: pointer; 
            background: #f97316; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
        }

        .hidden { display: none !important; }

        /* Responsive Design */
        @media (max-width: 480px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 20px; }
            .question-title { font-size: 18px; }
            .opt-btn { font-size: 18px; padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- Audio Files -->
    <audio id="snd-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <!-- Splash Screen (Innovine Logo ONLY here) -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
        <div class="loader"></div>
        <p style="margin-top:15px; color:#666; font-size:14px;">लोड हो रहा है...</p>
    </div>

    <!-- Main Game Box -->
    <div id="game-container">
        
        <!-- Top Info Header -->
        <div class="game-header">
            <span class="badge" id="level-badge">Level 1</span>
            <span class="score-box">अंक: <span id="score">0</span></span>
            <span class="score-box">प्रश्न: <span id="q-count">1</span>/5</span>
        </div>

        <!-- Question View -->
        <div id="quiz-view">
            <div class="question-box">
                <div class="question-title" id="instruction-text">निर्देश...</div>
                <div class="question-text" id="question-display">प्रश्न...</div>
            </div>

            <div class="options-grid" id="options-container">
                <!-- Dynamic Options Buttons -->
            </div>
        </div>

        <!-- Level Complete Screen -->
        <div id="level-screen" class="hidden">
            <h2 style="color: #c2410c; font-size: 24px; margin-bottom: 10px;" id="level-title">स्तर पूर्ण! 🎉</h2>
            <p id="level-msg" style="font-size: 18px; margin-bottom: 20px;">आपने इस स्तर के सभी 5 प्रश्नों को हल कर लिया है।</p>
            <button class="btn-action" id="next-lvl-btn" onclick="startNextLevel()">अगला स्तर शुरू करें ➔</button>
        </div>

        <!-- Game Complete Screen -->
        <div id="final-screen" class="hidden">
            <h2 style="color: #ea580c; font-size: 28px; margin-bottom: 15px;">बधाई हो! 🏆</h2>
            <p style="font-size: 20px; margin-bottom: 20px;">आपने 'ऐ' की मात्रा के सभी 3 लेवल्स सफलतापूर्वक पूरा कर लिए हैं!</p>
            <p style="font-size: 22px; font-weight: bold; color: #15803d; margin-bottom: 20px;">कुल अंक: <span id="final-score">0</span> / 15</p>
            <button class="btn-action" onclick="location.reload()">दोबारा खेलें 🔄</button>
        </div>

    </div>

    <script>
        // Game Data matched with Chapter 10 'ऐ' की मात्रा
        const gameLevels = [
            {
                level: 1,
                title: "Level 1: सही शब्द पहचानो 🔍",
                instruction: "नीचे दिए गए विकल्पों में से 'ऐ' (ै) की मात्रा वाला सही शब्द चुनें:",
                questions: [
                    { q: "चित्र पहचानिए: 🎒", options: ["थैला", "तोला", "थाली", "तील"], ans: 0 },
                    { q: "सैनिक देश की रक्षा करता है। इसमें 'ऐ' मात्रा वाला शब्द कौन सा है?", options: ["देश", "रक्षा", "सैनिक", "करता"], ans: 2 },
                    { q: "इनमें से 'ऐ' की मात्रा वाला शब्द चुनें:", options: ["केला", "मैदान", "रोटी", "सूरज"], ans: 1 },
                    { q: "तैरने वाले व्यक्ति को क्या कहते हैं?", options: ["तैराक", "नाविक", "चालक", "गवैया"], ans: 0 },
                    { q: "आँखों पर पहना जाने वाला उपकरण:", options: ["ऐनक", "टोपी", "घड़ी", "हार"], ans: 0 }
                ]
            },
            {
                level: 2,
                title: "Level 2: रिक्त स्थान भरो ✏️",
                instruction: "सही अक्षर चुनकर 'ऐ' की मात्रा वाले शब्द को पूरा करें:",
                questions: [
                    { q: "ब + ____ = बैल", options: ["ल", "ता", "र", "न"], ans: 0 },
                    { q: "कै + ____ + रा = कैमेरा", options: ["मे", "म", "मा", "मी"], ans: 1 },
                    { q: "पै + ____ = पैसा", options: ["सा", "सो", "से", "सी"], ans: 0 },
                    { q: "कै + ____ = कैरम", options: ["रम", "लम", "सम", "नम"], ans: 0 },
                    { q: "वै + ____ = वैभव", options: ["भव", "भवा", "भो", "भू"], ans: 0 }
                ]
            },
            {
                level: 3,
                title: "Level 3: सही या गलत? ✔️❌",
                instruction: "बताएं कि दिया गया कथन या शब्द 'ऐ' (ै) की मात्रा के अनुसार सही है या गलत:",
                questions: [
                    { q: "'मैना' शब्द में 'ऐ' (ै) की मात्रा का प्रयोग हुआ है।", options: ["सही", "गलत"], ans: 0 },
                    { q: "'शेर' शब्द में 'ऐ' की मात्रा लगी हुई है।", options: ["सही", "गलत"], ans: 1 },
                    { q: "'पैदल' में 'प' अक्षर पर 'ऐ' की मात्रा जुड़ी है।", options: ["सही", "गलत"], ans: 0 },
                    { q: "'सैनिक' शब्द की सही वर्तनी 'सेनिक' है।", options: ["सही", "गलत"], ans: 1 },
                    { q: "'वैभव की सैर' पाठ में 'सैर' शब्द में 'ऐ' की मात्रा है।", options: ["सही", "गलत"], ans: 0 }
                ]
            }
        ];

        let currentLevelIdx = 0;
        let currentQuestionIdx = 0;
        let score = 0;
        let canAnswer = true;

        const sndCorrect = document.getElementById('snd-correct');
        const sndWrong = document.getElementById('snd-wrong');

        // Audio Unlocker for Mobile Browsers
        document.body.addEventListener('touchstart', unlockAudio, { once: true });
        document.body.addEventListener('click', unlockAudio, { once: true });

        function unlockAudio() {
            sndCorrect.play().then(() => { sndCorrect.pause(); sndCorrect.currentTime = 0; }).catch(() => {});
            sndWrong.play().then(() => { sndWrong.pause(); sndWrong.currentTime = 0; }).catch(() => {});
        }

        // Hide Splash Screen after 2.5 Seconds
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('game-container').style.display = 'block';
                    loadQuestion();
                }, 500);
            }, 2500);
        });

        function loadQuestion() {
            canAnswer = true;
            const levelData = gameLevels[currentLevelIdx];
            const qData = levelData.questions[currentQuestionIdx];

            // Update UI Header
            document.getElementById('level-badge').innerText = levelData.title.split(':')[0];
            document.getElementById('q-count').innerText = currentQuestionIdx + 1;
            document.getElementById('instruction-text').innerText = levelData.instruction;
            document.getElementById('question-display').innerText = qData.q;

            // Render Options
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = optText;
                btn.onclick = () => handleAnswer(index, btn);
                optContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            const qData = gameLevels[currentLevelIdx].questions[currentQuestionIdx];

            if (selectedIndex === qData.ans) {
                sndCorrect.currentTime = 0;
                sndCorrect.play().catch(() => {});
                btnElement.classList.add('correct');
                score += 1;
                document.getElementById('score').innerText = score;
            } else {
                sndWrong.currentTime = 0;
                sndWrong.play().catch(() => {});
                btnElement.classList.add('wrong');
                
                // Highlight correct answer
                const allButtons = document.querySelectorAll('.opt-btn');
                allButtons[qData.ans].classList.add('correct');
            }

            // Move to Next Question or Level Complete Screen
            setTimeout(() => {
                currentQuestionIdx++;
                if (currentQuestionIdx < 5) {
                    loadQuestion();
                } else {
                    showLevelCompletion();
                }
            }, 1200);
        }

        function showLevelCompletion() {
            document.getElementById('quiz-view').classList.add('hidden');
            
            if (currentLevelIdx < gameLevels.length - 1) {
                document.getElementById('level-screen').classList.remove('hidden');
                document.getElementById('level-title').innerText = `${gameLevels[currentLevelIdx].title.split(':')[0]} समाप्त! 🎉`;
            } else {
                document.getElementById('final-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
            }
        }

        function startNextLevel() {
            currentLevelIdx++;
            currentQuestionIdx = 0;
            document.getElementById('level-screen').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            loadQuestion();
        }
    </script>
</body>
</html>
