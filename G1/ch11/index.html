<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ओ' ( ो ) मात्रा का खेल</title>
    <!-- Canvas Confetti Library for Celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #fef3c7, #fed7aa);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 15px;
        }

        /* ---------------- SPLASH SCREEN (ONLY LOGO & START BUTTON) ---------------- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
        }

        .logo-img {
            max-width: 320px;
            width: 80%;
            height: auto;
            margin-bottom: 30px;
        }

        /* ---------------- GAME CONTAINER ---------------- */
        #game-container {
            display: none;
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
        }

        .game-title {
            color: #ea580c;
            font-size: 26px;
            margin-bottom: 15px;
        }

        .score-bar {
            display: flex;
            justify-content: space-between;
            background-color: #fff7ed;
            border: 2px solid #fdba74;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            color: #c2410c;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn-action {
            background: #ea580c;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
            transition: transform 0.1s, background 0.2s;
            touch-action: manipulation;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        /* ---------------- QUESTION CARD ---------------- */
        .question-card {
            background: #f8fafc;
            border: 3px solid #cbd5e1;
            border-radius: 20px;
            padding: 30px 15px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .instruction-text {
            color: #475569;
            font-size: 18px;
            font-weight: 600;
        }

        .word-display {
            font-size: 42px;
            font-weight: bold;
            color: #1e293b;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: #ffffff;
            padding: 15px 30px;
            border-radius: 16px;
            border: 2px dashed #ea580c;
            min-width: 200px;
        }

        .matra-blank {
            display: inline-block;
            width: 45px;
            height: 50px;
            border-bottom: 4px solid #ea580c;
            color: #ea580c;
            text-align: center;
            line-height: 45px;
        }

        /* ---------------- MATRA OPTIONS ---------------- */
        .options-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .matra-btn {
            background: #ffffff;
            border: 3px solid #ea580c;
            color: #ea580c;
            font-size: 32px;
            font-weight: bold;
            width: 75px;
            height: 75px;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            touch-action: manipulation;
            transition: transform 0.1s, background 0.2s;
        }

        .matra-btn:active {
            transform: scale(0.92);
            background: #fff7ed;
        }

        /* ---------------- FINAL SCOREBOARD ---------------- */
        #scoreboard {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .final-score {
            font-size: 52px;
            color: #ea580c;
            margin: 15px 0;
            font-weight: 800;
        }

        @media (max-width: 480px) {
            .game-title { font-size: 22px; }
            .word-display { font-size: 34px; }
            .matra-btn { width: 65px; height: 65px; font-size: 28px; }
        }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN (ONLY LOGO & START BUTTON) -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Solutions Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/300x120?text=Innovine+Solutions'">
        <button class="btn-action" onclick="startGame()">खेल शुरू करें (Start Game)</button>
    </div>

    <!-- 2. MAIN GAME CONTAINER (ONLY LEVEL 1) -->
    <div id="game-container">
        <h1 class="game-title">सही मात्रा चुनकर शब्द पूरा करें ✍️</h1>
        
        <div class="score-bar">
            <span>प्रश्न (Question): <span id="q-num">1</span>/10</span>
            <span>अंक (Score): <span id="score-val">0</span></span>
        </div>

        <!-- QUESTION AREA -->
        <div id="quiz-area">
            <div class="question-card">
                <div class="instruction-text">खाली स्थान में सही मात्रा लगाएँ:</div>
                <div class="word-display" id="word-box">
                    <!-- Word will be populated here by JavaScript -->
                </div>
            </div>

            <p style="color: #64748b; font-weight: bold; margin-bottom: 12px;">नीचे से सही मात्रा चुनें:</p>
            <div class="options-container" id="options-box">
                <!-- Matra options will be populated here -->
            </div>
        </div>

        <!-- FINAL SCOREBOARD -->
        <div id="scoreboard">
            <h2>बहुत बढ़िया! 🎉</h2>
            <p style="font-size: 18px; color: #475569; margin-top: 5px;">आपने सभी प्रश्न पूरे कर लिए हैं!</p>
            <div class="final-score" id="final-score-text">0</div>
            <button class="btn-action" onclick="location.reload()">फिर से खेलें (Play Again)</button>
        </div>
    </div>

    <script>
        /* ---------------- FULL VOLUME WEB AUDIO SYNTHESIZER ---------------- */
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCorrectSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.3); // A5

            gain.gain.setValueAtTime(1.0, now); // FULL VOLUME
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playWrongSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.3);

            gain.gain.setValueAtTime(1.0, now); // FULL VOLUME
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.3);
        }

        /* ---------------- GAME DATA & STATE ---------------- */
        // List of 10 word questions
        const questions = [
            { prefix: "म", matra: "ो", suffix: "र", options: ["ो", "ा", "ी", "े"] },     // मोर
            { prefix: "त", matra: "ो", suffix: "ता", options: ["ि", "ो", "ू", "ै"] },    // तोता
            { prefix: "ढ", matra: "ो", suffix: "ल", options: ["ो", "ै", "ा", "ु"] },     // ढोल
            { prefix: "ग", matra: "ो", suffix: "भी", options: ["ी", "ो", "े", "ा"] },    // गोभी
            { prefix: "सम", matra: "ो", suffix: "सा", options: ["ू", "ो", "ि", "ै"] },   // समोसा
            { prefix: "ब", matra: "ो", suffix: "तल", options: ["ो", "ा", "े", "ी"] },    // बोतल
            { prefix: "ट", matra: "ो", suffix: "पी", options: ["ै", "ु", "ो", "ा"] },    // टोपी
            { prefix: "क", matra: "ो", suffix: "यल", options: ["ो", "ी", "ू", "े"] },    // कोयल
            { prefix: "स", matra: "ो", suffix: "ना", options: ["ा", "ो", "ै", "ि"] },    // सोना
            { prefix: "ध", matra: "ो", suffix: "बी", options: ["ो", "ु", "े", "ी"] }     // धोबी
        ];

        let currentIndex = 0;
        let score = 0;

        function startGame() {
            initAudio();
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= questions.length) {
                showFinalScore();
                return;
            }

            const currentQ = questions[currentIndex];
            document.getElementById('q-num').innerText = currentIndex + 1;

            // Display Word with Blank
            const wordBox = document.getElementById('word-box');
            wordBox.innerHTML = `${currentQ.prefix}<span class="matra-blank">?</span>${currentQ.suffix}`;

            // Render Options
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            currentQ.options.forEach(matraOpt => {
                const btn = document.createElement('button');
                btn.className = 'matra-btn';
                btn.innerText = matraOpt;
                btn.onclick = () => checkAnswer(matraOpt, currentQ.matra);
                optionsBox.appendChild(btn);
            });
        }

        function checkAnswer(selectedMatra, correctMatra) {
            if (selectedMatra === correctMatra) {
                playCorrectSound();
                score += 10;
                document.getElementById('score-val').innerText = score;
                
                // Temporarily show correct matra in word
                const currentQ = questions[currentIndex];
                document.getElementById('word-box').innerHTML = `${currentQ.prefix}<span style="color:#16a34a;">${correctMatra}</span>${currentQ.suffix}`;

                setTimeout(() => {
                    currentIndex++;
                    loadQuestion();
                }, 800);
            } else {
                playWrongSound();
                score = Math.max(0, score - 2);
                document.getElementById('score-val').innerText = score;
            }
        }

        function showFinalScore() {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'flex';
            document.getElementById('final-score-text').innerText = score;

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
