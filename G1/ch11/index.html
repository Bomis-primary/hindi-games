<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ओ ( ो ) मात्रा का खेल - 3 लेवल्स</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #fef3c7, #fed7aa);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
        }

        .logo-img {
            max-width: 320px;
            width: 80%;
            height: auto;
            margin-bottom: 30px;
        }

        /* GAME CONTAINER */
        #game-container {
            display: none;
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .game-title {
            color: #ea580c;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .score-bar {
            display: flex;
            justify-content: space-between;
            background-color: #fff7ed;
            border: 2px solid #fdba74;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            color: #c2410c;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .chances-text {
            color: #dc2626;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 16px;
            min-height: 24px;
        }

        .btn-action {
            background: #ea580c;
            color: #ffffff;
            border: none;
            padding: 12px 26px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
            transition: transform 0.1s, background 0.2s;
            touch-action: manipulation;
        }

        .btn-action:active { transform: scale(0.96); }

        /* MAGIC BOX CONTAINER (LEVEL 1) */
        .magic-box-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .magic-box {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s ease;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.15));
        }

        .magic-box.open {
            animation: bounceBox 0.6s ease;
        }

        @keyframes bounceBox {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1); }
        }

        /* QUESTION CARDS */
        .question-card {
            background: #f8fafc;
            border: 3px solid #cbd5e1;
            border-radius: 20px;
            padding: 20px 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .q-img {
            max-width: 150px;
            max-height: 150px;
            object-fit: contain;
            border-radius: 12px;
        }

        .word-display {
            font-size: 36px;
            font-weight: bold;
            color: #1e293b;
            letter-spacing: 2px;
            background: #ffffff;
            padding: 10px 25px;
            border-radius: 16px;
            border: 2px dashed #ea580c;
        }

        /* OPTIONS */
        .options-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #ea580c;
            color: #ea580c;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            touch-action: manipulation;
        }

        .option-btn:active {
            transform: scale(0.95);
            background: #fff7ed;
        }

        /* FINAL SCORE */
        #scoreboard {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .final-score {
            font-size: 48px;
            color: #ea580c;
            margin: 15px 0;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Solutions Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/300x120?text=Innovine+Solutions'">
        <button class="btn-action" onclick="startGame()">खेल शुरू करें (Start Game)</button>
    </div>

    <!-- 2. MAIN GAME CONTAINER -->
    <div id="game-container">
        <h1 class="game-title" id="level-title">लेवल 1: जादुई पिटारा 🎁</h1>
        
        <div class="score-bar">
            <span>स्तर (Level): <span id="lvl-num">1</span>/3</span>
            <span>प्रश्न (Question): <span id="q-num">1</span>/5</span>
            <span>अंक (Score): <span id="score-val">0</span></span>
        </div>

        <div class="chances-text" id="status-msg"></div>

        <!-- LEVEL 1: MAGIC BOX -->
        <div id="level1-area">
            <div class="magic-box-container" id="box-wrapper">
                <div class="magic-box" id="magic-box-icon">🎁</div>
                <p style="color:#64748b; font-weight:bold; margin-top:10px;" id="box-instruction">प्रश्‍न निकालने के लिए पिटारे पर क्लिक करें!</p>
            </div>
            <button class="btn-action" id="open-box-btn" onclick="openMagicBox()">पिटारा खोलें (Open Box)</button>
            
            <div id="l1-question" style="display: none; margin-top: 15px;">
                <div class="question-card">
                    <p style="color:#475569; font-weight:bold;">सही मात्रा चुनें:</p>
                    <div class="word-display" id="l1-word"></div>
                </div>
                <div class="options-container" id="l1-options"></div>
            </div>
        </div>

        <!-- LEVEL 2: PICTURE IDENTIFICATION -->
        <div id="level2-area" style="display: none;">
            <div class="question-card">
                <img id="l2-img" class="q-img" src="" alt="Question Image">
                <p style="color:#475569; font-weight:bold;">चित्र देखकर सही नाम चुनें:</p>
            </div>
            <div class="options-container" id="l2-options"></div>
        </div>

        <!-- LEVEL 3: MISSING WORD FILL -->
        <div id="level3-area" style="display: none;">
            <div class="question-card">
                <p style="color:#475569; font-weight:bold;" id="l3-instruction"></p>
                <div class="word-display" id="l3-sentence"></div>
            </div>
            <div class="options-container" id="l3-options"></div>
        </div>

        <!-- FINAL SCOREBOARD -->
        <div id="scoreboard">
            <h2>अद्भुत प्रदर्शन! 🎉</h2>
            <p style="font-size: 18px; color: #475569; margin-top: 5px;">आपने तीनों लेवल पूरे कर लिए हैं!</p>
            <div class="final-score" id="final-score-text">0</div>
            <button class="btn-action" onclick="location.reload()">फिर से खेलें (Play Again)</button>
        </div>
    </div>

    <!-- AUDIO ELEMENTS FROM ASSETS FOLDER -->
    <audio id="snd-clap" src="assets/clap.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // SOUND FUNCTIONS
        function playClapSound() {
            const audio = document.getElementById('snd-clap');
            audio.currentTime = 0;
            audio.play().catch(e => console.log('Audio play error:', e));
        }

        function playWrongSound() {
            const audio = document.getElementById('snd-wrong');
            audio.currentTime = 0;
            audio.play().catch(e => console.log('Audio play error:', e));
        }

        // GAME STATE VARIABLES
        let currentLevel = 1;
        let currentQIndex = 0;
        let score = 0;
        let attemptsLeft = 2; // Maximum 2 attempts per question

        /* LEVEL DATA */
        const l1Questions = [
            { prefix: "म", matra: "ो", suffix: "र", options: ["ो", "ा", "ी", "े"] },
            { prefix: "त", matra: "ो", suffix: "ता", options: ["ि", "ो", "ू", "ै"] },
            { prefix: "ढ", matra: "ो", suffix: "ल", options: ["ो", "ै", "ा", "ु"] },
            { prefix: "ग", matra: "ो", suffix: "भी", options: ["ी", "ो", "े", "ा"] },
            { prefix: "ब", matra: "ो", suffix: "तल", options: ["ो", "ा", "े", "ी"] }
        ];

        const l2Questions = [
            { img: "assets/mor.png", answer: "मोर", options: ["मोर", "सोना", "लोटा"] },
            { img: "assets/dhol.png", answer: "ढोल", options: ["चोर", "ढोल", "गोल"] },
            { img: "assets/ghoda.png", answer: "घोड़ा", options: ["घोड़ा", "छोटा", "कोयला"] },
            { img: "assets/gobi.png", answer: "गोभी", options: ["टोपी", "धोबी", "गोभी"] },
            { img: "assets/topi.png", answer: "टोपी", options: ["टोपी", "रोटी", "बोतल"] }
        ];

        const l3Questions = [
            { text: "नाचता हुआ _____", ans: "मोर", options: ["मोर", "सोहन", "लोटा"] },
            { text: "कपड़े धोता _____", ans: "धोबी", options: ["धोबी", "कोयल", "जोकर"] },
            { text: "_____ के नीचे छिप गया।", ans: "सोफ़े", options: ["सोफ़े", "समोसा", "रोटी"] },
            { text: "रसोई में गरम-गरम _____ रखे थे।", ans: "समोसे", options: ["बोतल", "समोसे", "गोभी"] },
            { text: "छोटा _____ घर में घुसा।", ans: "खरगोश", options: ["खरगोश", "घोड़ा", "ढोल"] }
        ];

        function startGame() {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            setupLevel();
        }

        function updateScoreBar() {
            document.getElementById('lvl-num').innerText = currentLevel;
            document.getElementById('q-num').innerText = currentQIndex + 1;
            document.getElementById('score-val').innerText = score;
        }

        function resetStatusMsg() {
            attemptsLeft = 2;
            document.getElementById('status-msg').innerText = "";
        }

        function setupLevel() {
            updateScoreBar();
            resetStatusMsg();

            if (currentLevel === 1) {
                document.getElementById('level-title').innerText = "लेवल 1: जादुई पिटारा 🎁";
                document.getElementById('level1-area').style.display = 'block';
                document.getElementById('level2-area').style.display = 'none';
                document.getElementById('level3-area').style.display = 'none';
                document.getElementById('box-wrapper').style.display = 'flex';
                document.getElementById('open-box-btn').style.display = 'inline-block';
                document.getElementById('l1-question').style.display = 'none';
                document.getElementById('magic-box-icon').innerText = '🎁';
            } else if (currentLevel === 2) {
                document.getElementById('level-title').innerText = "लेवल 2: चित्र पहचान कर नाम चुनें 🖼️";
                document.getElementById('level1-area').style.display = 'none';
                document.getElementById('level2-area').style.display = 'block';
                document.getElementById('level3-area').style.display = 'none';
                loadL2Question();
            } else if (currentLevel === 3) {
                document.getElementById('level-title').innerText = "लेवल 3: सही शब्द से वाक्य पूरा करें ✍️";
                document.getElementById('level1-area').style.display = 'none';
                document.getElementById('level2-area').style.display = 'none';
                document.getElementById('level3-area').style.display = 'block';
                loadL3Question();
            }
        }

        /* ---------------- LEVEL 1 LOGIC (MAGIC BOX) ---------------- */
        function openMagicBox() {
            const box = document.getElementById('magic-box-icon');
            const btn = document.getElementById('open-box-btn');
            
            box.classList.add('open');
            btn.disabled = true;

            setTimeout(() => {
                box.innerText = '🎉';
                document.getElementById('box-wrapper').style.display = 'none';
                btn.style.display = 'none';
                document.getElementById('l1-question').style.display = 'block';
                loadL1Question();
                btn.disabled = false;
                box.classList.remove('open');
            }, 600);
        }

        function loadL1Question() {
            resetStatusMsg();
            const q = l1Questions[currentQIndex];
            document.getElementById('l1-word').innerHTML = `${q.prefix}<span style="color:#ea580c; border-bottom:3px solid #ea580c;">?</span>${q.suffix}`;
            
            const optsBox = document.getElementById('l1-options');
            optsBox.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswerAttempt(opt === q.matra);
                optsBox.appendChild(btn);
            });
        }

        /* ---------------- LEVEL 2 LOGIC ---------------- */
        function loadL2Question() {
            resetStatusMsg();
            const q = l2Questions[currentQIndex];
            document.getElementById('l2-img').src = q.img;
            
            const optsBox = document.getElementById('l2-options');
            optsBox.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswerAttempt(opt === q.answer);
                optsBox.appendChild(btn);
            });
        }

        /* ---------------- LEVEL 3 LOGIC ---------------- */
        function loadL3Question() {
            resetStatusMsg();
            const q = l3Questions[currentQIndex];
            document.getElementById('l3-instruction').innerText = "वाक्य पूरा करने के लिए सही शब्द चुनें:";
            document.getElementById('l3-sentence').innerText = q.text;

            const optsBox = document.getElementById('l3-options');
            optsBox.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswerAttempt(opt === q.ans);
                optsBox.appendChild(btn);
            });
        }

        /* ---------------- COMMON 2-CHANCE LOGIC ---------------- */
        function handleAnswerAttempt(isCorrect) {
            if (isCorrect) {
                playClapSound();
                score += (attemptsLeft === 2) ? 10 : 5; // First try = 10 pts, second try = 5 pts
                updateScoreBar();
                document.getElementById('status-msg').style.color = '#16a34a';
                document.getElementById('status-msg').innerText = "सही उत्तर! 👏";
                setTimeout(nextQuestion, 1000);
            } else {
                playWrongSound();
                attemptsLeft--;

                if (attemptsLeft > 0) {
                    document.getElementById('status-msg').style.color = '#dc2626';
                    document.getElementById('status-msg').innerText = `⚠️ गलत उत्तर! 1 मौका बाकी है।`;
                } else {
                    document.getElementById('status-msg').style.color = '#dc2626';
                    document.getElementById('status-msg').innerText = `❌ दोनों मौके समाप्त! अगला प्रश्न...`;
                    setTimeout(nextQuestion, 1200);
                }
            }
        }

        /* NEXT QUESTION & LEVEL CONTROLLER */
        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex >= 5) {
                currentQIndex = 0;
                currentLevel++;
                if (currentLevel > 3) {
                    showFinalScore();
                    return;
                }
            }

            setupLevel();
        }

        function showFinalScore() {
            document.getElementById('level-title').style.display = 'none';
            document.querySelector('.score-bar').style.display = 'none';
            document.getElementById('status-msg').style.display = 'none';
            document.getElementById('level1-area').style.display = 'none';
            document.getElementById('level2-area').style.display = 'none';
            document.getElementById('level3-area').style.display = 'none';
            
            document.getElementById('scoreboard').style.display = 'flex';
            document.getElementById('final-score-text').innerText = score;

            if (typeof confetti === 'function') {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            }
        }
    </script>
</body>
</html>
