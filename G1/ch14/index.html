<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>जादुई दरवाज़ा</title>
    <!-- Canvas Confetti Library for Fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffdde1 100%);
            --card-bg: #ffffff;
            --pink-accent: #ff758c;
            --purple-accent: #a855f7;
            --yellow-glow: #fde047;
            --sky-blue: #38bdf8;
            --mint-green: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Fredoka', 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            box-shadow: 0 20px 40px rgba(255, 117, 140, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-height: 600px) and (min-width: 480px) {
            #app-container {
                height: 92vh;
                border-radius: 36px;
                border: 6px solid rgba(255, 255, 255, 0.9);
            }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px;
            z-index: 10;
        }

        .active-screen {
            display: flex !important;
        }

        /* Screen 1: Splash Screen */
        #splash-screen {
            background: #ffffff;
            justify-content: center;
            z-index: 100;
        }

        #splash-screen img {
            max-width: 70%;
            max-height: 30vh;
            object-fit: contain;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 117, 140, 0.3)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 20px rgba(255, 117, 140, 0.6)); }
        }

        /* Screen 2: Title Screen */
        #title-screen {
            justify-content: center;
            gap: 40px;
            text-align: center;
            background: linear-gradient(180deg, #fff0f3 0%, #ffe3e8 100%);
        }

        .title-badge {
            font-size: 5rem;
            animation: cuteFloat 3s infinite ease-in-out;
            margin-bottom: -10px;
        }

        .main-game-title {
            font-size: clamp(2.4rem, 8vw, 3.2rem);
            color: #ff477e;
            text-shadow: 4px 4px 0px #ffffff, 8px 8px 0px #fbb1bd;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .sub-title {
            font-size: 1.2rem;
            color: #70529d;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Screen 3: How to Play */
        #rules-screen {
            justify-content: space-around;
            text-align: center;
        }

        .screen-heading {
            font-size: 1.8rem;
            color: #ff477e;
            background: #ffffff;
            padding: 10px 24px;
            border-radius: 30px;
            box-shadow: 0 6px 15px rgba(255, 71, 126, 0.15);
        }

        .simple-rules-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 20px;
            width: 95%;
            box-shadow: 0 12px 25px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 3px solid #ffccd5;
        }

        .rule-item {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            font-size: 1.25rem;
            color: #4a4e69;
            font-weight: 600;
        }

        .rule-icon {
            font-size: 2rem;
            background: #fff0f3;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 16px 44px;
            font-size: clamp(1.3rem, 5vw, 1.6rem);
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 3px solid #ffffff;
        }

        .btn:active {
            transform: scale(0.92);
        }

        /* Screen 4: Gameplay */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 16px;
            border-radius: 24px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.04);
            font-size: 1.1rem;
            font-weight: 700;
            color: #5c5470;
        }

        .score-badge {
            background: #fef08a;
            padding: 6px 16px;
            border-radius: 20px;
            color: #854d0e;
            border: 2px solid #fde047;
        }

        .word-display-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .word-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 35px 40px 25px 40px; /* Extra padding top for elevated badge */
            box-shadow: 0 16px 32px rgba(168, 85, 247, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #f3e8ff;
            position: relative;
            min-width: 250px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .base-word-text {
            font-size: clamp(3rem, 11vw, 4.2rem);
            font-weight: 700;
            color: #581c87;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            position: relative;
        }

        /* FIX: Elevated Cute Slot Badge to NOT cover Top Line */
        .cute-slot-top {
            position: absolute;
            top: -46px; /* Shifted higher up so it sits cleanly above the top line */
            left: 50%;
            transform: translateX(-50%);
            background: #fef08a;
            color: #a16207;
            border: 3px dashed #f59e0b;
            border-radius: 16px;
            padding: 2px 10px;
            font-size: 1.1rem;
            animation: cuteBounce 1.5s infinite ease-in-out;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2);
            white-space: nowrap;
            z-index: 5;
        }

        .cute-slot-side {
            background: #fef08a;
            color: #a16207;
            border: 3px dashed #f59e0b;
            border-radius: 16px;
            padding: 2px 12px;
            font-size: 1.4rem;
            margin-left: 10px;
            animation: cuteSlide 1.5s infinite ease-in-out;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2);
            white-space: nowrap;
        }

        @keyframes cuteBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        @keyframes cuteSlide {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(6px); }
        }

        .word-card-correct {
            background: #f0fdf4 !important;
            border-color: #4ade80 !important;
            box-shadow: 0 20px 40px rgba(74, 222, 128, 0.4) !important;
            transform: scale(1.08);
        }

        .word-card-correct .base-word-text {
            color: #166534 !important;
        }

        .hint-text {
            margin-top: 16px;
            font-size: 1.1rem;
            color: #9a3412;
            background: #fff7ed;
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px dashed #fdba74;
            display: none;
            font-weight: 600;
        }

        /* Cute Doors */
        .doors-container {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .door-card {
            flex: 1;
            max-width: 170px;
            height: clamp(150px, 25vh, 190px);
            border-radius: 80px 80px 24px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 4px solid #ffffff;
        }

        .door-card:active {
            transform: scale(0.92);
        }

        .door-chandr {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
        }

        .door-visarg {
            background: linear-gradient(180deg, #34d399 0%, #059669 100%);
        }

        .door-symbol {
            font-size: clamp(3rem, 10vw, 4rem);
            font-weight: 700;
            text-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .door-label {
            font-size: 1.05rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.3);
            padding: 4px 14px;
            border-radius: 14px;
            margin-top: 4px;
        }

        .btn-hint {
            background: #fde047;
            color: #713f12;
            border: none;
            padding: 8px 22px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(253, 224, 71, 0.4);
            margin-bottom: 8px;
        }

        /* Screen 5: Result Screen */
        .result-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 32px 24px;
            width: 90%;
            text-align: center;
            box-shadow: 0 16px 36px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border: 4px solid #ffccd5;
        }

        .result-title {
            font-size: clamp(2rem, 7vw, 2.5rem);
            color: #ff477e;
        }

        .final-score {
            font-size: 1.4rem;
            color: #334155;
            background: #fef08a;
            padding: 14px 28px;
            border-radius: 20px;
            width: 100%;
            font-weight: 700;
        }

        @keyframes cuteFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        .door-correct-anim { animation: openDoor 0.6s ease forwards; }
        .door-wrong-anim { animation: shake 0.4s ease forwards; }

        @keyframes openDoor {
            0% { transform: scale(1); }
            50% { transform: scale(1.12) rotate(4deg); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- Screen 1: Splash Screen -->
        <div id="splash-screen" class="screen active-screen">
            <img src="assets/innovine-logo.png" alt="Innovine Logo">
        </div>

        <!-- Screen 2: Title Screen -->
        <div id="title-screen" class="screen">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <div class="title-badge">🔑✨</div>
                <h1 class="main-game-title">जादुई दरवाज़ा</h1>
                <div class="sub-title">चंद्रबिंदु और विसर्ग खेल</div>
            </div>

            <button class="btn" onclick="goToRules()">
                <span>आगे बढ़ो</span> ➔
            </button>
        </div>

        <!-- Screen 3: Rules Screen -->
        <div id="rules-screen" class="screen">
            <h2 class="screen-heading">खेल कैसे खेलें? 🎮</h2>
            
            <div class="simple-rules-card">
                <div class="rule-item">
                    <div class="rule-icon">👀</div>
                    <div>शब्द को ध्यान से देखो</div>
                </div>
                <div class="rule-item">
                    <div class="rule-icon">🤔</div>
                    <div>सोचो (ँ) आएगा या (ः)</div>
                </div>
                <div class="rule-item">
                    <div class="rule-icon">🚪</div>
                    <div>सही दरवाज़े को छुओ</div>
                </div>
                <div class="rule-item">
                    <div class="rule-icon">⭐</div>
                    <div>अंक जीतो और मज़ा करो!</div>
                </div>
            </div>

            <button class="btn" onclick="startGame()">
                <span>खेल शुरू करें</span> ▶
            </button>
        </div>

        <!-- Screen 4: Game Play Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div>सवाल: <span id="q-count">1</span>/10</div>
                <div class="score-badge">⭐ अंक: <span id="score-val">0</span></div>
                <div id="lives-box" style="font-size: 1.3rem;">❤️ ❤️ ❤️</div>
            </div>

            <div class="word-display-area">
                <div class="word-card" id="word-card">
                    <div class="base-word-text" id="target-word">---</div>
                </div>
                <div class="hint-text" id="hint-box">💡 मदद: ...</div>
            </div>

            <button class="btn-hint" onclick="showHint()">💡 मदद (Hint)</button>

            <div class="doors-container">
                <div class="door-card door-chandr" id="door-chandr" onclick="checkAnswer('ँ')">
                    <div class="door-symbol">ँ</div>
                    <div class="door-label">चंद्रबिंदु</div>
                </div>

                <div class="door-card door-visarg" id="door-visarg" onclick="checkAnswer('ः')">
                    <div class="door-symbol">ः</div>
                    <div class="door-label">विसर्ग</div>
                </div>
            </div>
        </div>

        <!-- Screen 5: Result Screen -->
        <div id="result-screen" class="screen" style="justify-content: center;">
            <div class="result-card">
                <h2 class="result-title" id="result-title">शाबाश! 🎉</h2>
                <div class="final-score" id="final-score-text">
                    कुल अंक: <b>100 / 100</b>
                </div>
                <button class="btn" onclick="restartGame()">
                    🔄 फिर से खेलो
                </button>
            </div>
        </div>

    </div>

    <!-- Audio Effects -->
    <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audio-win" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <script>
        // Expanded Question Bank for High Variety
        const QUESTION_BANK = [
            { wordHTML: '<span>चा<span class="cute-slot-top">✨?✨</span>द</span>', type: "ँ", displayFull: "चाँद", hint: "रात में आसमान में दिखता है" },
            { wordHTML: '<span>प्रात</span><span class="cute-slot-side">✨?✨</span>', type: "ः", displayFull: "प्रातः", hint: "सुबह का समय" },
            { wordHTML: '<span>दा<span class="cute-slot-top">✨?✨</span>त</span>', type: "ँ", displayFull: "दाँत", hint: "खाना चबाने के काम आता है" },
            { wordHTML: '<span>पुन</span><span class="cute-slot-side">✨?✨</span>', type: "ः", displayFull: "पुनः", hint: "फिर से या दोबारा" },
            { wordHTML: '<span>आ<span class="cute-slot-top">✨?✨</span>ख</span>', type: "ँ", displayFull: "आँख", hint: "हम इससे देखते हैं" },
            { wordHTML: '<span>नम</span><span class="cute-slot-side">✨?✨</span>', type: "ः", displayFull: "नमः", hint: "नमस्ते करना" },
            { wordHTML: '<span>मा<span class="cute-slot-top">✨?✨</span></span>', type: "ँ", displayFull: "माँ", hint: "प्यारी मम्मी" },
            { wordHTML: '<span>अत</span><span class="cute-slot-side">✨?✨</span>', type: "ः", displayFull: "अतः", hint: "इसलिए" },
            { wordHTML: '<span>धुआ<span class="cute-slot-top">✨?✨</span></span>', type: "ँ", displayFull: "धुआँ", hint: "आग से निकलता है" },
            { wordHTML: '<span>छ</span><span class="cute-slot-side">✨?✨</span>', type: "ः", displayFull: "छः", hint: "नंबर 6" },
            { wordHTML: '<span>पा<span class="cute-slot-top">✨?✨</span>व</span>', type: "ँ", displayFull: "पाँव", hint: "हम इससे चलते हैं" },
            { wordHTML: '<span>दुः<span class="cute-slot-side">✨?✨</span>ख</span>', type: "ः", displayFull: "दुःख", hint: "उदासी या परेशानी" },
            { wordHTML: '<span>गा<span class="cute-slot-top">✨?✨</span>व</span>', type: "ँ", displayFull: "गाँव", hint: "छोटा और सुंदर देहात" },
            { wordHTML: '<span>सा<span class="cute-slot-top">✨?✨</span>प</span>', type: "ँ", displayFull: "साँप", hint: "सरकने वाला जीव" },
            { wordHTML: '<span>फू<span class="cute-slot-top">✨?✨</span>क</span>', type: "ँ", displayFull: "फूँक", hint: "मुँह से हवा निकालना" }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;
        let isProcessing = false;
        let activeQuestions = [];

        function playAudio(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                showScreen('title-screen');
            }, 3000);
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
        }

        function goToRules() {
            showScreen('rules-screen');
        }

        // True Randomizer Algorithm (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startGame() {
            currentQuestionIndex = 0;
            score = 0;
            lives = 3;
            isProcessing = false;
            
            // Generate 10 brand new random questions every single time!
            activeQuestions = shuffleArray(QUESTION_BANK).slice(0, 10);

            updateHeaderUI();
            loadQuestion();
            showScreen('game-screen');
        }

        function restartGame() {
            showScreen('title-screen');
        }

        function updateHeaderUI() {
            document.getElementById('q-count').innerText = currentQuestionIndex + 1;
            document.getElementById('score-val').innerText = score;
            
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️ ';
            for (let i = lives; i < 3; i++) hearts += '🖤 ';
            document.getElementById('lives-box').innerText = hearts.trim();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= 10 || currentQuestionIndex >= activeQuestions.length) {
                endGame();
                return;
            }

            const q = activeQuestions[currentQuestionIndex];
            const wordCard = document.getElementById('word-card');
            const targetWord = document.getElementById('target-word');
            
            wordCard.className = 'word-card';
            targetWord.innerHTML = q.wordHTML;
            
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = 'none';
            hintBox.innerText = `💡 मदद: ${q.hint}`;

            document.getElementById('door-chandr').className = 'door-card door-chandr';
            document.getElementById('door-visarg').className = 'door-card door-visarg';

            updateHeaderUI();
            isProcessing = false;
        }

        function showHint() {
            document.getElementById('hint-box').style.display = 'block';
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff758c', '#38bdf8', '#34d399', '#fde047', '#a855f7']
                });
            }
        }

        function checkAnswer(selectedMatra) {
            if (isProcessing) return;
            isProcessing = true;

            const q = activeQuestions[currentQuestionIndex];
            const targetDoor = selectedMatra === 'ँ' ? 
                document.getElementById('door-chandr') : document.getElementById('door-visarg');
            const wordCard = document.getElementById('word-card');
            const targetWord = document.getElementById('target-word');

            if (selectedMatra === q.type) {
                playAudio('audio-correct');
                triggerConfetti();
                
                targetDoor.classList.add('door-correct-anim');
                targetWord.innerHTML = q.displayFull;
                wordCard.classList.add('word-card-correct');
                
                score += 10;
                updateHeaderUI();

                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1500);

            } else {
                playAudio('audio-wrong');
                targetDoor.classList.add('door-wrong-anim');
                lives--;
                updateHeaderUI();

                setTimeout(() => {
                    if (lives <= 0) {
                        endGame();
                    } else {
                        targetDoor.classList.remove('door-wrong-anim');
                        isProcessing = false;
                    }
                }, 800);
            }
        }

        function endGame() {
            showScreen('result-screen');
            const resultTitle = document.getElementById('result-title');
            const finalScoreText = document.getElementById('final-score-text');

            if (score >= 70) {
                playAudio('audio-win');
                triggerConfetti();
                setTimeout(triggerConfetti, 300);
                resultTitle.innerText = "शाबाश! आपने कर दिखाया! 🎉";
            } else {
                resultTitle.innerText = "अच्छा प्रयास! फिर खेलो! 💪";
            }

            finalScoreText.innerHTML = `कुल अंक: <b>${score} / 100</b>`;
        }
    </script>
</body>
</html>
