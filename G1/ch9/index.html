<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ए की मात्रा - खेल और अभ्यास</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Navigation / Header Bar */
    header {
      width: 100%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
    }

    .logo {
      height: 45px;
      object-fit: contain;
    }

    .scoreboard {
      display: flex;
      gap: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
    }

    .score-box {
      background: #ffeaa7;
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid #fdcb6e;
    }

    /* Main Container */
    .game-container {
      width: 95%;
      max-width: 800px;
      margin: 15px auto;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Level Tabs */
    .level-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 14px;
      border: none;
      background: #e0e0e0;
      border-radius: 12px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: #6c5ce7;
      color: white;
      transform: scale(1.05);
    }

    .q-title {
      font-size: 1.3rem;
      color: #2d3436;
      margin-bottom: 15px;
      font-weight: bold;
    }

    /* Common Card / Asset Image Holder */
    .asset-img {
      max-height: 130px;
      max-width: 100%;
      border-radius: 10px;
      margin: 10px auto;
      display: block;
      object-fit: contain;
    }

    /* Level 1: Memory Maze (Flip Cards) */
    .grid-memory {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 450px;
      margin: 0 auto;
    }

    .card {
      height: 80px;
      background: #74b9ff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      perspective: 1000px;
      transition: transform 0.3s;
    }

    .card.flipped {
      background: #0984e3;
    }

    .card.matched {
      background: #55efc4;
      color: #2d3436;
      cursor: default;
    }

    /* Level 2: Interactive Word Catch & Options */
    .word-options-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .word-btn {
      padding: 15px 30px;
      font-size: 1.4rem;
      font-weight: bold;
      background: #a29bfe;
      color: white;
      border: 3px solid #6c5ce7;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 5px #6c5ce7;
      transition: all 0.1s;
    }

    .word-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px #6c5ce7;
    }

    /* Level 3: Drag and Drop Corner Categorization */
    .drag-zone-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .drop-corner {
      min-height: 100px;
      border: 2px dashed #0984e3;
      border-radius: 12px;
      background: #e1f5fe;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .drop-corner h4 {
      margin: 0 0 5px 0;
      font-size: 0.95rem;
      color: #0984e3;
    }

    .draggable-word {
      padding: 8px 12px;
      background: #fdcb6e;
      border-radius: 8px;
      font-weight: bold;
      cursor: grab;
      touch-action: none;
      display: inline-block;
      margin: 5px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.16);
    }

    /* Level 4: Interactive Crossword Grid */
    .crossword-board {
      display: grid;
      grid-template-columns: repeat(5, 45px);
      grid-template-rows: repeat(5, 45px);
      gap: 5px;
      justify-content: center;
      margin: 15px auto;
    }

    .cw-cell {
      width: 45px;
      height: 45px;
      background: #dfe6e9;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .cw-cell.active {
      background: #ffffff;
      border: 2px solid #6c5ce7;
    }

    .cw-cell input {
      width: 100%;
      height: 100%;
      border: none;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      background: transparent;
      outline: none;
    }

    /* Responsive Design Adjustments */
    @media (max-width: 500px) {
      .grid-memory { grid-template-columns: repeat(3, 1fr); }
      .crossword-board { grid-template-columns: repeat(5, 38px); grid-template-rows: repeat(5, 38px); }
      .cw-cell { width: 38px; height: 38px; }
      .word-btn { padding: 10px 20px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <img src="assets/innovine-logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    <div class="scoreboard">
      <div class="score-box">स्तर: <span id="level-num">1</span>/4</div>
      <div class="score-box">अंक: <span id="score-val">0</span></div>
    </div>
  </header>

  <!-- Interactive Game Body -->
  <div class="game-container">
    <div>
      <div class="level-tabs">
        <button class="tab-btn active" onclick="loadLevel(1)">स्तर 1: शब्द-जोड़ी</button>
        <button class="tab-btn" onclick="loadLevel(2)">स्तर 2: सही शब्द चुनें</button>
        <button class="tab-btn" onclick="loadLevel(3)">स्तर 3: कोना चुनिए</button>
        <button class="tab-btn" onclick="loadLevel(4)">स्तर 4: वर्ग-पहेली</button>
      </div>
      <hr style="border:0; border-top: 1px solid #eee; margin-bottom: 15px;">
      
      <div id="game-view">
        <!-- Content gets rendered dynamically -->
      </div>
    </div>

    <!-- Hidden Audio Elements using the provided assets -->
    <audio id="audio-correct" src="assets/correct.mp3"></audio>
    <audio id="audio-wrong" src="https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3"></audio>
  </div>

  <script>
    // Audio controller
    function playSound(type) {
      const snd = document.getElementById(type === 'correct' ? 'audio-correct' : 'audio-wrong');
      if (snd) {
        snd.currentTime = 0;
        snd.play().catch(e => console.log('Audio play blocked:', e));
      }
    }

    // State Variables
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let totalScore = 0;

    // --- LEVEL 1 DATA: Memory Maze (5 Sets) ---
    const memoryMazeSets = [
      [ {t:'केला', id:1}, {t:'केला', id:1}, {t:'सेब', id:2}, {t:'सेब', id:2} ],
      [ {t:'रेल', id:1}, {t:'रेल', id:1}, {t:'पेड़', id:2}, {t:'पेड़', id:2} ],
      [ {t:'मेज़', id:1}, {t:'मेज़', id:1}, {t:'शेर', id:2}, {t:'शेर', id:2} ],
      [ {t:'नेवला', id:1}, {t:'नेवला', id:1}, {t:'कपड़े', id:2}, {t:'कपड़े', id:2} ],
      [ {t:'सवेरा', id:1}, {t:'सवेरा', id:1}, {t:'बेलन', id:2}, {t:'बेलन', id:2} ]
    ];

    // --- LEVEL 2 DATA: Catch Correct Word (5 Questions) ---
    const catchWordQuestions = [
      { img: 'assets/kela.png', correct: 'केला', wrong: 'कला', prompt: 'सही शब्द पर क्लिक करें:' },
      { img: 'assets/apple.png', correct: 'सेब', wrong: 'सब', prompt: 'सही शब्द पर क्लिक करें:' },
      { img: 'assets/table.png', correct: 'मेज', wrong: 'मज', prompt: 'सही शब्द पर क्लिक करें:' },
      { img: 'assets/ambulance.png', correct: 'एम्बुलेंस', wrong: 'अम्बुलेंस', prompt: 'सही शब्द पर क्लिक करें:' },
      { img: 'assets/ekta.png', correct: 'एकता', wrong: 'अकता', prompt: 'सही शब्द पर क्लिक करें:' }
    ];

    // --- LEVEL 3 DATA: Drag and Drop Corner Categorization (Image Reference: image_d91e66.jpg) ---
    const dropCornersData = [
      { id: 'corner-play', title: 'खेल कोना ⚽', targets: ['खेल', 'गेंद'] },
      { id: 'corner-food', title: 'खाने का कोना 🍌', targets: ['सेब', 'केले'] },
      { id: 'corner-train', title: 'रेल कोना 🚂', targets: ['रेल', 'स्टेशन'] },
      { id: 'corner-tree', title: 'पेड़ वाला कोना 🌳', targets: ['पेड़', 'बैठे'] }
    ];
    const draggableWordsList = ['खेल', 'गेंद', 'सेब', 'केले', 'रेल', 'स्टेशन', 'पेड़', 'बैठे'];

    // --- LEVEL 4 DATA: Crossword Games (5 Words / Puzzles) ---
    const crosswordPuzzles = [
      { hint: '1. पटरी पर दौड़ती है (र_ल)', word: 'रेल', grid: [['रे','ल']] },
      { hint: '2. लाल-लाल फल (से_)', word: 'सेब', grid: [['से','ब']] },
      { hint: '3. मीठा पीला फल (के_ा)', word: 'केला', grid: [['के','ला']] },
      { hint: '4. हरा-भरा छाया देने वाला (पे_)', word: 'पेड़', grid: [['पे','ड़']] },
      { hint: '5. सुबह का समय (स_ेरा)', word: 'सवेरा', grid: [['स','वे','रा']] }
    ];

    // --- MASTER LEVEL SWITCHER ---
    function loadLevel(lvl) {
      currentLevel = lvl;
      currentQuestionIndex = 0;
      document.getElementById('level-num').innerText = lvl;
      
      // Update Tab Styles
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === lvl);
      });

      const view = document.getElementById('game-view');
      view.innerHTML = '';

      if (lvl === 1) renderMemoryMaze();
      else if (lvl === 2) renderCatchWord();
      else if (lvl === 3) renderDragDropCorner();
      else if (lvl === 4) renderCrossword();
    }

    // ==========================================
    // LEVEL 1: MEMORY MAZE FLIP
    // ==========================================
    let flippedCards = [];
    let matchedPairsCount = 0;

    function renderMemoryMaze() {
      const view = document.getElementById('game-view');
      const cardsData = [...memoryMazeSets[currentQuestionIndex]].sort(() => Math.random() - 0.5);
      flippedCards = [];
      matchedPairsCount = 0;

      view.innerHTML = `
        <div class="q-title">स्मृति खेल (Memory Maze) - प्रश्न ${currentQuestionIndex + 1}/5</div>
        <p style="color:#666;">समान 'े' मात्रा वाले शब्दों के जोड़े ढूंढें!</p>
        <div class="grid-memory" id="memory-grid"></div>
      `;

      const grid = document.getElementById('memory-grid');
      cardsData.forEach((item, idx) => {
        const cardElem = document.createElement('div');
        cardElem.className = 'card';
        cardElem.dataset.id = item.id;
        cardElem.dataset.text = item.t;
        cardElem.innerText = '?';
        cardElem.onclick = () => handleCardClick(cardElem);
        grid.appendChild(cardElem);
      });
    }

    function handleCardClick(card) {
      if (flippedCards.length < 2 && !card.classList.contains('flipped') && !card.classList.contains('matched')) {
        card.classList.add('flipped');
        card.innerText = card.dataset.text;
        flippedCards.push(card);

        if (flippedCards.length === 2) {
          if (flippedCards[0].dataset.id === flippedCards[1].dataset.id) {
            // Correct Match
            playSound('correct');
            flippedCards.forEach(c => c.classList.add('matched'));
            flippedCards = [];
            matchedPairsCount++;
            addScore(10);

            if (matchedPairsCount === 2) { // 2 pairs per set
              setTimeout(() => {
                if (currentQuestionIndex < 4) {
                  currentQuestionIndex++;
                  renderMemoryMaze();
                } else {
                  triggerConfetti();
                  alert('स्तर 1 पूरा हुआ! बहुत बढ़िया!');
                  loadLevel(2);
                }
              }, 800);
            }
          } else {
            // Wrong Match
            playSound('wrong');
            setTimeout(() => {
              flippedCards.forEach(c => {
                c.classList.remove('flipped');
                c.innerText = '?';
              });
              flippedCards = [];
            }, 800);
          }
        }
      }
    }

    // ==========================================
    // LEVEL 2: CATCH THE CORRECT WORD
    // ==========================================
    function renderCatchWord() {
      const q = catchWordQuestions[currentQuestionIndex];
      const view = document.getElementById('game-view');
      
      // Randomize option order
      const options = [q.correct, q.wrong].sort(() => Math.random() - 0.5);

      view.innerHTML = `
        <div class="q-title">सही शब्द पकड़ो - प्रश्न ${currentQuestionIndex + 1}/5</div>
        <img src="${q.img}" class="asset-img" alt="Illustration" onerror="this.style.display='none'">
        <p style="font-size:1.1rem; color:#333;">${q.prompt}</p>
        <div class="word-options-container">
          <button class="word-btn" onclick="checkCatchWord('${options[0]}', '${q.correct}')">${options[0]}</button>
          <button class="word-btn" onclick="checkCatchWord('${options[1]}', '${q.correct}')">${options[1]}</button>
        </div>
      `;
    }

    function checkCatchWord(selected, correct) {
      if (selected === correct) {
        playSound('correct');
        addScore(10);
        if (currentQuestionIndex < 4) {
          currentQuestionIndex++;
          renderCatchWord();
        } else {
          triggerConfetti();
          alert('स्तर 2 पूरा हुआ! शानदार!');
          loadLevel(3);
        }
      } else {
        playSound('wrong');
      }
    }

    // ==========================================
    // LEVEL 3: DRAG & DROP CORNER CATEGORIZATION
    // ==========================================
    function renderDragDropCorner() {
      const view = document.getElementById('game-view');
      view.innerHTML = `
        <div class="q-title">सही शब्द को सही कोने में रखें (Drag & Drop)</div>
        <p style="font-size:0.95rem; color:#555;">शब्दों को खींचकर या छूकर उनके सही कोने में रखें:</p>
        <img src="assets/table.png" class="asset-img" alt="Table Asset" style="max-height:80px;" onerror="this.style.display='none'">
        
        <div id="drag-words-pool" style="margin-bottom:15px; min-height:50px;"></div>

        <div class="drag-zone-container">
          ${dropCornersData.map(c => `
            <div class="drop-corner" id="${c.id}" ondragover="allowDrop(event)" ondrop="handleDrop(event, '${c.id}')">
              <h4>${c.title}</h4>
            </div>
          `).join('')}
        </div>
      `;

      const pool = document.getElementById('drag-words-pool');
      // Shuffle words
      [...draggableWordsList].sort(() => Math.random() - 0.5).forEach(word => {
        const span = document.createElement('span');
        span.className = 'draggable-word';
        span.innerText = word;
        span.draggable = true;
        span.id = 'word-' + word;
        span.ondragstart = (e) => e.dataTransfer.setData('text', e.target.id);
        
        // Touch fallback for Mobile Compatibility
        span.onclick = () => mobileTouchSelect(span);

        pool.appendChild(span);
      });
    }

    function allowDrop(ev) { ev.preventDefault(); }

    function handleDrop(ev, cornerId) {
      ev.preventDefault();
      const data = ev.dataTransfer.getData('text');
      const elem = document.getElementById(data);
      if(!elem) return;

      const word = elem.innerText;
      const corner = dropCornersData.find(c => c.id === cornerId);

      if (corner && corner.targets.includes(word)) {
        playSound('correct');
        document.getElementById(cornerId).appendChild(elem);
        elem.draggable = false;
        elem.onclick = null;
        elem.style.background = '#55efc4';
        addScore(10);
        checkLevel3Completion();
      } else {
        playSound('wrong');
      }
    }

    // Mobile-friendly Touch Fallback
    let selectedMobileWord = null;
    function mobileTouchSelect(elem) {
      if (selectedMobileWord) selectedMobileWord.style.border = 'none';
      selectedMobileWord = elem;
      elem.style.border = '2px solid #6c5ce7';
      
      alert(`'${elem.innerText}' चुना गया। अब नीचे दिए गए सही कोने पर क्लिक करें।`);
      
      dropCornersData.forEach(c => {
        const cornerElem = document.getElementById(c.id);
        cornerElem.onclick = () => {
          if (selectedMobileWord) {
            const word = selectedMobileWord.innerText;
            if (c.targets.includes(word)) {
              playSound('correct');
              cornerElem.appendChild(selectedMobileWord);
              selectedMobileWord.style.border = 'none';
              selectedMobileWord.style.background = '#55efc4';
              selectedMobileWord.onclick = null;
              selectedMobileWord = null;
              addScore(10);
              checkLevel3Completion();
            } else {
              playSound('wrong');
            }
          }
        };
      });
    }

    function checkLevel3Completion() {
      const pool = document.getElementById('drag-words-pool');
      if (pool.children.length === 0) {
        setTimeout(() => {
          triggerConfetti();
          alert('अद्भुत! स्तर 3 पूरा हुआ!');
          loadLevel(4);
        }, 500);
      }
    }

    // ==========================================
    // LEVEL 4: CROSSWORD PUZZLE
    // ==========================================
    function renderCrossword() {
      const view = document.getElementById('game-view');
      const puzzle = crosswordPuzzles[currentQuestionIndex];

      view.innerHTML = `
        <div class="q-title">वर्ग-पहेली (Crossword) - प्रश्न ${currentQuestionIndex + 1}/5</div>
        <p style="font-size:1.2rem; font-weight:bold; color:#0984e3;">${puzzle.hint}</p>
        
        <div class="crossword-board" id="cw-board"></div>
        
        <button class="word-btn" style="margin-top:15px; padding:10px 20px;" onclick="checkCrosswordAnswer()">उत्तर जाँचें</button>
      `;

      const board = document.getElementById('cw-board');
      puzzle.grid[0].forEach((char, i) => {
        const cell = document.createElement('div');
        cell.className = 'cw-cell active';
        
        const input = document.createElement('input');
        input.maxLength = 2;
        input.dataset.correct = char;
        input.id = `cw-in-${i}`;

        cell.appendChild(input);
        board.appendChild(cell);
      });
    }

    function checkCrosswordAnswer() {
      const puzzle = crosswordPuzzles[currentQuestionIndex];
      let userAns = '';
      
      puzzle.grid[0].forEach((_, i) => {
        const val = document.getElementById(`cw-in-${i}`).value.trim();
        userAns += val;
      });

      if (userAns === puzzle.word) {
        playSound('correct');
        addScore(10);
        if (currentQuestionIndex < 4) {
          currentQuestionIndex++;
          renderCrossword();
        } else {
          triggerConfetti();
          alert('बधाई हो! आपने सभी 4 स्तर सफलतापूर्वक पूरे कर लिए हैं! 🏆');
        }
      } else {
        playSound('wrong');
      }
    }

    // Helper Score & Confetti trigger
    function addScore(pts) {
      totalScore += pts;
      document.getElementById('score-val').innerText = totalScore;
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    // Initialize Game on Load
    window.onload = () => {
      loadLevel(1);
    };
  </script>
</body>
</html>
