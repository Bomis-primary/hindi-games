<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>कोयल और व्याकरण - जंगल एडवेंचर</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.96);
      --accent-color: #10b981;
      --text-color: #f8fafc;
      --highlight-yellow: #fbbf24;
      --highlight-cyan: #38bdf8;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      font-family: 'Baloo 2', 'Comic Sans MS', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #090d16;
      background-image: 
        radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(251, 191, 36, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .game-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 580px;
      padding: 25px 20px;
      border: 4px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    /* Screen 1: Logo */
    .logo-only-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
      cursor: pointer;
      width: 100%;
    }

    .logo-wrapper {
      background: rgba(255, 255, 255, 0.05);
      padding: 25px;
      border-radius: 24px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      margin-bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img-large {
      max-width: 260px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
    }

    /* Stats Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      padding: 12px 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--highlight-cyan);
      border: 2px solid var(--border-color);
    }

    .btn {
      width: 100%;
      max-width: 320px;
      padding: 14px 20px;
      margin-top: 12px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
      color: #064e3b;
      font-weight: 800;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #047857, 0 12px 20px rgba(0,0,0,0.3);
      transition: all 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #047857, 0 15px 25px rgba(0,0,0,0.4);
      background: linear-gradient(180deg, #6ee7b7 0%, #10b981 100%);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #047857, 0 6px 10px rgba(0,0,0,0.3);
    }

    .btn-secondary {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #0c4a6e;
      box-shadow: 0 6px 0 #0369a1, 0 12px 20px rgba(0,0,0,0.3);
    }

    .btn-secondary:hover {
      background: linear-gradient(180deg, #7dd3fc 0%, #0284c7 100%);
      box-shadow: 0 8px 0 #0369a1, 0 15px 25px rgba(0,0,0,0.4);
    }

    /* Level Selector Cards */
    .level-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      margin: 15px 0;
    }

    .stage-image {
      font-size: 4rem;
      margin: 5px 0;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    /* Speech Bubble */
    .speech-bubble {
      position: relative;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 3px solid var(--highlight-cyan);
      border-radius: 20px;
      padding: 18px;
      width: 100%;
      font-size: 1.2rem;
      line-height: 1.6;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }

    .blank-target {
      color: var(--highlight-yellow);
      background: rgba(251, 191, 36, 0.15);
      padding: 2px 10px;
      border-radius: 8px;
      border: 2px dashed var(--highlight-yellow);
      font-weight: 700;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .word-chip {
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      color: var(--highlight-cyan);
      border: 2px solid var(--highlight-cyan);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .word-chip:hover {
      background: var(--highlight-cyan);
      color: #0f172a;
      transform: scale(1.05);
    }

    .feedback {
      font-size: 1.15rem;
      font-weight: 700;
      min-height: 35px;
      margin-top: 15px;
      padding: 8px 15px;
      border-radius: 12px;
    }

    .stars {
      font-size: 2rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="game-card">

  <!-- 1) LOGO SCREEN -->
  <div id="screen-logo" class="screen">
    <div class="logo-only-container" onclick="showScreen('screen-levels')">
      <div class="logo-wrapper">
        <img src="assets/logo.png" alt="Innovine Logo" class="logo-img-large" onerror="this.src='https://via.placeholder.com/280x100?text=Innovine';">
      </div>
      <button class="btn">आगे बढ़ें ▶</button>
    </div>
  </div>

  <!-- 2) LEVEL SELECTION SCREEN -->
  <div id="screen-levels" class="screen hidden">
    <h2 style="color: var(--highlight-yellow); margin: 0 0 10px 0; font-size: 1.8rem;">🎯 खेल का स्तर चुनें</h2>
    <div class="level-container">
      <button class="btn" onclick="startSelectedLevel(1)">
        लेवल 1: कोयल कविता (कविता ज्ञान) 🐦
      </button>
      <button class="btn btn-secondary" onclick="startSelectedLevel(2)">
        लेवल 2: भाषा, लिपि और वर्णमाला (व्याकरण) 📚
      </button>
    </div>
  </div>

  <!-- 3) MAIN GAME SCREEN -->
  <div id="screen-game" class="screen hidden">
    <div class="status-bar">
      <span id="stage-indicator">पड़ाव: 1/10</span>
      <span id="score-indicator">🥭 स्कोर: 0</span>
    </div>

    <div class="stage-image" id="game-avatar">🐦</div>
    
    <div class="speech-bubble-container" style="width:100%;">
      <div id="speech-bubble" class="speech-bubble"></div>
    </div>

    <div id="word-bank" class="word-bank"></div>
    <div id="feedback-msg" class="feedback"></div>

    <button id="next-btn" class="btn hidden" onclick="nextQuestion()">आगे बढ़ें ▶</button>
  </div>

  <!-- 4) END SCREEN -->
  <div id="screen-end" class="screen hidden">
    <div class="stars">✨ ⭐ ✨</div>
    <div class="stage-image" id="end-avatar">👑</div>
    <h1 id="end-title" style="color: #34d399; margin: 0; font-size: 2rem;">शाबाश!</h1>
    <p id="end-msg" style="font-size: 1.2rem; line-height: 1.6; margin: 15px 0; font-weight: 600;"></p>
    
    <button class="btn" onclick="showScreen('screen-levels')">मुख्य मेनू 🎯</button>
    <button class="btn btn-secondary" onclick="restartCurrentLevel()">पुनः खेलें 🔄</button>
  </div>

</div>

<script>
  let currentLevelMode = 1;
  let currentQuestionIdx = 0;
  let score = 0;
  let activeQuestions = [];

  // Audio Context synth for sound effects
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSynthSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'select') {
      osc.frequency.setValueAtTime(450, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.setValueAtTime(140, now + 0.12);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  }

  // LEVEL 1: Poem Questions
  const level1Questions = [
    {
      avatar: "🐦",
      template: "कोयल का रंग <span class='blank-target'>[ _____ ]</span> होता है और वह आम के पेड़ पर बैठती है।",
      words: ["काला", "सफ़ेद", "हरी"],
      correct: "काला",
      successMsg: "✨ वाह! कोयल काली होती है! 🥭",
      failMsg: "❌ सही उत्तर 'काला' है।"
    },
    {
      avatar: "🐦",
      template: "कोयल अपनी मीठी आवाज़ में <span class='blank-target'>[ _____ ]</span> गाती है।",
      words: ["कुहू-कुहू", "काँव-काँव", "चीँ-चीँ"],
      correct: "कुहू-कुहू",
      successMsg: "🎶 'कुहू-कुहू!' आपने आम के बाग में मिठास घोल दी! 🍬",
      failMsg: "❌ सही उत्तर 'कुहू-कुहू' है।"
    },
    {
      avatar: "🐦",
      template: "कोयल कूक-कूक कर आमों में <span class='blank-target'>[ _____ ]</span> घोल देती है।",
      words: ["मिश्री", "नमक", "मिर्ची"],
      correct: "मिश्री",
      successMsg: "✨ बहुत बढ़िया! मिश्री जैसी मिठास घुल गई!",
      failMsg: "❌ सही उत्तर 'मिश्री' है।"
    },
    {
      avatar: "🌧️",
      template: "प्यासी धरती को देखकर कोयल <span class='blank-target'>[ _____ ]</span> से पानी माँगती है।",
      words: ["मेघों", "सूरज", "हवा"],
      correct: "मेघों",
      successMsg: "🌧️ शाबाश! कोयल मेघों (बादलों) से वर्षा माँगती है! 💧",
      failMsg: "❌ सही उत्तर 'मेघों' है।"
    },
    {
      avatar: "🐣",
      template: "कोयल को मीठा बोलना उसकी <span class='blank-target'>[ _____ ]</span> ने सिखाया है।",
      words: ["माँ", "दादी", "सहेली"],
      correct: "माँ",
      successMsg: "💖 सही पहचाना! माँ की सीख से ही कोयल मीठा बोलती है!",
      failMsg: "❌ सही उत्तर 'माँ' है।"
    }
  ];

  // LEVEL 2: Original Grammar Questions (Based on textbook: Bhasha, Lipi aur Varnamala)
  const level2Questions = [
    {
      avatar: "🗣️",
      template: "हम अपने विचार बोलकर या लिखकर दूसरों तक पहुँचाते हैं, उसे <span class='blank-target'>[ _____ ]</span> कहते हैं।",
      words: ["भाषा", "लिपि", "वर्ण"],
      correct: "भाषा",
      successMsg: "✨ सही! विचारों का आदान-प्रदान 'भाषा' कहलाता है! 📚",
      failMsg: "❌ सही उत्तर 'भाषा' है।"
    },
    {
      avatar: "🎙️",
      template: "हम जो मुँह से बोलते हैं, वह भाषा का <span class='blank-target'>[ _____ ]</span> रूप है।",
      words: ["मौखिक", "लिखित", "सांकेतिक"],
      correct: "मौखिक",
      successMsg: "🎉 बिल्कुल सही! बोली जाने वाली भाषा 'मौखिक' होती है!",
      failMsg: "❌ सही उत्तर 'मौखिक' है।"
    },
    {
      avatar: "✍️",
      template: "हम जो कागज़ पर लिखते हैं, वह भाषा का <span class='blank-target'>[ _____ ]</span> रूप है।",
      words: ["लिखित", "मौखिक", "ध्वनि"],
      correct: "लिखित",
      successMsg: "📝 शाबाश! लिखा जाने वाला रूप 'लिखित भाषा' है!",
      failMsg: "❌ सही उत्तर 'लिखित' है।"
    },
    {
      avatar: "📜",
      template: "हिन्दी भाषा <span class='blank-target'>[ _____ ]</span> लिपि में लिखी जाती है।",
      words: ["देवनागरी", "रोमन", "गुरुमुखी"],
      correct: "देवनागरी",
      successMsg: "🌟 शानदार! हिन्दी की लिपि 'देवनागरी' है!",
      failMsg: "❌ सही उत्तर 'देवनागरी' है।"
    },
    {
      avatar: "🔤",
      template: "अंग्रेज़ी भाषा <span class='blank-target'>[ _____ ]</span> लिपि में लिखी जाती है।",
      words: ["रोमन", "देवनागरी", "फारसी"],
      correct: "रोमन",
      successMsg: "🎯 बहुत बढ़िया! अंग्रेज़ी 'रोमन' लिपि में लिखी जाती है!",
      failMsg: "❌ सही उत्तर 'रोमन' है।"
    }
  ];

  function shuffleArray(array) {
    return [...array].sort(() => Math.random() - 0.5);
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(screenId).classList.remove('hidden');
  }

  function startSelectedLevel(lvl) {
    currentLevelMode = lvl;
    currentQuestionIdx = 0;
    score = 0;

    if (lvl === 1) {
      activeQuestions = shuffleArray(level1Questions);
    } else {
      activeQuestions = shuffleArray(level2Questions);
    }

    showScreen('screen-game');
    loadQuestion();
  }

  function loadQuestion() {
    const q = activeQuestions[currentQuestionIdx];
    document.getElementById('stage-indicator').innerText = `पड़ाव: ${currentQuestionIdx + 1}/${activeQuestions.length}`;
    document.getElementById('score-indicator').innerText = `🥭 स्कोर: ${score}`;
    document.getElementById('game-avatar').innerText = q.avatar;
    document.getElementById('speech-bubble').innerHTML = q.template;

    const feedback = document.getElementById('feedback-msg');
    feedback.innerText = '';
    feedback.style.background = 'transparent';

    document.getElementById('next-btn').classList.add('hidden');

    const wordBank = document.getElementById('word-bank');
    wordBank.innerHTML = '';
    wordBank.classList.remove('hidden');

    // Shuffle options dynamically each time
    const shuffledWords = shuffleArray(q.words);

    shuffledWords.forEach(word => {
      const chip = document.createElement('div');
      chip.className = 'word-chip';
      chip.innerText = word;
      chip.onclick = () => handleWordSelect(word);
      wordBank.appendChild(chip);
    });
  }

  function handleWordSelect(selectedWord) {
    playSynthSound('select');
    const q = activeQuestions[currentQuestionIdx];
    const feedback = document.getElementById('feedback-msg');
    document.getElementById('word-bank').classList.add('hidden');

    const filledSentence = q.template.replace(
      "<span class='blank-target'>[ _____ ]</span>",
      `<strong style='color: var(--highlight-yellow); background: rgba(251, 191, 36, 0.2); padding: 2px 10px; border-radius: 8px;'>${selectedWord}</strong>`
    );
    document.getElementById('speech-bubble').innerHTML = filledSentence;

    if (selectedWord === q.correct) {
      playSynthSound('correct');
      score++;
      feedback.style.color = '#34d399';
      feedback.style.background = 'rgba(52, 211, 153, 0.1)';
      feedback.innerText = q.successMsg;
    } else {
      playSynthSound('wrong');
      feedback.style.color = '#f87171';
      feedback.style.background = 'rgba(248, 113, 113, 0.1)';
      feedback.innerText = q.failMsg;
    }

    document.getElementById('score-indicator').innerText = `🥭 स्कोर: ${score}`;
    document.getElementById('next-btn').classList.remove('hidden');
  }

  function nextQuestion() {
    currentQuestionIdx++;
    if (currentQuestionIdx < activeQuestions.length) {
      loadQuestion();
    } else {
      showEndScreen();
    }
  }

  function showEndScreen() {
    showScreen('screen-end');
    const endAvatar = document.getElementById('end-avatar');
    const endTitle = document.getElementById('end-title');
    const endMsg = document.getElementById('end-msg');

    if (score === activeQuestions.length) {
      endAvatar.innerText = "👑✨";
      endTitle.innerText = "🏆 सर्वश्रेष्ठ प्रदर्शन!";
      endMsg.innerText = `अद्भुत! आपने सभी ${activeQuestions.length} प्रश्नों के सही उत्तर दिए! 🎉`;
    } else {
      endAvatar.innerText = "⭐";
      endTitle.innerText = "बहुत बढ़िया!";
      endMsg.innerText = `आपने ${activeQuestions.length} में से ${score} अंक प्राप्त किए। फिर से प्रयास करें! 🚀`;
    }
  }

  function restartCurrentLevel() {
    startSelectedLevel(currentLevelMode);
  }
</script>

</body>
</html>
