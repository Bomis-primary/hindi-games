<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कोयल - जंगल एडवेंचर</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.95);
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-color: #f8fafc;
      --highlight-yellow: #fbbf24;
      --highlight-cyan: #38bdf8;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Baloo 2', 'Comic Sans MS', cursive, sans-serif;
      background: #090d16;
      background-image: 
        radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(251, 191, 36, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .game-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 580px;
      padding: 30px 25px;
      border: 4px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    /* Screen 1: Logo / Splash */
    .logo-only-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
      cursor: pointer;
      width: 100%;
    }

    .logo-wrapper {
      background: rgba(255, 255, 255, 0.05);
      padding: 25px;
      border-radius: 24px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      margin-bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img-large {
      max-width: 260px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
    }

    /* Stats Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      padding: 12px 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--highlight-cyan);
      border: 2px solid var(--border-color);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* Buttons */
    .btn {
      width: 100%;
      max-width: 280px;
      padding: 14px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
      color: #064e3b;
      font-weight: 800;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #047857, 0 12px 20px rgba(0,0,0,0.3);
      transition: all 0.15s ease;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #047857, 0 15px 25px rgba(0,0,0,0.4);
      background: linear-gradient(180deg, #6ee7b7 0%, #10b981 100%);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #047857, 0 6px 10px rgba(0,0,0,0.3);
    }

    /* Instructions Card */
    .instruction-card {
      text-align: left;
      background: rgba(15, 23, 42, 0.8);
      padding: 20px;
      border-radius: 20px;
      font-size: 1.15rem;
      line-height: 1.7;
      width: 100%;
      border-left: 6px solid var(--highlight-yellow);
      border-right: 1px solid var(--border-color);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .instruction-card p {
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Avatars & Visual Elements */
    .stage-image {
      font-size: 4.5rem;
      margin: 5px 0 15px 0;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    /* Speech Bubble Styling */
    .speech-bubble-container {
      position: relative;
      width: 100%;
      margin-bottom: 25px;
    }

    .speech-bubble {
      position: relative;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 3px solid var(--highlight-cyan);
      border-radius: 24px;
      padding: 22px 20px;
      width: 100%;
      font-size: 1.25rem;
      line-height: 1.7;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 14px 16px 14px;
      border-style: solid;
      border-color: transparent transparent var(--highlight-cyan) transparent;
      display: block;
      width: 0;
    }

    .blank-target {
      color: var(--highlight-yellow);
      background: rgba(251, 191, 36, 0.15);
      padding: 4px 12px;
      border-radius: 10px;
      border: 2px dashed var(--highlight-yellow);
      font-weight: 700;
      display: inline-block;
      margin: 0 4px;
    }

    /* Word Bank */
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
      margin-top: 5px;
    }

    .word-chip {
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      color: var(--highlight-cyan);
      border: 2px solid var(--highlight-cyan);
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .word-chip:hover {
      background: var(--highlight-cyan);
      color: #0f172a;
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 8px 15px rgba(56, 189, 248, 0.4);
    }

    .word-chip:active {
      transform: scale(0.98);
    }

    .feedback {
      font-size: 1.25rem;
      font-weight: 700;
      min-height: 35px;
      margin-top: 15px;
      padding: 8px 15px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    /* Sparkle Effects for End Screen */
    .stars {
      font-size: 2rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="game-card">

  <!-- 1) LOGO SCREEN ONLY -->
  <div id="screen-logo" class="screen">
    <div class="logo-only-container" onclick="showScreen('screen-instructions')">
      <div class="logo-wrapper">
        <img src="assets/logo.png" alt="Innovine Logo" class="logo-img-large" onerror="this.src='https://via.placeholder.com/280x100?text=Innovine';">
      </div>
      <button class="btn">आगे बढ़ें ▶</button>
    </div>
  </div>

  <!-- 2) INSTRUCTIONS SCREEN -->
  <div id="screen-instructions" class="screen hidden">
    <h2 style="color: var(--highlight-yellow); margin-top: 0; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">🎯 खेल के नियम</h2>
    <div class="instruction-card">
      <p>💬 <span><strong>बोल-बताओ:</strong> खाली स्थान को सही शब्द से पूरा करें।</span></p>
      <p>🥭 <span><strong>शब्द चुनो:</strong> नीचे दिए गए रंग-बिरंगे शब्दों पर क्लिक करें।</span></p>
      <p>👑 <span><strong>रानी बनो:</strong> 10 पड़ाव पार करके 'चिड़ियों की रानी' का मुकुट जीतो!</span></p>
    </div>
    <button class="btn" onclick="startGame()">शुरू करें 🚀</button>
  </div>

  <!-- 3) MAIN GAME SCREEN -->
  <div id="screen-game" class="screen hidden">
    
    <!-- Status Header -->
    <div class="status-bar">
      <span id="stage-indicator">पड़ाव: 1/10</span>
      <span id="score-indicator">🥭 आम: 0</span>
    </div>

    <div class="stage-image" id="game-avatar">🐦</div>
    
    <!-- Dynamic Speech Bubble -->
    <div class="speech-bubble-container">
      <div id="speech-bubble" class="speech-bubble">
        <!-- Sentence with blank goes here -->
      </div>
    </div>

    <!-- Word Bank for Fill-in-the-blank -->
    <div id="word-bank" class="word-bank">
      <!-- Dynamic Word Chips -->
    </div>

    <div id="feedback-msg" class="feedback"></div>

    <button id="next-btn" class="btn hidden" onclick="nextQuestion()">आगे बढ़ें ▶</button>
  </div>

  <!-- 4) END SCREEN -->
  <div id="screen-end" class="screen hidden">
    <div class="stars">✨ ⭐ ✨</div>
    <div class="stage-image" id="end-avatar">👑</div>
    <h1 id="end-title" style="color: #34d399; margin: 0; font-size: 2.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">शाबाश!</h1>
    <p id="end-msg" style="font-size: 1.3rem; line-height: 1.6; margin: 20px 0; font-weight: 600;"></p>
    
    <button class="btn" onclick="restartGame()">फिर से खेलें 🔄</button>
  </div>

</div>

<script>
  let currentLevel = 0;
  let score = 0;

  // 10 Interactive Speech Bubble Fill Questions
  const questions = [
    {
      avatar: "🐦",
      template: "कोयल का रंग <span class='blank-target'>[ _____ ]</span> होता है और वह आम के पेड़ पर बैठती है।",
      words: ["काली", "सफ़ेद", "हरी"],
      correct: "काली",
      successMsg: "✨ वाह! कोयल काली होती है और आम के पेड़ पर गाती है! 🥭",
      failMsg: "❌ सही उत्तर 'काली' है।"
    },
    {
      avatar: "🥭",
      template: "कोयल अपनी मीठी आवाज़ में <span class='blank-target'>[ _____ ]</span> गाती है।",
      words: ["काँव-काँव", "कुहू-कुहू", "चीँ-चीँ"],
      correct: "कुहू-कुहू",
      successMsg: "🎶 'कुहू-कुहू!' आपने आम के बाग में मिठास घोल दी! 🍬",
      failMsg: "❌ सही उत्तर 'कुहू-कुहू' है।"
    },
    {
      avatar: "🍬",
      template: "कोयल कूक-कूक कर आमों में <span class='blank-target'>[ _____ ]</span> घोल देती है।",
      words: ["मिश्री", "नमक", "मिर्ची"],
      correct: "मिश्री",
      successMsg: "✨ बहुत बढ़िया! कूक-कूक कर मिश्री जैसी मिठास घुल गई!",
      failMsg: "❌ सही उत्तर 'मिश्री' है।"
    },
    {
      avatar: "🌧️",
      template: "प्यासी धरती को देखकर कोयल <span class='blank-target'>[ _____ ]</span> से पानी माँगती है।",
      words: ["मेघों", "सूरज", "हवा"],
      correct: "मेघों",
      successMsg: "🌧️ शाबाश! कोयल मेघों (बादलों) से वर्षा माँगती है! 💧",
      failMsg: "❌ सही उत्तर 'मेघों' है।"
    },
    {
      avatar: "🐣",
      template: "कोयल को मीठा बोलना उसकी <span class='blank-target'>[ _____ ]</span> ने सिखाया है।",
      words: ["माँ", "दादी", "सहेली"],
      correct: "माँ",
      successMsg: "💖 सही पहचाना! माँ की सीख से ही कोयल मीठा बोलती है!",
      failMsg: "❌ सही उत्तर 'माँ' है।"
    },
    {
      avatar: "🌳",
      template: "कोयल आम के पेड़ की <span class='blank-target'>[ _____ ]</span> पर बैठकर गाती है।",
      words: ["डाली", "जड़", "पत्ते"],
      correct: "डाली",
      successMsg: "🌿 बहुत सुंदर! कोयल आम की ऊंची डाली पर गाती है!",
      failMsg: "❌ सही उत्तर 'डाली' है।"
    },
    {
      avatar: "☀️",
      template: "गर्मी के मौसम में जब <span class='blank-target'>[ _____ ]</span> आते हैं, तब कोयल कूकती है।",
      words: ["आम", "सेब", "केले"],
      correct: "आम",
      successMsg: "🥭 ज़बरदस्त! गर्मी में मीठे आम आते ही कोयल गाती है!",
      failMsg: "❌ सही उत्तर 'आम' है।"
    },
    {
      avatar: "👑",
      template: "मीठी बोली के कारण कोयल को सब <span class='blank-target'>[ _____ ]</span> की रानी कहते हैं।",
      words: ["चिड़ियों", "नदियों", "फूलों"],
      correct: "चिड़ियों",
      successMsg: "👑 शानदार! कोयल सब चिड़ियों की रानी कहलाती है!",
      failMsg: "❌ सही उत्तर 'चिड़ियों' है।"
    },
    {
      avatar: "📖",
      template: "'कोयल' कविता की रचयिता कवियत्री <span class='blank-target'>[ _____ ]</span> कुमारी चौहान हैं।",
      words: ["सुभद्रा", "महादेवी", "सरोजिनी"],
      correct: "सुभद्रा",
      successMsg: "✨ उत्तर सही है! कवियत्री सुभद्रा कुमारी चौहान हैं!",
      failMsg: "❌ सही उत्तर 'सुभद्रा' है।"
    },
    {
      avatar: "💬",
      template: "हमें भी कोयल की तरह हमेशा <span class='blank-target'>[ _____ ]</span> बोलना चाहिए।",
      words: ["मीठा", "कड़वा", "ज़ोर से"],
      correct: "मीठा",
      successMsg: "💖 वाह! हमें सब के साथ हमेशा मीठी बोली बोलनी चाहिए! 🌟",
      failMsg: "❌ सही उत्तर 'मीठा' है।"
    }
  ];

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(screenId).classList.remove('hidden');
  }

  function startGame() {
    currentLevel = 0;
    score = 0;
    showScreen('screen-game');
    loadQuestion();
  }

  function loadQuestion() {
    const q = questions[currentLevel];
    document.getElementById('stage-indicator').innerText = `पड़ाव: ${currentLevel + 1}/10`;
    document.getElementById('score-indicator').innerText = `🥭 आम: ${score}`;
    document.getElementById('game-avatar').innerText = q.avatar;
    document.getElementById('speech-bubble').innerHTML = q.template;
    
    const feedback = document.getElementById('feedback-msg');
    feedback.innerText = '';
    feedback.style.background = 'transparent';
    
    document.getElementById('next-btn').classList.add('hidden');

    const wordBank = document.getElementById('word-bank');
    wordBank.innerHTML = '';
    wordBank.classList.remove('hidden');

    // Shuffle word options
    const shuffledWords = [...q.words].sort(() => Math.random() - 0.5);

    shuffledWords.forEach(word => {
      const chip = document.createElement('div');
      chip.className = 'word-chip';
      chip.innerText = word;
      chip.onclick = () => handleWordSelect(word);
      wordBank.appendChild(chip);
    });
  }

  function handleWordSelect(selectedWord) {
    const q = questions[currentLevel];
    const feedback = document.getElementById('feedback-msg');
    document.getElementById('word-bank').classList.add('hidden');

    // Fill blank visually inside speech bubble
    const filledSentence = q.template.replace(
      "<span class='blank-target'>[ _____ ]</span>",
      `<strong style='color: var(--highlight-yellow); background: rgba(251, 191, 36, 0.2); padding: 2px 10px; border-radius: 8px;'>${selectedWord}</strong>`
    );
    document.getElementById('speech-bubble').innerHTML = filledSentence;

    if (selectedWord === q.correct) {
      score++;
      feedback.style.color = '#34d399';
      feedback.style.background = 'rgba(52, 211, 153, 0.1)';
      feedback.innerText = q.successMsg;
    } else {
      feedback.style.color = '#f87171';
      feedback.style.background = 'rgba(248, 113, 113, 0.1)';
      feedback.innerText = q.failMsg;
    }

    document.getElementById('score-indicator').innerText = `🥭 आम: ${score}`;
    document.getElementById('next-btn').classList.remove('hidden');
  }

  function nextQuestion() {
    currentLevel++;
    if (currentLevel < questions.length) {
      loadQuestion();
    } else {
      showEndScreen();
    }
  }

  function showEndScreen() {
    showScreen('screen-end');
    const endAvatar = document.getElementById('end-avatar');
    const endTitle = document.getElementById('end-title');
    const endMsg = document.getElementById('end-msg');

    if (score === 10) {
      endAvatar.innerText = "👑✨";
      endTitle.innerText = "🏆 सब चिड़ियों की रानी!";
      endMsg.innerText = "अद्भुत! आपने सभी 10 वाक्यों को सही पूरा किया और 10 रसीले आम बटोरे! 🥭";
    } else if (score >= 6) {
      endAvatar.innerText = "🐥🥭";
      endTitle.innerText = "बहुत बढ़िया!";
      endMsg.innerText = `शानदार प्रयास! आपने ${score}/10 आम बटोरे। फिर से खेलकर 10/10 का स्कोर बनाएँ! 🚀`;
    } else {
      endAvatar.innerText = "📖";
      endTitle.innerText = "फिर कोशिश करें!";
      endMsg.innerText = `आपने ${score}/10 आम बटोरे। कविता को दोबारा पढ़ें और खेलें! 🥭`;
    }
  }

  function restartGame() {
    showScreen('screen-logo');
  }
</script>

</body>
</html>
