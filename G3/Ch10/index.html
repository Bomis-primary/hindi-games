<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>तेनालीराम की चतुराई - व्याकरण खेल</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(135deg, #fefae0, #f4a261);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #2b2d42;
      padding: 10px;
    }

    html {
      height: -webkit-fill-available;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Screen States */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .active {
      display: flex;
    }

    /* 1. Intro Screen */
    #intro-screen {
      cursor: pointer;
    }

    .only-logo {
      max-width: 220px;
      width: 75%;
      height: auto;
      transition: transform 0.3s ease;
    }

    /* Titles & Common Styles */
    h1 {
      color: #e76f51;
      margin-bottom: 12px;
      font-size: 1.6rem;
    }

    h2 {
      color: #2a9d8f;
      margin-bottom: 12px;
      font-size: 1.2rem;
    }

    p {
      font-size: 1rem;
      color: #4a5568;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .btn {
      background-color: #2a9d8f;
      color: white;
      padding: 12px 28px;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      margin-top: 15px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* Instructions Screen */
    .timer-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #e76f51;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(231, 111, 81, 0.4);
    }

    /* Game Screen */
    .progress-bar {
      font-weight: bold;
      color: #e76f51;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .game-story {
      background: #f8f9fa;
      padding: 12px;
      border-left: 4px solid #2a9d8f;
      border-radius: 5px;
      margin-bottom: 15px;
      text-align: left;
      width: 100%;
      font-size: 0.95rem;
    }

    /* Punctuation Interactive Styling */
    .sentence-box {
      font-size: 1.25rem;
      font-weight: bold;
      color: #2b2d42;
      background: #eef9f6;
      padding: 15px;
      border-radius: 12px;
      border: 2px dashed #2a9d8f;
      margin: 15px 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .drop-zone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      height: 38px;
      border: 2px dashed #e76f51;
      border-radius: 8px;
      background: #ffffff;
      color: #e76f51;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 0 6px;
    }

    .punctuation-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 10px;
    }

    .symbol-btn {
      background: #edf2f4;
      border: 2px solid #2a9d8f;
      border-radius: 12px;
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #2b2d42;
      transition: all 0.2s ease;
    }

    .symbol-btn:active {
      background: #2a9d8f;
      color: white;
    }

    .symbol-badge {
      background: #e76f51;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    /* Multiple Choice Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 5px;
    }

    .option-btn {
      background: #edf2f4;
      border: 2px solid #d8e2dc;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      color: #2b2d42;
    }

    .option-btn:active {
      background: #2a9d8f;
      color: white;
      border-color: #2a9d8f;
    }

    .result-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Intro Screen -->
    <div id="intro-screen" class="screen active" onclick="goToInstructions()">
      <img src="assets/logo.png" alt="Innovine Logo" class="only-logo" onerror="this.src='https://via.placeholder.com/250x100?text=Innovine+Logo'">
    </div>

    <!-- 2. Instructions Screen -->
    <div id="instruction-screen" class="screen">
      <h1>व्याकरण बोध: विराम-चिह्न</h1>
      <p>विजयनगर साम्राज्य के संदेशवाहक ने पत्रों में <strong>विराम-चिह्न (Punctuation Marks)</strong> छोड़ दिए हैं!</p>
      <p>सही विराम-चिह्न चुनकर तेनालीराम को संदेश को समझने में मदद करें।</p>
      <p><strong>लक्ष्य:</strong> सभी 5 प्रश्नों का सही उत्तर देकर विराम-चिह्न का सही उपयोग सीखें।</p>
      <div class="timer-circle" id="timer">5</div>
    </div>

    <!-- 3. Game Screen -->
    <div id="game-screen" class="screen">
      <div class="progress-bar" id="question-progress">प्रश्न 1 / 5</div>
      <h2 id="question-title"></h2>
      <div class="game-story" id="question-desc"></div>
      <div id="quiz-content" style="width: 100%;"></div>
    </div>

    <!-- 4. End Game Screen -->
    <div id="end-screen" class="screen">
      <div id="result-icon" class="result-icon"></div>
      <h1 id="result-title"></h1>
      <p id="result-desc"></p>
      <button class="btn" onclick="restartGame()">फिर से खेलें</button>
    </div>
  </div>

  <script>
    const soundCorrect = new Audio('assets/correct.mp3');
    const soundWrong = new Audio('assets/wrong.mp3');

    // Mobile Audio Unlock Logic
    let audioUnlocked = false;
    function unlockAudio() {
      if (!audioUnlocked) {
        soundCorrect.play().then(() => { soundCorrect.pause(); soundCorrect.currentTime = 0; }).catch(() => {});
        soundWrong.play().then(() => { soundWrong.pause(); soundWrong.currentTime = 0; }).catch(() => {});
        audioUnlocked = true;
      }
    }

    function playAudio(audioObj) {
      unlockAudio();
      audioObj.currentTime = 0;
      audioObj.play().catch(e => console.log("Audio play error: ", e));
    }

    let currentQuestion = 0;
    let score = 0;
    let timerInterval;
    let introTimeout;

    function goToInstructions() {
      clearTimeout(introTimeout);
      unlockAudio();
      showScreen('instruction-screen');
      startInstructionsTimer();
    }

    introTimeout = setTimeout(() => {
      if (document.getElementById('intro-screen').classList.contains('active')) {
        goToInstructions();
      }
    }, 2500);

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startInstructionsTimer() {
      let timeLeft = 5;
      const timerElement = document.getElementById('timer');
      timerElement.textContent = timeLeft;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          startQuiz();
        }
      }, 1000);
    }

    const questions = [
      {
        type: 'fill_punct',
        title: 'प्रश्न 1: सही विराम-चिह्न चुनिए',
        desc: 'नीचे दिए गए वाक्य के अंत में कौन-सा विराम-चिह्न आएगा?',
        textBefore: 'तेनालीराम बहुत चतुर थे',
        textAfter: '',
        correctPunct: '।',
        options: [
          { symbol: '।', name: 'पूर्ण विराम' },
          { symbol: '?', name: 'प्रश्नवाचक' },
          { symbol: '!', name: 'विस्मयादिबोधक' },
          { symbol: ',', name: 'अल्प विराम' }
        ]
      },
      {
        type: 'fill_punct',
        title: 'प्रश्न 2: सही विराम-चिह्न चुनिए',
        desc: 'इस प्रश्नवाचक वाक्य को पूरा करने के लिए सही चिह्न चुनें:',
        textBefore: 'विजयनगर का चोर कौन था',
        textAfter: '',
        correctPunct: '?',
        options: [
          { symbol: '।', name: 'पूर्ण विराम' },
          { symbol: '?', name: 'प्रश्नवाचक' },
          { symbol: '!', name: 'विस्मयादिबोधक' },
          { symbol: ',', name: 'अल्प विराम' }
        ]
      },
      {
        type: 'fill_punct',
        title: 'प्रश्न 3: अल्प विराम (,) का प्रयोग',
        desc: 'सूची के शब्दों को अलग करने के लिए सही जगह पर अल्प विराम चुनें:',
        textBefore: 'दरबार में राजा',
        textAfter: 'मंत्री और सैनिक उपस्थित थे।',
        correctPunct: ',',
        options: [
          { symbol: ',', name: 'अल्प विराम' },
          { symbol: '।', name: 'पूर्ण विराम' },
          { symbol: '?', name: 'प्रश्नवाचक' },
          { symbol: '!', name: 'विस्मयादिबोधक' }
        ]
      },
      {
        type: 'fill_punct',
        title: 'प्रश्न 4: आश्चर्य या भाव प्रकट करना',
        desc: 'अद्भुत भाव प्रकट करने के लिए सही चिह्न का चयन करें:',
        textBefore: 'वाह',
        textAfter: 'तेनालीराम ने चोर पकड़ लिया।',
        correctPunct: '!',
        options: [
          { symbol: '!', name: 'विस्मयादिबोधक' },
          { symbol: ',', name: 'अल्प विराम' },
          { symbol: '।', name: 'पूर्ण विराम' },
          { symbol: '?', name: 'प्रश्नवाचक' }
        ]
      },
      {
        type: 'mcq',
        title: 'प्रश्न 5: नियम पहचानिए',
        desc: 'लिखते समय रुकने, प्रश्न पूछने या भाव प्रकट करने वाले चिह्नों को क्या कहते हैं?',
        options: [
          { text: 'विराम-चिह्न (Punctuation Marks)', correct: true },
          { text: 'संज्ञा (Noun)', correct: false },
          { text: 'सर्वनाम (Pronoun)', correct: false },
          { text: 'क्रिया (Verb)', correct: false }
        ]
      }
    ];

    function startQuiz() {
      currentQuestion = 0;
      score = 0;
      showScreen('game-screen');
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-progress').textContent = `प्रश्न ${currentQuestion + 1} / ${questions.length}`;
      document.getElementById('question-title').textContent = q.title;
      document.getElementById('question-desc').textContent = q.desc;

      const quizContent = document.getElementById('quiz-content');
      quizContent.innerHTML = '';

      if (q.type === 'fill_punct') {
        const sentenceBox = document.createElement('div');
        sentenceBox.className = 'sentence-box';
        sentenceBox.innerHTML = `
          <span>${q.textBefore}</span>
          <div class="drop-zone" id="target-zone">?</div>
          <span>${q.textAfter}</span>
        `;
        quizContent.appendChild(sentenceBox);

        const grid = document.createElement('div');
        grid.className = 'punctuation-grid';

        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'symbol-btn';
          btn.innerHTML = `<span class="symbol-badge">${opt.symbol}</span> ${opt.name}`;
          btn.onclick = () => handleAnswer(opt.symbol === q.correctPunct);
          grid.appendChild(btn);
        });

        quizContent.appendChild(grid);

      } else if (q.type === 'mcq') {
        const optionsList = document.createElement('div');
        optionsList.className = 'options-list';

        q.options.forEach(option => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = option.text;
          btn.onclick = () => handleAnswer(option.correct);
          optionsList.appendChild(btn);
        });
        quizContent.appendChild(optionsList);
      }
    }

    function handleAnswer(isCorrect) {
      if (isCorrect) {
        score++;
        playAudio(soundCorrect);
      } else {
        playAudio(soundWrong);
      }

      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showEndScreen();
      }
    }

    function showEndScreen() {
      showScreen('end-screen');
      const icon = document.getElementById('result-icon');
      const title = document.getElementById('result-title');
      const desc = document.getElementById('result-desc');

      if (score === questions.length) {
        icon.textContent = '🏆';
        title.textContent = 'अद्भुत! आपका व्याकरण ज्ञान शानदार है!';
        desc.textContent = `आपने सभी ${questions.length} में से ${score} प्रश्नों के सही उत्तर दिए! तेनालीराम ने सभी पत्रों को सही-सही पढ़ लिया है।`;
      } else if (score >= 3) {
        icon.textContent = '👏';
        title.textContent = 'शाबाश! बहुत अच्छा प्रयास!';
        desc.textContent = `आपने ${questions.length} में से ${score} प्रश्नों के सही उत्तर दिए। विराम-चिह्न का अभ्यास जारी रखें!`;
      } else {
        icon.textContent = '❌';
        title.textContent = 'पुन: प्रयास करें!';
        desc.textContent = `आपका स्कोर ${questions.length} में से ${score} है। नियम तालिका को एक बार फिर से देखकर खेलें।`;
      }
    }

    function restartGame() {
      showScreen('intro-screen');
      introTimeout = setTimeout(() => {
        if (document.getElementById('intro-screen').classList.contains('active')) {
          goToInstructions();
        }
      }, 2500);
    }
  </script>
</body>
</html>
