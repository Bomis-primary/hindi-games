<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एक अनोखा तरबूज़ - The Square Watermelon Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        h1 {
            margin: 10px 0 5px 0;
            color: #2ecc71;
            text-shadow: 2px 2px #27ae60;
        }

        p {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #ecf0f1;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            background: #87CEEB;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
        }

        #fact-box {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #f1c40f;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            pointer-events: none;
        }

        .controls-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <h1>एक अनोखा तरबूज़ 🍉📦</h1>
    <p>गोलू की मदद करें: गोल तरबूज़ पकड़ें और उन्हें चौकोर साँचे में डालें!</p>

    <div id="game-container">
        <div id="ui-overlay">
            <div id="score">स्कोर (Score): 0</div>
            <div id="target">लक्ष्य (Goal): 5 चौकोर तरबूज़</div>
        </div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="fact-box">ज्ञान: तरबूज़ में लगभग 92% पानी होता है!</div>
    </div>

    <div class="controls-hint">
        🎮 **कंट्रोल (Controls):** ⬅️ ➡️ बायाँ / दायाँ तीर (Left / Right Arrow) या A/D की-बोर्ड बटन दबाएँ।
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("score");
        const factBox = document.getElementById("fact-box");

        // Game State
        let score = 0;
        let gameOver = false;

        // Facts from Chapter 11
        const facts = [
            "ज्ञान: तरबूज़ में लगभग 92% पानी होता है! 💦",
            "ज्ञान: इसके लाल भाग में 'लाइकोपीन' नाम का तत्व होता है! 🔴",
            "ज्ञान: जापान के किसान पारदर्शी साँचे (Moulds) का प्रयोग करते हैं! 📦",
            "ज्ञान: तरबूज़ का हरा छिलका अचार और मुरब्बा बनाने में काम आता है! 🥒",
            "ज्ञान: चौकोर तरबूज़ को आसानी से सजाकर रखा जा सकता है! ✨",
            "ज्ञान: तरबूज़, ककड़ी और कद्दू एक ही बेल-परिवार के सदस्य हैं! 🌿"
        ];

        // Player (Golu)
        const player = {
            x: canvas.width / 2 - 30,
            y: canvas.height - 70,
            width: 60,
            height: 60,
            speed: 7,
            dx: 0,
            hasWatermelon: false,
            type: null // 'round' or 'square'
        };

        // Mold Target (Left side)
        const mold = {
            x: 20,
            y: canvas.height - 80,
            width: 70,
            height: 70
        };

        // Falling Watermelons
        let watermelons = [];
        let spawnTimer = 0;

        // Key Handlers
        const keys = {};

        document.addEventListener("keydown", (e) => {
            keys[e.key] = true;
        });

        document.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        function spawnWatermelon() {
            const x = Math.random() * (canvas.width - 120) + 100;
            watermelons.push({
                x: x,
                y: -30,
                radius: 20,
                speed: 2 + Math.random() * 2
            });
        }

        function update() {
            if (gameOver) return;

            // Player Movement
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
                player.x -= player.speed;
            }
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
                player.x += player.speed;
            }

            // Boundary Checks
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Spawn Watermelons
            spawnTimer++;
            if (spawnTimer > 100 && watermelons.length < 3) {
                spawnWatermelon();
                spawnTimer = 0;
            }

            // Update Watermelons
            for (let i = watermelons.length - 1; i >= 0; i--) {
                let w = watermelons[i];
                w.y += w.speed;

                // Catch Watermelon
                if (
                    !player.hasWatermelon &&
                    w.y + w.radius >= player.y &&
                    w.x >= player.x &&
                    w.x <= player.x + player.width
                ) {
                    player.hasWatermelon = true;
                    player.type = 'round';
                    watermelons.splice(i, 1);
                    factBox.innerText = "शाबाश! अब इसे बाएँ (Left) तरफ वाले साँचे (Mold) में ले जाएँ!";
                    continue;
                }

                // Missed Watermelon
                if (w.y - w.radius > canvas.height) {
                    watermelons.splice(i, 1);
                }
            }

            // Deliver to Mold
            if (player.hasWatermelon && player.type === 'round') {
                if (player.x <= mold.x + mold.width) {
                    // Transformed into Square!
                    score += 1;
                    scoreEl.innerText = `स्कोर (Score): ${score}`;
                    player.hasWatermelon = false;
                    player.type = null;

                    // Update Random Fact
                    const randomFact = facts[Math.floor(Math.random() * facts.length)];
                    factBox.innerText = `🎉 चौकोर तरबूज़ तैयार! ${randomFact}`;
                }
            }
        }

        function drawBackground() {
            // Kitchen Floor
            ctx.fillStyle = "#e0e0e0";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

            // Wall
            ctx.fillStyle = "#fff8dc";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

            // Kitchen Table / Shelf
            ctx.fillStyle = "#8b4513";
            ctx.fillRect(0, canvas.height - 35, canvas.width, 5);
        }

        function drawMold() {
            // Glass Mold Container
            ctx.strokeStyle = "#2980b9";
            ctx.lineWidth = 4;
            ctx.fillStyle = "rgba(173, 216, 230, 0.4)";
            ctx.fillRect(mold.x, mold.y, mold.width, mold.height);
            ctx.strokeRect(mold.x, mold.y, mold.width, mold.height);

            // Label
            ctx.fillStyle = "#2c3e50";
            ctx.font = "12px Arial";
            ctx.fillText("साँचा (Mold)", mold.x + 5, mold.y - 8);
        }

        function drawWatermelons() {
            watermelons.forEach(w => {
                // Round Watermelon
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#27ae60";
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#1e8449";
                ctx.stroke();

                // Stripes
                ctx.beginPath();
                ctx.moveTo(w.x - 10, w.y - 10);
                ctx.lineTo(w.x + 10, w.y + 10);
                ctx.strokeStyle = "#145a32";
                ctx.lineWidth = 3;
                ctx.stroke();
            });
        }

        function drawPlayer() {
            // Character Golu (Simplified Art)
            ctx.fillStyle = "#e74c3c"; // Shirt
            ctx.fillRect(player.x + 15, player.y + 20, 30, 30);

            ctx.fillStyle = "#f1c40f"; // Head
            ctx.beginPath();
            ctx.arc(player.x + 30, player.y + 12, 15, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = "#000";
            ctx.fillRect(player.x + 23, player.y + 8, 3, 3);
            ctx.fillRect(player.x + 34, player.y + 8, 3, 3);

            // Hands holding item
            if (player.hasWatermelon) {
                // Draw Round Watermelon in hands
                ctx.beginPath();
                ctx.arc(player.x + 30, player.y + 35, 14, 0, Math.PI * 2);
                ctx.fillStyle = "#27ae60";
                ctx.fill();
                ctx.strokeStyle = "#145a32";
                ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawMold();
            drawWatermelons();
            drawPlayer();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
