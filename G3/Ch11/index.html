<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>एक अनोखा तरबूज़ - Square Watermelon Game</title>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none; /* स्क्रॉलिंग रोकने के लिए */
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
            box-shadow: 0px 0px 25px rgba(0,0,0,0.8);
            position: relative;
        }
        
        /* Responsive Quiz Modal Overlay */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 480px;
            background: #ffffff;
            border: 4px solid #0055ff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            z-index: 100;
        }
        #quiz-modal h3 {
            margin-top: 0;
            color: #0055ff;
            font-size: 20px;
        }
        #quiz-modal p {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .quiz-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #f8f9fa;
            border: 2px solid #0055ff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #0055ff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .quiz-btn:hover, .quiz-btn:active {
            background-color: #0055ff;
            color: #ffffff;
        }

        /* On-Screen Feedback Message Box */
        #quiz-feedback {
            display: none;
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            margin-top: 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }
        .feedback-correct {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .feedback-wrong {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        /* Game Over Modal Styling */
        #gameover-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 450px;
            background: #ffffff;
            border: 4px solid #d32f2f;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            z-index: 110;
        }
        #gameover-modal h2 {
            margin-top: 0;
            color: #d32f2f;
            font-size: 24px;
        }
        #gameover-modal p {
            font-size: 18px;
            color: #333;
            margin: 15px 0 25px 0;
            font-weight: bold;
        }

        /* Win Modal Styling */
        #win-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 450px;
            background: #ffffff;
            border: 4px solid #2e7d32;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            z-index: 110;
        }
        #win-modal h2 {
            margin-top: 0;
            color: #2e7d32;
            font-size: 24px;
        }
        #win-modal p {
            font-size: 18px;
            color: #333;
            margin: 15px 0 25px 0;
            font-weight: bold;
        }

        .action-btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #0055ff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .action-btn:hover, .action-btn:active {
            background-color: #003db3;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Quiz Modal Container -->
    <div id="quiz-modal">
        <h3 id="quiz-title">📖 कहानी प्रश्न (Story Quiz)</h3>
        <p id="quiz-question">प्रश्न यहाँ दिखाई देगा...</p>
        <div id="quiz-options"></div>
        <div id="quiz-feedback"></div>
    </div>

    <!-- On-Screen Game Over Modal -->
    <div id="gameover-modal">
        <h2>🎮 खेल समाप्त! (Game Over)</h2>
        <p id="final-score-text">आपका कुल अंक: 0</p>
        <button id="restart-btn" class="action-btn">🔄 पुनः प्रयास करें (Try Again)</button>
    </div>

    <!-- On-Screen Win Modal -->
    <div id="win-modal">
        <h2>🎉 बधाई हो! आप जीत गए! (You Win!)</h2>
        <p id="win-score-text">आपने 300 अंक प्राप्त कर लिए हैं!</p>
        <button id="win-restart-btn" class="action-btn">🔄 दोबारा खेलें (Play Again)</button>
    </div>
</div>

<script>
// --- Direct Web Audio API Audio Cache / Player ---
const audioCache = {
    correct_snd: new Audio('assets/correct.mp3'),
    wrong_snd: new Audio('assets/wrong.mp3')
};

// Unlock Audio on First Mobile Touch
let audioUnlocked = false;
function unlockMobileAudio() {
    if (audioUnlocked) return;
    for (let key in audioCache) {
        audioCache[key].play().then(() => {
            audioCache[key].pause();
            audioCache[key].currentTime = 0;
        }).catch(() => {});
    }
    audioUnlocked = true;
}
window.addEventListener('touchstart', unlockMobileAudio, { once: true });
window.addEventListener('click', unlockMobileAudio, { once: true });

// --- Sound Player Helper (Phaser Sound + Audio Fallback) ---
function playSound(soundKey, scene) {
    let played = false;
    
    if (scene && scene.sound && scene.sound.get(soundKey)) {
        try {
            scene.sound.play(soundKey);
            played = true;
        } catch (e) {
            console.warn("Phaser sound play failed, trying HTML5 Audio fallback...", e);
        }
    }
    
    if (!played && audioCache[soundKey]) {
        try {
            audioCache[soundKey].currentTime = 0;
            audioCache[soundKey].play().catch(() => {
                playSynthSound(soundKey);
            });
        } catch (e) {
            playSynthSound(soundKey);
        }
    }
}

// Synthetic Sound Fallback
function playSynthSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') {
            ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'correct_snd') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'wrong_snd') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(120, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        }
    } catch(e) {}
}

// --- 10 Chapter Questions Data ---
const chapterQuestions = [
    {
        question: "गोलू और दादाजी तरबूज़ को कौन-सा नया आकार देना चाहते थे?",
        options: ["त्रिभुज (Triangle)", "चौकोर (Square)", "स्टार (Star)", "गोलाकार (Round)"],
        correct: 1
    },
    {
        question: "तरबूज़ को चौकोर आकार में ढालने के लिए किसका प्रयोग किया गया?",
        options: ["पारदर्शी सांचा (Transparent Mold)", "लोहे का डिब्बा", "लकड़ी की टोकरी", "कपड़े का थैला"],
        correct: 0
    },
    {
        question: "सांचे में बंद करने के बाद भी पौधों को बढ़ने के लिए क्या आवश्यक है?",
        options: ["केवल पानी", "केवल हवा", "हवा, पानी और धूप", "कुछ भी नहीं"],
        correct: 2
    },
    {
        question: "चौकोर तरबूज़ बनाने का मुख्य व्यावहारिक लाभ क्या है?",
        options: ["वे ज़्यादा मीठे होते हैं", "उन्हें रखना और ले जाना आसान होता है", "वे जल्दी पकते हैं", "उनका रंग बदल जाता है"],
        correct: 1
    },
    {
        question: "तरबूज़ को सांचे में किस अवस्था में रखा जाता है?",
        options: ["पकने के बाद", "जब तरबूज़ छोटा और कच्चा होता है", "फूल आने से पहले", "पेड़ से तोड़ने के बाद"],
        correct: 1
    },
    {
        question: "पारदर्शी (transparent) सांचे का प्रयोग क्यों किया गया?",
        options: ["ताकि धूप अंदर पहुँच सके", "ताकि वह सुंदर दिखे", "ताकि वह हल्का हो", "ताकि पानी बाहर न निकले"],
        correct: 0
    },
    {
        question: "गोलू के साथ खेत में प्रयोग कौन कर रहा था?",
        options: ["उसका दोस्त", "उसके दादाजी", "उसके अध्यापक", "उसका भाई"],
        correct: 1
    },
    {
        question: "चौकोर तरबूज़ की मांग बाज़ार में क्यों अधिक होती है?",
        options: ["फ्रिज में आसानी से समा जाने के कारण", "इसका स्वाद अलग होने के कारण", "यह सस्ता होने के कारण", "यह भारी होने के कारण"],
        correct: 0
    },
    {
        question: "कहानी 'एक अनोखा तरबूज़' से हमें क्या प्रेरणा मिलती है?",
        options: ["खेती न करने की", "नवाचार और नए विचारों को अपनाने की", "केवल गोल फल उगाने की", "समय बर्बाद करने की"],
        correct: 1
    },
    {
        question: "सांचा किस सामग्री का बना होना चाहिए ताकि तरबूज़ को मजबूत आकार मिले?",
        options: ["कागज़ का", "मजबूत पारदर्शी प्लास्टिक या कांच का", "कपड़े का", "पत्तियों का"],
        correct: 1
    }
];

let globalScore = 0;
let globalLives = 3;

// --- Scene 1: Innovine Logo Screen ---
class LogoScene extends Phaser.Scene {
    constructor() {
        super({ key: 'LogoScene' });
    }

    preload() {
        this.load.image('innovine_logo', 'assets/logo.png');
    }

    create() {
        this.cameras.main.setBackgroundColor('#ffffff');

        const logo = this.add.image(400, 300, 'innovine_logo').setOrigin(0.5);
        logo.setAlpha(0);

        this.tweens.add({
            targets: logo,
            alpha: 1,
            duration: 1000,
            ease: 'Power2'
        });

        this.time.delayedCall(5000, () => {
            this.cameras.main.fadeOut(500, 0, 0, 0);
            this.cameras.main.once('camerafadeoutcomplete', () => {
                this.scene.start('InstructionScene');
            });
        });
    }
}

// --- Scene 2: Instructions Screen ---
class InstructionScene extends Phaser.Scene {
    constructor() {
        super({ key: 'InstructionScene' });
    }

    create() {
        this.cameras.main.setBackgroundColor('#1a2634');

        this.add.text(400, 60, 'एक अनोखा तरबूज़', {
            fontSize: '32px', color: '#4da6ff', fontStyle: 'bold'
        }).setOrigin(0.5);

        this.add.text(400, 110, 'खेलने के नियम (Rules & Instructions)', {
            fontSize: '20px', color: '#ffffff', fontStyle: 'bold'
        }).setOrigin(0.5);

        const rulesText = 
            "1. 📱 स्क्रीन पर Touch / Slide करके सांचा चलाएं।\n\n" +
            "2. 🍉 तरबूज़ पकड़ने पर +10 अंक मिलेंगे।\n\n" +
            "3. ❓ खेल शुरू होते ही पहला प्रश्न आएगा!\n\n" +
            "4. ✅ सही उत्तर: +20 अंक | ❌ गलत उत्तर: -30 अंक\n\n" +
            "5. 🏆 300 अंक हासिल करने पर आप जीत जाएँगे!";

        const bgRect = this.add.graphics();
        bgRect.fillStyle(0x0a192f, 0.85);
        bgRect.lineStyle(3, 0x0055ff, 1);
        bgRect.fillRoundedRect(60, 150, 680, 300, 15);
        bgRect.strokeRoundedRect(60, 150, 680, 300, 15);

        this.add.text(90, 175, rulesText, {
            fontSize: '18px', color: '#f0f0f0', lineSpacing: 8
        });

        const startBtn = this.add.text(400, 500, '👉 खेल शुरू करें (Start Game)', {
            fontSize: '22px', color: '#ffffff', backgroundColor: '#0055ff', padding: { x: 20, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        startBtn.on('pointerdown', () => {
            unlockMobileAudio();
            globalScore = 0;
            globalLives = 3;
            this.scene.start('GameScene', { triggerFirstQuiz: true });
        });
    }
}

// --- Scene 3: Main Game Scene ---
class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
        this.nextQuizThreshold = 50;
        this.questionIndex = 0;
    }

    init(data) {
        this.shouldTriggerFirstQuiz = data.triggerFirstQuiz || false;
    }

    preload() {
        this.load.audio('correct_snd', 'assets/correct.mp3');
        this.load.audio('wrong_snd', 'assets/wrong.mp3');

        this.createPlaceholderGraphics();
    }

    createPlaceholderGraphics() {
        const bgGfx = this.make.graphics({ x: 0, y: 0, add: false });
        bgGfx.fillStyle(0x87CEEB, 1);
        bgGfx.fillRect(0, 0, 800, 400);
        bgGfx.fillStyle(0x7CFC00, 1);
        bgGfx.fillRect(0, 400, 800, 200);
        bgGfx.generateTexture('bg', 800, 600);

        const melGfx = this.make.graphics({ x: 0, y: 0, add: false });
        melGfx.fillStyle(0x2d8a4e, 1);
        melGfx.fillCircle(20, 20, 20);
        melGfx.lineStyle(3, 0x144726, 1);
        melGfx.strokeCircle(20, 20, 20);
        melGfx.generateTexture('watermelon', 40, 40);

        const moldGfx = this.make.graphics({ x: 0, y: 0, add: false });
        moldGfx.lineStyle(4, 0x0055FF, 1);
        moldGfx.fillStyle(0xFFFFFF, 0.4);
        moldGfx.fillRect(0, 0, 80, 80);
        moldGfx.strokeRect(0, 0, 80, 80);
        moldGfx.generateTexture('square_mold', 80, 80);

        const rockGfx = this.make.graphics({ x: 0, y: 0, add: false });
        rockGfx.fillStyle(0x808080, 1);
        rockGfx.fillTriangle(0, 40, 20, 0, 40, 40);
        rockGfx.generateTexture('obstacle', 40, 40);
    }

    create() {
        this.add.image(400, 300, 'bg');

        this.scoreText = this.add.text(20, 20, 'Score: ' + globalScore + ' / 300', { fontSize: '22px', color: '#000', fontStyle: 'bold' });
        this.livesText = this.add.text(650, 20, 'Lives: ❤️ ' + globalLives, { fontSize: '22px', color: '#d32f2f', fontStyle: 'bold' });

        this.player = this.physics.add.sprite(400, 520, 'square_mold');
        this.player.setCollideWorldBounds(true);
        this.player.body.setImmovable(true);

        this.watermelons = this.physics.add.group();
        this.obstacles = this.physics.add.group();

        this.cursors = this.input.keyboard.createCursorKeys();

        // --- Touch Control Handling ---
        this.input.on('pointerdown', (pointer) => {
            unlockMobileAudio();
            this.player.x = Phaser.Math.Clamp(pointer.x, 40, 760);
        });

        this.input.on('pointermove', (pointer) => {
            if (pointer.isDown) {
                this.player.x = Phaser.Math.Clamp(pointer.x, 40, 760);
            }
        });

        this.spawnTimerMelon = this.time.addEvent({
            delay: 1200,
            callback: this.spawnWatermelon,
            callbackScope: this,
            loop: true
        });

        this.spawnTimerObstacle = this.time.addEvent({
            delay: 3500,
            callback: this.spawnObstacle,
            callbackScope: this,
            loop: true
        });

        this.physics.add.overlap(this.player, this.watermelons, this.catchWatermelon, null, this);
        this.physics.add.overlap(this.player, this.obstacles, this.hitObstacle, null, this);

        // Restart buttons handlers
        document.getElementById('restart-btn').onclick = () => {
            document.getElementById('gameover-modal').style.display = 'none';
            this.resetGame();
        };

        document.getElementById('win-restart-btn').onclick = () => {
            document.getElementById('win-modal').style.display = 'none';
            this.resetGame();
        };

        if (this.shouldTriggerFirstQuiz) {
            this.shouldTriggerFirstQuiz = false;
            this.time.delayedCall(300, () => {
                this.triggerQuiz();
            });
        }
    }

    update() {
        // Keyboard Controls Fallback
        if (this.cursors.left.isDown) {
            this.player.setVelocityX(-420);
        } else if (this.cursors.right.isDown) {
            this.player.setVelocityX(420);
        } else {
            this.player.setVelocityX(0);
        }

        this.watermelons.children.iterate((melon) => {
            if (melon && melon.y > 600) melon.destroy();
        });

        this.obstacles.children.iterate((obs) => {
            if (obs && obs.y > 600) obs.destroy();
        });
    }

    spawnWatermelon() {
        const x = Phaser.Math.Between(50, 750);
        const melon = this.watermelons.create(x, 0, 'watermelon');
        melon.setVelocityY(220 + Math.min(globalScore * 2, 200));
    }

    spawnObstacle() {
        const x = Phaser.Math.Between(50, 750);
        const obstacle = this.obstacles.create(x, 0, 'obstacle');
        obstacle.setVelocityY(260);
    }

    catchWatermelon(player, melon) {
        melon.destroy();
        playSound('correct_snd', this);
        globalScore += 10;
        this.scoreText.setText('Score: ' + globalScore + ' / 300');

        if (globalScore >= 300) {
            this.triggerWin();
            return;
        }

        if (globalScore >= this.nextQuizThreshold) {
            this.nextQuizThreshold += 50;
            this.triggerQuiz();
        }
    }

    hitObstacle(player, obstacle) {
        obstacle.destroy();
        playSound('wrong_snd', this);
        globalLives -= 1;
        this.livesText.setText('Lives: ❤️ ' + globalLives);
        this.cameras.main.flash(200, 255, 0, 0);

        if (globalLives <= 0) {
            this.triggerGameOver();
        }
    }

    triggerGameOver() {
        playSound('wrong_snd', this);
        this.physics.pause();
        this.spawnTimerMelon.paused = true;
        this.spawnTimerObstacle.paused = true;

        const gameOverModal = document.getElementById('gameover-modal');
        const finalScoreText = document.getElementById('final-score-text');
        
        finalScoreText.innerText = "आपका कुल अंक (Total Score): " + globalScore;
        gameOverModal.style.display = 'block';
    }

    triggerWin() {
        playSound('correct_snd', this);
        this.physics.pause();
        this.spawnTimerMelon.paused = true;
        this.spawnTimerObstacle.paused = true;

        const winModal = document.getElementById('win-modal');
        const winScoreText = document.getElementById('win-score-text');

        winScoreText.innerText = "अद्भुत! आपने " + globalScore + " अंक प्राप्त करके खेल जीत लिया है!";
        winModal.style.display = 'block';
    }

    triggerQuiz() {
        this.physics.pause();
        this.spawnTimerMelon.paused = true;
        this.spawnTimerObstacle.paused = true;

        const currentData = chapterQuestions[this.questionIndex % chapterQuestions.length];
        this.questionIndex++;

        const modal = document.getElementById('quiz-modal');
        const qText = document.getElementById('quiz-question');
        const optionsDiv = document.getElementById('quiz-options');
        const feedbackDiv = document.getElementById('quiz-feedback');

        qText.innerText = currentData.question;
        optionsDiv.innerHTML = '';
        feedbackDiv.style.display = 'none';

        currentData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-btn';
            btn.innerText = opt;

            btn.onclick = () => {
                const allBtns = optionsDiv.querySelectorAll('.quiz-btn');
                allBtns.forEach(b => b.disabled = true);

                if (idx === currentData.correct) {
                    playSound('correct_snd', this);
                    globalScore += 20;
                    feedbackDiv.className = 'feedback-correct';
                    feedbackDiv.innerText = "✅ सही उत्तर! (+20 बोनस अंक)";
                } else {
                    playSound('wrong_snd', this);
                    globalScore -= 30;
                    if (globalScore < 0) globalScore = 0;
                    feedbackDiv.className = 'feedback-wrong';
                    feedbackDiv.innerText = "❌ गलत उत्तर! (-30 अंक)";
                }

                this.scoreText.setText('Score: ' + globalScore + ' / 300');
                feedbackDiv.style.display = 'block';

                setTimeout(() => {
                    modal.style.display = 'none';
                    if (globalScore >= 300) {
                        this.triggerWin();
                    } else {
                        this.resumeGame();
                    }
                }, 1500);
            };

            optionsDiv.appendChild(btn);
        });

        modal.style.display = 'block';
    }

    resumeGame() {
        this.physics.resume();
        this.spawnTimerMelon.paused = false;
        this.spawnTimerObstacle.paused = false;
    }

    resetGame() {
        globalScore = 0;
        globalLives = 3;
        this.nextQuizThreshold = 50;
        this.scene.restart({ triggerFirstQuiz: true });
    }
}

// --- Phaser Config (Mobile Friendly Auto-Scale) ---
const config = {
    type: Phaser.AUTO,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 800,
        height: 600
    },
    parent: 'game-container',
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [LogoScene, InstructionScene, GameScene]
};

const game = new Phaser.Game(config);
</script>
