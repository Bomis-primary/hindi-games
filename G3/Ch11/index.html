<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Screen overlays for UI controls */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .btn {
            pointer-events: auto;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: all 0.2s ease;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #ff6b6b, #e74c3c);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Keypad Modal Overlay for Screen 3 */
        #keypad-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a24;
            border: 2px solid #444;
            padding: 20px;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            pointer-events: auto;
            z-index: 10;
        }

        #keypad-display {
            width: 100%;
            height: 40px;
            background: #000;
            color: #00ff66;
            font-family: monospace;
            font-size: 1.8rem;
            text-align: center;
            line-height: 40px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #333;
            letter-spacing: 4px;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .key-btn {
            width: 50px;
            height: 50px;
            background: #2a2a38;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }

        .key-btn:hover {
            background: #3a3a4d;
        }

        .key-btn:active {
            background: #555;
        }

        .keypad-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-clear { background: #e74c3c; color: white; }
        .btn-enter { background: #2ecc71; color: white; }
        .btn-close { background: #7f8c8d; color: white; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- UI Layers -->
        <div id="screen-ui" class="ui-layer"></div>

        <!-- Door Lock Keypad Popup -->
        <div id="keypad-modal">
            <div id="keypad-display">----</div>
            <div class="keypad-grid">
                <button class="key-btn" onclick="pressKey('1')">1</button>
                <button class="key-btn" onclick="pressKey('2')">2</button>
                <button class="key-btn" onclick="pressKey('3')">3</button>
                <button class="key-btn" onclick="pressKey('4')">4</button>
                <button class="key-btn" onclick="pressKey('5')">5</button>
                <button class="key-btn" onclick="pressKey('6')">6</button>
                <button class="key-btn" onclick="pressKey('7')">7</button>
                <button class="key-btn" onclick="pressKey('8')">8</button>
                <button class="key-btn" onclick="pressKey('9')">9</button>
            </div>
            <div class="keypad-actions">
                <button class="action-btn btn-clear" onclick="clearKeypad()">C</button>
                <button class="action-btn btn-enter" onclick="submitCode()">OK</button>
            </div>
            <button class="action-btn btn-close" onclick="closeKeypad()">Close</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('screen-ui');
        const keypadModal = document.getElementById('keypad-modal');
        const keypadDisplay = document.getElementById('keypad-display');

        // Asset Loader
        const logoImg = new Image();
        logoImg.src = 'assets/logo.png';
        let logoLoaded = false;
        logoImg.onload = () => { logoLoaded = true; };

        // Game State Engine
        const SCREENS = {
            START: 1,
            INSTRUCTIONS: 2,
            GAME: 3,
            END: 4
        };
        let currentScreen = SCREENS.START;

        // Gameplay State Variables
        let gameState = {
            hasKey: false,
            safeUnlocked: false,
            doorUnlocked: false,
            codeEntered: "",
            message: "Click items to inspect the room.",
            timeRemaining: 180, // 3 Minutes timer
            timerInterval: null
        };

        // Interactive Objects in Room (Screen 3)
        const interactiveObjects = [
            { id: 'painting', x: 120, y: 120, w: 140, h: 100 },
            { id: 'desk', x: 300, y: 380, w: 200, h: 120 },
            { id: 'safe', x: 550, y: 280, w: 80, h: 90 },
            { id: 'door', x: 680, y: 150, w: 100, h: 320 }
        ];

        // --- SCREEN MANAGERS ---
        function setScreen(screen) {
            currentScreen = screen;
            uiLayer.innerHTML = ''; // Clear UI buttons
            keypadModal.style.display = 'none';

            if (screen === SCREENS.START) {
                renderStartUI();
            } else if (screen === SCREENS.INSTRUCTIONS) {
                renderInstructionsUI();
            } else if (screen === SCREENS.GAME) {
                initGame();
            } else if (screen === SCREENS.END) {
                clearInterval(gameState.timerInterval);
                renderEndUI();
            }
        }

        // --- UI RENDERERS ---
        function renderStartUI() {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Start Experience';
            btn.style.marginTop = '220px';
            btn.onclick = () => setScreen(SCREENS.INSTRUCTIONS);
            uiLayer.appendChild(btn);
        }

        function renderInstructionsUI() {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Begin Escape';
            btn.style.marginTop = '240px';
            btn.onclick = () => setScreen(SCREENS.GAME);
            uiLayer.appendChild(btn);
        }

        function renderEndUI() {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Play Again';
            btn.style.marginTop = '180px';
            btn.onclick = () => setScreen(SCREENS.START);
            uiLayer.appendChild(btn);
        }

        // --- GAME LOGIC ---
        function initGame() {
            gameState.hasKey = false;
            gameState.safeUnlocked = false;
            gameState.doorUnlocked = false;
            gameState.codeEntered = "";
            gameState.message = "Find the clues and unlock the exit door!";
            gameState.timeRemaining = 180;

            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                gameState.timeRemaining--;
                if (gameState.timeRemaining <= 0) {
                    clearInterval(gameState.timerInterval);
                    gameState.message = "Time ran out!";
                    setScreen(SCREENS.END);
                }
            }, 1000);
        }

        function handleRoomClick(x, y) {
            if (currentScreen !== SCREENS.GAME) return;

            // Check interactables
            for (let obj of interactiveObjects) {
                if (x >= obj.x && x <= obj.x + obj.w && y >= obj.y && y <= obj.y + obj.h) {
                    interact(obj.id);
                    return;
                }
            }
        }

        function interact(objectId) {
            if (objectId === 'painting') {
                gameState.message = "You look behind the painting and see numbers scratched in: '1984'.";
            } else if (objectId === 'desk') {
                if (!gameState.hasKey) {
                    gameState.hasKey = true;
                    gameState.message = "You searched the desk drawers and found a Small Silver Key!";
                } else {
                    gameState.message = "Just an empty desk with old paperwork.";
                }
            } else if (objectId === 'safe') {
                if (!gameState.hasKey) {
                    gameState.message = "The safe is locked. It requires a physical key.";
                } else {
                    gameState.safeUnlocked = true;
                    gameState.message = "You used the key! Inside the safe, you find a note: 'Door Code = 1984'.";
                }
            } else if (objectId === 'door') {
                if (!gameState.safeUnlocked) {
                    gameState.message = "The door is secured with a digital keypad. Find the pass code first.";
                } else {
                    openKeypad();
                }
            }
        }

        // --- KEYPAD CONTROL ---
        function openKeypad() {
            gameState.codeEntered = "";
            updateKeypadDisplay();
            keypadModal.style.display = 'flex';
        }

        function closeKeypad() {
            keypadModal.style.display = 'none';
        }

        function pressKey(num) {
            if (gameState.codeEntered.length < 4) {
                gameState.codeEntered += num;
                updateKeypadDisplay();
            }
        }

        function clearKeypad() {
            gameState.codeEntered = "";
            updateKeypadDisplay();
        }

        function updateKeypadDisplay() {
            keypadDisplay.innerText = gameState.codeEntered.padEnd(4, '-');
        }

        function submitCode() {
            if (gameState.codeEntered === "1984") {
                gameState.doorUnlocked = true;
                closeKeypad();
                setScreen(SCREENS.END);
            } else {
                gameState.message = "Access Denied: Incorrect Code!";
                gameState.codeEntered = "";
                updateKeypadDisplay();
            }
        }

        // --- DRAWING / RENDERING ROUTINES ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            switch (currentScreen) {
                case SCREENS.START:
                    drawStartScreen();
                    break;
                case SCREENS.INSTRUCTIONS:
                    drawInstructionsScreen();
                    break;
                case SCREENS.GAME:
                    drawGameScreen();
                    break;
                case SCREENS.END:
                    drawEndScreen();
                    break;
            }

            requestAnimationFrame(draw);
        }

        // Screen 1: Logo & Title Screen
        function drawStartScreen() {
            // Background Gradient
            let bgGrad = ctx.createRadialGradient(400, 300, 50, 400, 300, 400);
            bgGrad.addColorStop(0, '#1f1f2e');
            bgGrad.addColorStop(1, '#08080c');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Logo Image or Fallback Visual
            if (logoLoaded) {
                ctx.drawImage(logoImg, 320, 80, 160, 160);
            } else {
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 4;
                ctx.strokeRect(330, 80, 140, 140);
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('assets/logo.png', 400, 155);
            }

            // Title Text
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 42px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("ESCAPE ROOM", 400, 300);

            ctx.fillStyle = '#8888aa';
            ctx.font = '18px sans-serif';
            ctx.fillText("Can you solve the mystery and break out?", 400, 335);
        }

        // Screen 2: Instructions Screen
        function drawInstructionsScreen() {
            ctx.fillStyle = '#141419';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Panel
            ctx.fillStyle = '#1f1f2a';
            ctx.strokeStyle = '#333344';
            ctx.lineWidth = 2;
            ctx.fillRect(100, 60, 600, 480);
            ctx.strokeRect(100, 60, 600, 480);

            // Text
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("INSTRUCTIONS", 400, 120);

            ctx.fillStyle = '#dddddd';
            ctx.font = '18px sans-serif';
            ctx.textAlign = 'left';

            const instructions = [
                "• Search the room by clicking on various objects.",
                "• Find hidden tools and clues to bypass security locks.",
                "• Collect key items needed to obtain the main passcode.",
                "• Type the correct code into the exit door keypad.",
                "• You have 3 minutes before time runs out!"
            ];

            instructions.forEach((line, index) => {
                ctx.fillText(line, 140, 190 + (index * 45));
            });
        }

        // Screen 3: Main Escape Room Screen
        function drawGameScreen() {
            // Room Background
            ctx.fillStyle = '#2c2c38'; // Back wall
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#1e1e26'; // Floor
            ctx.fillRect(0, 460, canvas.width, 140);
            ctx.beginPath();
            ctx.moveTo(0, 460);
            ctx.lineTo(800, 460);
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 1. Painting (Clue Object)
            ctx.fillStyle = '#8e44ad';
            ctx.fillRect(120, 120, 140, 100);
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 6;
            ctx.strokeRect(120, 120, 140, 100);
            ctx.fillStyle = '#fff';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("Painting", 190, 175);

            // 2. Desk (Key Location)
            ctx.fillStyle = '#d35400';
            ctx.fillRect(300, 380, 200, 80); // Top desk
            ctx.fillRect(320, 460, 30, 60);  // Leg
            ctx.fillRect(450, 460, 30, 60);  // Leg
            ctx.fillStyle = '#a04000';
            ctx.fillRect(310, 400, 180, 50); // Drawers
            ctx.fillStyle = '#fff';
            ctx.font = '14px sans-serif';
            ctx.fillText("Desk", 400, 430);

            // 3. Safe
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(550, 280, 80, 90);
            ctx.fillStyle = '#34495e';
            ctx.fillRect(560, 290, 60, 70);
            ctx.fillStyle = gameState.safeUnlocked ? '#2ecc71' : '#e74c3c';
            ctx.beginPath();
            ctx.arc(600, 325, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.fillText("Safe", 590, 355);

            // 4. Exit Door
            ctx.fillStyle = '#34495e';
            ctx.fillRect(680, 150, 100, 310);
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 4;
            ctx.strokeRect(680, 150, 100, 310);
            // Door handle
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(700, 310, 6, 0, Math.PI * 2);
            ctx.fill();
            // Keypad graphic
            ctx.fillStyle = '#000';
            ctx.fillRect(690, 230, 20, 30);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(695, 235, 10, 8);

            // HUD / UI Overlay inside Canvas
            // Top Status Bar
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, canvas.width, 50);

            // Inventory Status
            ctx.fillStyle = '#fff';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`Inventory: ${gameState.hasKey ? '🔑 Silver Key' : 'Empty'}`, 20, 30);

            // Timer Display
            let mins = Math.floor(gameState.timeRemaining / 60);
            let secs = gameState.timeRemaining % 60;
            let timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            ctx.textAlign = 'right';
            ctx.fillStyle = gameState.timeRemaining < 30 ? '#ff4d4d' : '#00ffcc';
            ctx.fillText(`Time Left: ${timeStr}`, 780, 30);

            // Bottom Message Banner
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 540, canvas.width, 60);
            ctx.fillStyle = '#ffeb3b';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(gameState.message, 400, 575);
        }

        // Screen 4: Game Over / Victory Screen
        function drawEndScreen() {
            ctx.fillStyle = '#0f0f15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';

            if (gameState.doorUnlocked) {
                ctx.fillStyle = '#2ecc71';
                ctx.font = 'bold 46px sans-serif';
                ctx.fillText("ESCAPED SUCCESSFULLY!", 400, 220);

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px sans-serif';
                ctx.fillText(`Great job! You unlocked the door with time to spare.`, 400, 280);
            } else {
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 46px sans-serif';
                ctx.fillText("GAME OVER", 400, 220);

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px sans-serif';
                ctx.fillText("You trapped yourself! Better luck next time.", 400, 280);
            }
        }

        // --- INPUT EVENT LISTENERS ---
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (currentScreen === SCREENS.GAME) {
                handleRoomClick(mouseX, mouseY);
            }
        });

        // Initialize Engine
        setScreen(SCREENS.START);
        requestAnimationFrame(draw);
    </script>
</body>
</html>
