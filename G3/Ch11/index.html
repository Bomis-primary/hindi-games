<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एक अनोखा तरबूज़ - Square Watermelon Game with Quiz</title>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 800px;
            height: 600px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        /* HTML Quiz Overlay Styling */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            background: #ffffff;
            border: 4px solid #2d8a4e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 100;
        }
        #quiz-modal h3 {
            margin-top: 0;
            color: #2d8a4e;
            font-size: 20px;
        }
        #quiz-modal p {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }
        .quiz-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background-color: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-btn:hover {
            background-color: #2d8a4e;
            color: white;
            border-color: #144726;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Quiz Modal Container -->
    <div id="quiz-modal">
        <h3 id="quiz-title">कहानी का प्रश्न (Chapter Question)</h3>
        <p id="quiz-question">प्रश्न यहाँ दिखाई देगा...</p>
        <div id="quiz-options"></div>
    </div>
</div>

<script>
// --- Chapter Questions Data ---
const chapterQuestions = [
    {
        question: "गोलू और दादाजी तरबूज़ को कौन-सा नया आकार देना चाहते थे?",
        options: ["त्रिभुज (Triangle)", "चौकोर (Square)", "स्टार (Star)", "गोलाकार (Round)"],
        correct: 1
    },
    {
        question: "तरबूज़ को चौकोर आकार में ढालने के लिए किसका प्रयोग किया गया?",
        options: ["पारदर्शी सांचा (Transparent Mold)", "लोहे का डिब्बा", "लकड़ी की टोकरी", "कपड़े का थैला"],
        correct: 0
    },
    {
        question: "सांचे में बंद करने के बाद भी पौधों को किसकी आवश्यकता होती है?",
        options: ["केवल पानी", "केवल धूप", "हवा, पानी और धूप", "किसी चीज़ की नहीं"],
        correct: 2
    },
    {
        question: "चौकोर तरबूज़ बनाने का मुख्य व्यावहारिक लाभ क्या है?",
        options: ["वे ज़्यादा मीठे होते हैं", "उन्हें रखना और ले जाना आसान होता है", "वे जल्दी पकते हैं", "उनका रंग लाल होता है"],
        correct: 1
    }
];

// --- Scene 1: Innovine Logo Screen ---
class LogoScene extends Phaser.Scene {
    constructor() {
        super({ key: 'LogoScene' });
    }

    preload() {
        this.load.image('innovine_logo', 'assets/logo.png');
    }

    create() {
        this.cameras.main.setBackgroundColor('#ffffff');

        const logo = this.add.image(400, 300, 'innovine_logo').setOrigin(0.5);
        logo.setAlpha(0);

        this.tweens.add({
            targets: logo,
            alpha: 1,
            duration: 1000,
            ease: 'Power2'
        });

        // 5-second display delay
        this.time.delayedCall(5000, () => {
            this.cameras.main.fadeOut(500, 0, 0, 0);
            this.cameras.main.once('camerafadeoutcomplete', () => {
                this.scene.start('GameScene');
            });
        });
    }
}

// --- Scene 2: Game + Chapter Quiz ---
class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
        this.score = 0;
        this.lives = 3;
        this.nextQuizThreshold = 50; // Trigger quiz every 50 points
        this.questionIndex = 0;
    }

    preload() {
        this.createPlaceholderGraphics();
    }

    createPlaceholderGraphics() {
        // Background
        const bgGfx = this.make.graphics({ x: 0, y: 0, add: false });
        bgGfx.fillStyle(0x87CEEB, 1);
        bgGfx.fillRect(0, 0, 800, 400);
        bgGfx.fillStyle(0x7CFC00, 1);
        bgGfx.fillRect(0, 400, 800, 200);
        bgGfx.generateTexture('bg', 800, 600);

        // Watermelon Sprite
        const melGfx = this.make.graphics({ x: 0, y: 0, add: false });
        melGfx.fillStyle(0x2d8a4e, 1);
        melGfx.fillCircle(20, 20, 20);
        melGfx.lineStyle(3, 0x144726, 1);
        melGfx.strokeCircle(20, 20, 20);
        melGfx.generateTexture('watermelon', 40, 40);

        // Mold Sprite (Player)
        const moldGfx = this.make.graphics({ x: 0, y: 0, add: false });
        moldGfx.lineStyle(4, 0x00FFFF, 1);
        moldGfx.fillStyle(0xFFFFFF, 0.3);
        moldGfx.fillRect(0, 0, 80, 80);
        moldGfx.strokeRect(0, 0, 80, 80);
        moldGfx.generateTexture('square_mold', 80, 80);

        // Obstacle
        const rockGfx = this.make.graphics({ x: 0, y: 0, add: false });
        rockGfx.fillStyle(0x808080, 1);
        rockGfx.fillTriangle(0, 40, 20, 0, 40, 40);
        rockGfx.generateTexture('obstacle', 40, 40);
    }

    create() {
        this.add.image(400, 300, 'bg');

        this.add.text(400, 30, 'एक अनोखा तरबूज़: सांचे में पकड़ें और प्रश्नों के उत्तर दें!', {
            fontSize: '20px',
            color: '#000000',
            fontStyle: 'bold'
        }).setOrigin(0.5);

        this.scoreText = this.add.text(20, 20, 'Score: 0', { fontSize: '20px', color: '#000' });
        this.livesText = this.add.text(680, 20, 'Lives: 3', { fontSize: '20px', color: '#d32f2f', fontStyle: 'bold' });

        this.player = this.physics.add.sprite(400, 520, 'square_mold');
        this.player.setCollideWorldBounds(true);
        this.player.body.setImmovable(true);

        this.watermelons = this.physics.add.group();
        this.obstacles = this.physics.add.group();

        this.cursors = this.input.keyboard.createCursorKeys();

        this.spawnTimerMelon = this.time.addEvent({
            delay: 1200,
            callback: this.spawnWatermelon,
            callbackScope: this,
            loop: true
        });

        this.spawnTimerObstacle = this.time.addEvent({
            delay: 3500,
            callback: this.spawnObstacle,
            callbackScope: this,
            loop: true
        });

        this.physics.add.overlap(this.player, this.watermelons, this.catchWatermelon, null, this);
        this.physics.add.overlap(this.player, this.obstacles, this.hitObstacle, null, this);
    }

    update() {
        if (this.cursors.left.isDown) {
            this.player.setVelocityX(-400);
        } else if (this.cursors.right.isDown) {
            this.player.setVelocityX(400);
        } else {
            this.player.setVelocityX(0);
        }

        this.watermelons.children.iterate((melon) => {
            if (melon && melon.y > 600) melon.destroy();
        });

        this.obstacles.children.iterate((obs) => {
            if (obs && obs.y > 600) obs.destroy();
        });
    }

    spawnWatermelon() {
        const x = Phaser.Math.Between(50, 750);
        const melon = this.watermelons.create(x, 0, 'watermelon');
        melon.setVelocityY(220 + this.score * 2);
    }

    spawnObstacle() {
        const x = Phaser.Math.Between(50, 750);
        const obstacle = this.obstacles.create(x, 0, 'obstacle');
        obstacle.setVelocityY(260);
    }

    catchWatermelon(player, melon) {
        melon.destroy();
        this.score += 10;
        this.scoreText.setText('Score: ' + this.score);

        // Trigger Chapter Question every 50 points
        if (this.score >= this.nextQuizThreshold) {
            this.nextQuizThreshold += 50;
            this.triggerQuiz();
        }
    }

    hitObstacle(player, obstacle) {
        obstacle.destroy();
        this.lives -= 1;
        this.livesText.setText('Lives: ' + this.lives);
        this.cameras.main.flash(200, 255, 0, 0);

        if (this.lives <= 0) {
            this.resetGame();
        }
    }

    triggerQuiz() {
        // Pause physics and timer events
        this.physics.pause();
        this.spawnTimerMelon.paused = true;
        this.spawnTimerObstacle.paused = true;

        // Get question data
        const currentData = chapterQuestions[this.questionIndex % chapterQuestions.length];
        this.questionIndex++;

        // Show HTML modal
        const modal = document.getElementById('quiz-modal');
        const qText = document.getElementById('quiz-question');
        const optionsDiv = document.getElementById('quiz-options');

        qText.innerText = currentData.question;
        optionsDiv.innerHTML = '';

        currentData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if (idx === currentData.correct) {
                    this.score += 20; // Correct answer bonus
                    this.scoreText.setText('Score: ' + this.score);
                    alert("सही उत्तर! +20 बोनस अंक! (Correct Answer!)");
                } else {
                    alert("गलत उत्तर! खेल जारी रखें। (Wrong Answer!)");
                }
                modal.style.display = 'none';
                this.resumeGame();
            };
            optionsDiv.appendChild(btn);
        });

        modal.style.display = 'block';
    }

    resumeGame() {
        this.physics.resume();
        this.spawnTimerMelon.paused = false;
        this.spawnTimerObstacle.paused = false;
    }

    resetGame() {
        this.score = 0;
        this.lives = 3;
        this.nextQuizThreshold = 50;
        this.scene.restart();
    }
}

// --- Phaser Config ---
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [LogoScene, GameScene]
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
