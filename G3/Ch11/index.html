<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एक अनोखा तरबूज़ - Square Watermelon Game</title>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 800px;
            height: 600px;
            box-shadow: 0px 0px 25px rgba(0,0,0,0.8);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        /* Quiz Modal Overlay */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 480px;
            background: #ffffff;
            border: 4px solid #2d8a4e;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            z-index: 100;
        }
        #quiz-modal h3 {
            margin-top: 0;
            color: #2d8a4e;
            font-size: 22px;
        }
        #quiz-modal p {
            font-size: 17px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .quiz-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #f8f9fa;
            border: 2px solid #2d8a4e;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #2d8a4e;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .quiz-btn:hover {
            background-color: #2d8a4e;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Quiz Modal Container -->
    <div id="quiz-modal">
        <h3 id="quiz-title">📖 कहानी प्रश्न (Story Quiz)</h3>
        <p id="quiz-question">प्रश्न यहाँ दिखाई देगा...</p>
        <div id="quiz-options"></div>
    </div>
</div>

<script>
// --- Chapter Questions Data ---
const chapterQuestions = [
    {
        question: "गोलू और दादाजी तरबूज़ को कौन-सा नया आकार देना चाहते थे?",
        options: ["त्रिभुज (Triangle)", "चौकोर (Square)", "स्टार (Star)", "गोलाकार (Round)"],
        correct: 1
    },
    {
        question: "तरबूज़ को चौकोर आकार में ढालने के लिए किसका प्रयोग किया गया?",
        options: ["पारदर्शी सांचा (Transparent Mold)", "लोहे का डिब्बा", "लकड़ी की टोकरी", "कपड़े का थैला"],
        correct: 0
    },
    {
        question: "सांचे में बंद करने के बाद भी पौधों को बढ़ने के लिए क्या चाहिए?",
        options: ["केवल पानी", "केवल हवा", "हवा, पानी और धूप", "कुछ भी नहीं"],
        correct: 2
    },
    {
        question: "चौकोर तरबूज़ बनाने का मुख्य व्यावहारिक लाभ क्या है?",
        options: ["वे ज़्यादा मीठे होते हैं", "उन्हें रखना और ले जाना आसान होता है", "वे जल्दी पकते हैं", "उनका रंग बदल जाता है"],
        correct: 1
    }
];

// --- Scene 1: Innovine Logo Screen ---
class LogoScene extends Phaser.Scene {
    constructor() {
        super({ key: 'LogoScene' });
    }

    preload() {
        this.load.image('innovine_logo', 'assets/logo.png');
    }

    create() {
        this.cameras.main.setBackgroundColor('#ffffff');

        const logo = this.add.image(400, 300, 'innovine_logo').setOrigin(0.5);
        logo.setAlpha(0);

        this.tweens.add({
            targets: logo,
            alpha: 1,
            duration: 1000,
            ease: 'Power2'
        });

        // 5-second display time before moving to Instructions
        this.time.delayedCall(5000, () => {
            this.cameras.main.fadeOut(500, 0, 0, 0);
            this.cameras.main.once('camerafadeoutcomplete', () => {
                this.scene.start('InstructionScene');
            });
        });
    }
}

// --- Scene 2: How to Play / Instructions Screen ---
class InstructionScene extends Phaser.Scene {
    constructor() {
        super({ key: 'InstructionScene' });
    }

    create() {
        this.cameras.main.setBackgroundColor('#1e3d2f');

        // Title
        this.add.text(400, 80, 'एक अनोखा तरबूज़', {
            fontSize: '34px', color: '#7CFC00', fontStyle: 'bold'
        }).setOrigin(0.5);

        this.add.text(400, 130, 'खेलने के नियम (How to Play)', {
            fontSize: '22px', color: '#ffffff', fontStyle: 'bold'
        }).setOrigin(0.5);

        // Rules Box Content
        const rulesText = 
            "1. ⬅️ ➡️ Arrow Keys दबाकर चौकोर सांचे को चलाएँ।\n\n" +
            "2. 🍉 हर तरबूज़ पकड़ने पर आपको +10 अंक मिलेंगे।\n\n" +
            "3. ❓ हर 50 अंक प्राप्त करने पर कहानी का एक प्रश्न आएगा।\n\n" +
            "4. ✅ सही उत्तर देने पर +20 बोनस अंक मिलेंगे!\n\n" +
            "5. 🪨 पत्थर या बाधाओं से बचें, नहीं तो जीवन (Life) कम हो जाएगा।";

        const bgRect = this.add.graphics();
        bgRect.fillStyle(0x000000, 0.4);
        bgRect.fillRoundedRect(100, 170, 600, 280, 15);

        this.add.text(140, 195, rulesText, {
            fontSize: '18px', color: '#f0f0f0', lineSpacing: 8
        });

        // Start Button
        const startBtn = this.add.text(400, 500, '👉 खेल शुरू करें (Start Game)', {
            fontSize: '22px', color: '#000000', backgroundColor: '#7CFC00', padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        startBtn.on('pointerdown', () => {
            this.scene.start('GameScene');
        });
    }
}

// --- Scene 3: Main Game Scene ---
class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
        this.score = 0;
        this.lives = 3;
        this.nextQuizThreshold = 50;
        this.questionIndex = 0;
    }

    preload() {
        this.createPlaceholderGraphics();
    }

    createPlaceholderGraphics() {
        // Background
        const bgGfx = this.make.graphics({ x: 0, y: 0, add: false });
        bgGfx.fillStyle(0x87CEEB, 1);
        bgGfx.fillRect(0, 0, 800, 400);
        bgGfx.fillStyle(0x7CFC00, 1);
        bgGfx.fillRect(0, 400, 800, 200);
        bgGfx.generateTexture('bg', 800, 600);

        // Watermelon Sprite
        const melGfx = this.make.graphics({ x: 0, y: 0, add: false });
        melGfx.fillStyle(0x2d8a4e, 1);
        melGfx.fillCircle(20, 20, 20);
        melGfx.lineStyle(3, 0x144726, 1);
        melGfx.strokeCircle(20, 20, 20);
        melGfx.generateTexture('watermelon', 40, 40);

        // Square Mold Sprite (Player)
        const moldGfx = this.make.graphics({ x: 0, y: 0, add: false });
        moldGfx.lineStyle(4, 0x00FFFF, 1);
        moldGfx.fillStyle(0xFFFFFF, 0.3);
        moldGfx.fillRect(0, 0, 80, 80);
        moldGfx.strokeRect(0, 0, 80, 80);
        moldGfx.generateTexture('square_mold', 80, 80);

        // Obstacle
        const rockGfx = this.make.graphics({ x: 0, y: 0, add: false });
        rockGfx.fillStyle(0x808080, 1);
        rockGfx.fillTriangle(0, 40, 20, 0, 40, 40);
        rockGfx.generateTexture('obstacle', 40, 40);
    }

    create() {
        this.add.image(400, 300, 'bg');

        // Header UI
        this.scoreText = this.add.text(20, 20, 'Score: 0', { fontSize: '22px', color: '#000', fontStyle: 'bold' });
        this.livesText = this.add.text(670, 20, 'Lives: ❤️ 3', { fontSize: '22px', color: '#d32f2f', fontStyle: 'bold' });

        // Player
        this.player = this.physics.add.sprite(400, 520, 'square_mold');
        this.player.setCollideWorldBounds(true);
        this.player.body.setImmovable(true);

        this.watermelons = this.physics.add.group();
        this.obstacles = this.physics.add.group();

        this.cursors = this.input.keyboard.createCursorKeys();

        // Timers
        this.spawnTimerMelon = this.time.addEvent({
            delay: 1200,
            callback: this.spawnWatermelon,
            callbackScope: this,
            loop: true
        });

        this.spawnTimerObstacle = this.time.addEvent({
            delay: 3500,
            callback: this.spawnObstacle,
            callbackScope: this,
            loop: true
        });

        this.physics.add.overlap(this.player, this.watermelons, this.catchWatermelon, null, this);
        this.physics.add.overlap(this.player, this.obstacles, this.hitObstacle, null, this);
    }

    update() {
        if (this.cursors.left.isDown) {
            this.player.setVelocityX(-420);
        } else if (this.cursors.right.isDown) {
            this.player.setVelocityX(420);
        } else {
            this.player.setVelocityX(0);
        }

        this.watermelons.children.iterate((melon) => {
            if (melon && melon.y > 600) melon.destroy();
        });

        this.obstacles.children.iterate((obs) => {
            if (obs && obs.y > 600) obs.destroy();
        });
    }

    spawnWatermelon() {
        const x = Phaser.Math.Between(50, 750);
        const melon = this.watermelons.create(x, 0, 'watermelon');
        melon.setVelocityY(220 + Math.min(this.score * 2, 200));
    }

    spawnObstacle() {
        const x = Phaser.Math.Between(50, 750);
        const obstacle = this.obstacles.create(x, 0, 'obstacle');
        obstacle.setVelocityY(260);
    }

    catchWatermelon(player, melon) {
        melon.destroy();
        this.score += 10; // 10 points per caught watermelon
        this.scoreText.setText('Score: ' + this.score);

        // Checkpoint: Quiz every 50 points
        if (this.score >= this.nextQuizThreshold) {
            this.nextQuizThreshold += 50;
            this.triggerQuiz();
        }
    }

    hitObstacle(player, obstacle) {
        obstacle.destroy();
        this.lives -= 1;
        this.livesText.setText('Lives: ❤️ ' + this.lives);
        this.cameras.main.flash(200, 255, 0, 0);

        if (this.lives <= 0) {
            alert("Game Over! आपका कुल अंक (Total Score): " + this.score);
            this.resetGame();
        }
    }

    triggerQuiz() {
        this.physics.pause();
        this.spawnTimerMelon.paused = true;
        this.spawnTimerObstacle.paused = true;

        const currentData = chapterQuestions[this.questionIndex % chapterQuestions.length];
        this.questionIndex++;

        const modal = document.getElementById('quiz-modal');
        const qText = document.getElementById('quiz-question');
        const optionsDiv = document.getElementById('quiz-options');

        qText.innerText = currentData.question;
        optionsDiv.innerHTML = '';

        currentData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if (idx === currentData.correct) {
                    this.score += 20; // +20 Bonus Points for correct answer
                    this.scoreText.setText('Score: ' + this.score);
                    alert("✅ सही उत्तर! +20 बोनस अंक मिले! (Correct Answer!)");
                } else {
                    alert("❌ गलत उत्तर! (Wrong Answer!)");
                }
                modal.style.display = 'none';
                this.resumeGame();
            };
            optionsDiv.appendChild(btn);
        });

        modal.style.display = 'block';
    }

    resumeGame() {
        this.physics.resume();
        this.spawnTimerMelon.paused = false;
        this.spawnTimerObstacle.paused = false;
    }

    resetGame() {
        this.score = 0;
        this.lives = 3;
        this.nextQuizThreshold = 50;
        this.scene.restart();
    }
}

// --- Phaser Config ---
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [LogoScene, InstructionScene, GameScene]
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
