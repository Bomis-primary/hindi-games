<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>एक अनोखा तरबूज़ & व्याकरण - Multi-Level Game</title>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none; /* Prevent scrolling during gameplay */
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh; /* Dynamic Viewport Height for Mobile Browsers */
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
            box-shadow: 0px 0px 25px rgba(0,0,0,0.8);
            position: relative;
        }
        
        /* Responsive Quiz Modal Overlay */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 520px;
            background: #ffffff;
            border: 5px solid #0055ff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            z-index: 100;
        }
        #quiz-modal h3 {
            margin-top: 0;
            color: #0055ff;
            font-size: 24px;
        }
        #quiz-modal p {
            font-size: 20px;
            font-weight: 600;
            color: #222;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .quiz-btn {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            background-color: #f8f9fa;
            border: 2px solid #0055ff;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #0055ff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .quiz-btn:hover, .quiz-btn:active {
            background-color: #0055ff;
            color: #ffffff;
        }

        /* On-Screen Feedback Message Box */
        #quiz-feedback {
            display: none;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            margin-top: 14px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }
        .feedback-correct {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .feedback-wrong {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        /* Modals (Game Over, Level Complete, Win) */
        .game-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            z-index: 110;
        }
        #gameover-modal { border: 5px solid #d32f2f; }
        #gameover-modal h2 { margin-top: 0; color: #d32f2f; font-size: 28px; }
        
        #levelcomplete-modal { border: 5px solid #0055ff; }
        #levelcomplete-modal h2 { margin-top: 0; color: #0055ff; font-size: 28px; }

        #win-modal { border: 5px solid #2e7d32; }
        #win-modal h2 { margin-top: 0; color: #2e7d32; font-size: 28px; }

        .modal-text {
            font-size: 22px;
            color: #333;
            margin: 18px 0 25px 0;
            font-weight: bold;
        }

        .action-btn {
            display: inline-block;
            padding: 14px 28px;
            background-color: #0055ff;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .action-btn:hover, .action-btn:active {
            background-color: #003db3;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Quiz Modal Container -->
    <div id="quiz-modal">
        <h3 id="quiz-title">📖 प्रश्न (Quiz)</h3>
        <p id="quiz-question">प्रश्न यहाँ दिखाई देगा...</p>
        <div id="quiz-options"></div>
        <div id="quiz-feedback"></div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="game-modal">
        <h2>🎮 खेल समाप्त! (Game Over)</h2>
        <p id="final-score-text" class="modal-text">आपका कुल अंक: 0</p>
        <button id="restart-btn" class="action-btn">🔄 पुनः प्रयास करें (Try Again)</button>
    </div>

    <!-- Level Complete Modal -->
    <div id="levelcomplete-modal" class="game-modal">
        <h2>🎉 स्तर 1 पूर्ण! (Level 1 Complete)</h2>
        <p class="modal-text">शानदार! अब स्तर 2 (व्याकरण: विशेषण के भेद) में प्रवेश करें!</p>
        <button id="next-level-btn" class="action-btn">🚀 अगला स्तर (Start Level 2)</button>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="game-modal">
        <h2>🏆 बधाई हो! आप खेल जीत गए!</h2>
        <p id="win-score-text" class="modal-text">आपने दोनों स्तर सफलतापूर्वक पूर्ण कर लिए हैं!</p>
        <button id="win-restart-btn" class="action-btn">🔄 दोबारा खेलें (Play Again)</button>
    </div>
</div>

<script>
// --- Web Audio Setup ---
const audioCache = {
    correct_snd: new Audio('assets/correct.mp3'),
    wrong_snd: new Audio('assets/wrong.mp3')
};

for (let key in audioCache) { audioCache[key].preload = 'auto'; }

let audioUnlocked = false;
function unlockMobileAudio() {
    if (audioUnlocked) return;
    for (let key in audioCache) {
        audioCache[key].play().then(() => {
            audioCache[key].pause();
            audioCache[key].currentTime = 0;
        }).catch(() => {});
    }
    audioUnlocked = true;
}
window.addEventListener('touchstart', unlockMobileAudio, { once: true });
window.addEventListener('click', unlockMobileAudio, { once: true });

function playSound(soundKey, scene) {
    let played = false;
    if (scene && scene.sound && scene.sound.get(soundKey)) {
        try { scene.sound.play(soundKey); played = true; } catch (e) {}
    }
    if (!played && audioCache[soundKey]) {
        try {
            audioCache[soundKey].currentTime = 0;
            const playPromise = audioCache[soundKey].play();
            if (playPromise !== undefined) {
                playPromise.catch(() => playSynthSound(soundKey));
            }
        } catch (e) { playSynthSound(soundKey); }
    }
}

function playSynthSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'correct_snd') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
        } else if (type === 'wrong_snd') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.setValueAtTime(110, now + 0.08);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
        }
    } catch(e) {}
}

// --- Question Sets ---
// Level 1: Story Questions
const level1Questions = [
    {
        question: "दादाजी ने गोलू को तरबूज़ के कौन-से आकार के बारे में बताया?",
        options: ["त्रिभुज (Triangle)", "चौकोर (Square)", "स्टार (Star)", "गोलाकार (Round)"],
        correct: 1
    },
    {
        question: "तरबूज़ को चौकोर आकार में ढालने के लिए किसका प्रयोग किया गया?",
        options: ["पारदर्शी सांचा (Transparent Mold)", "लोहे का डिब्बा", "लकड़ी की टोकरी", "कपड़े का थैला"],
        correct: 0
    },
    {
        question: "सांचे में बंद करने के बाद भी पौधों को बढ़ने के लिए क्या आवश्यक है?",
        options: ["केवल पानी", "केवल हवा", "हवा, पानी और धूप", "कुछ भी नहीं"],
        correct: 2
    },
    {
        question: "चौकोर तरबूज़ बनाने का मुख्य व्यावहारिक लाभ क्या है?",
        options: ["वे ज़्यादा मीठे होते हैं", "उन्हें रखना और ले जाना आसान होता है", "वे जल्दी पकते हैं", "उनका रंग बदल जाता है"],
        correct: 1
    },
    {
        question: "तरबूज़ को सांचे में किस अवस्था में रखा जाता है?",
        options: ["पकने के बाद", "जब तरबूज़ छोटा और कच्चा होता है", "फूल आने से पहले", "पेड़ से तोड़ने के बाद"],
        correct: 1
    },
    {
        question: "पारदर्शी (transparent) सांचे का प्रयोग क्यों किया गया?",
        options: ["ताकि धूप अंदर पहुँच सके", "ताकि वह सुंदर दिखे", "ताकि वह हल्का हो", "ताकि पानी बाहर न निकले"],
        correct: 0
    }
];

// Level 2: Grammar Questions (विशेषण के भेद)
const level2Questions = [
    {
        question: "संज्ञा या सर्वनाम की विशेषता बताने वाले शब्द क्या कहलाते हैं?",
        options: ["संज्ञा (Noun)", "विशेषण (Adjective)", "सर्वनाम (Pronoun)", "क्रिया (Verb)"],
        correct: 1
    },
    {
        question: "'मीठा फल' और 'चौकोर तरबूज़' में कौन-सा विशेषण है?",
        options: ["गुणवाचक विशेषण", "संख्यावाचक विशेषण", "संकेतवाचक विशेषण", "परिमाणवाचक विशेषण"],
        correct: 0
    },
    {
        question: "'चार आम' और 'दूसरा फल' किस प्रकार के विशेषण हैं?",
        options: ["गुणवाचक विशेषण", "संख्यावाचक विशेषण", "संकेतवाचक विशेषण", "गुणहीन विशेषण"],
        correct: 1
    },
    {
        question: "'यह तरबूज़' में 'यह' शब्द किस प्रकार का विशेषण है?",
        options: ["संख्यावाचक विशेषण", "गुणवाचक विशेषण", "संकेतवाचक विशेषण", "क्रिया विशेषण"],
        correct: 2
    },
    {
        question: "'१. मीठा' - यह फल की किस विशेषता (भेद) को दर्शाता है?",
        options: ["गुणवाचक विशेषण", "संख्यावाचक विशेषण", "संकेतवाचक विशेषण", "व्यक्तिवाचक विशेषण"],
        correct: 0
    },
    {
        question: "'८. तीन' और '५. दूसरा' किस विशेषण के उदाहरण हैं?",
        options: ["संख्यावाचक विशेषण", "गुणवाचक विशेषण", "संकेतवाचक विशेषण", "परिमाणवाचक विशेषण"],
        correct: 0
    }
];

let globalScore = 0;
let globalLives = 3;
let currentLevel = 1;

function getShuffledOptions(questionData) {
    const shuffledOptions = questionData.options.map((option, originalIndex) => ({
        text: option,
        isCorrect: originalIndex === questionData.correct
    }));

    for (let i = shuffledOptions.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [shuffledOptions[i], shuffledOptions[randomIndex]] = [shuffledOptions[randomIndex], shuffledOptions[i]];
    }

    return shuffledOptions;
}

// --- Scene 1: Logo Screen ---
class LogoScene extends Phaser.Scene {
    constructor() { super({ key: 'LogoScene' }); }
    preload() { this.load.image('innovine_logo', 'assets/logo.png'); }
    create() {
        this.cameras.main.setBackgroundColor('#ffffff');
        const logo = this.add.image(400, 300, 'innovine_logo').setOrigin(0.5);
        logo.setAlpha(0);

        this.tweens.add({
            targets: logo,
            alpha: 1,
            duration: 800,
            ease: 'Power2'
        });

        this.time.delayedCall(2500, () => {
            this.cameras.main.fadeOut(400, 0, 0, 0);
            this.cameras.main.once('camerafadeoutcomplete', () => {
                this.scene.start('InstructionScene');
            });
        });
    }
}

// --- Scene 2: Instructions Screen ---
class InstructionScene extends Phaser.Scene {
    constructor() { super({ key: 'InstructionScene' }); }

    create() {
        this.cameras.main.setBackgroundColor('#1a2634');

        this.add.text(400, 45, 'एक अनोखा तरबूज़ और व्याकरण', {
            fontSize: '34px', color: '#4da6ff', fontStyle: 'bold'
        }).setOrigin(0.5);

        this.add.text(400, 95, 'खेलने के नियम (Rules & Instructions)', {
            fontSize: '22px', color: '#ffffff', fontStyle: 'bold'
        }).setOrigin(0.5);

        const rulesText = 
            "1. 📱 स्क्रीन पर Touch / Slide करके सांचा चलाएं।\n\n" +
            "2. 🍉 तरबूज़ पकड़ने पर +10 अंक मिलेंगे।\n\n" +
            "3. 📚 स्तर 1: कहानी प्रश्न | स्तर 2: व्याकरण (विशेषण भेद)\n\n" +
            "4. ✅ सही उत्तर: +20 अंक | ❌ गलत उत्तर: -30 अंक\n\n" +
            "5. 🏆 300 अंक हासिल करने पर स्तर पार होगा!";

        const bgRect = this.add.graphics();
        bgRect.fillStyle(0x0a192f, 0.85);
        bgRect.lineStyle(3, 0x0055ff, 1);
        bgRect.fillRoundedRect(50, 130, 700, 330, 15);
        bgRect.strokeRoundedRect(50, 130, 700, 330, 15);

        this.add.text(80, 155, rulesText, {
            fontSize: '21px', color: '#f0f0f0', lineSpacing: 8
        });

        const startBtn = this.add.text(400, 515, '👉 खेल शुरू करें (Start Level 1)', {
            fontSize: '26px', color: '#ffffff', backgroundColor: '#0055ff', padding: { x: 25, y: 14 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        startBtn.on('pointerdown', () => {
            unlockMobileAudio();
            globalScore = 0;
            globalLives = 3;
            currentLevel = 1;
            this.scene.start('GameScene', { triggerFirstQuiz: true });
        });
    }
}

// --- Scene 3: Main Game Scene ---
class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
        this.nextQuizThreshold = 50;
        this.questionIndex = 0;
    }

    init(data) {
        this.shouldTriggerFirstQuiz = data.triggerFirstQuiz || false;
    }

    preload() {
        this.load.audio('correct_snd', 'assets/correct.mp3');
        this.load.audio('wrong_snd', 'assets/wrong.mp3');
        this.createPlaceholderGraphics();
    }

    createPlaceholderGraphics() {
        const bgGfx = this.make.graphics({ x: 0, y: 0, add: false });
        bgGfx.fillStyle(currentLevel === 1 ? 0x87CEEB : 0xd8f3dc, 1);
        bgGfx.fillRect(0, 0, 800, 400);
        bgGfx.fillStyle(currentLevel === 1 ? 0x7CFC00 : 0x74c69d, 1);
        bgGfx.fillRect(0, 400, 800, 200);
        bgGfx.generateTexture('bg_' + currentLevel, 800, 600);

        const melGfx = this.make.graphics({ x: 0, y: 0, add: false });
        melGfx.fillStyle(currentLevel === 1 ? 0x2d8a4e : 0xe63946, 1);
        melGfx.fillCircle(20, 20, 20);
        melGfx.lineStyle(3, 0x144726, 1);
        melGfx.strokeCircle(20, 20, 20);
        melGfx.generateTexture('watermelon', 40, 40);

        const moldGfx = this.make.graphics({ x: 0, y: 0, add: false });
        moldGfx.lineStyle(4, 0x0055FF, 1);
        moldGfx.fillStyle(0xFFFFFF, 0.4);
        moldGfx.fillRect(0, 0, 80, 80);
        moldGfx.strokeRect(0, 0, 80, 80);
        moldGfx.generateTexture('square_mold', 80, 80);

        const rockGfx = this.make.graphics({ x: 0, y: 0, add: false });
        rockGfx.fillStyle(0x808080, 1);
        rockGfx.fillTriangle(0, 40, 20, 0, 40, 40);
        rockGfx.generateTexture('obstacle', 40, 40);
    }

    create() {
        this.add.image(400, 300, 'bg_' + currentLevel);

        this.levelText = this.add.text(20, 15, 'Level: ' + currentLevel + ' (' + (currentLevel === 1 ? 'कहानी' : 'व्याकरण') + ')', { fontSize: '22px', color: '#000', fontStyle: 'bold' });
        this.scoreText = this.add.text(20, 45, 'Score: ' + globalScore + ' / 300', { fontSize: '24px', color: '#000', fontStyle: 'bold' });
        this.livesText = this.add.text(620, 20, 'Lives: ❤️ ' + globalLives, { fontSize: '26px', color: '#d32f2f', fontStyle: 'bold' });

        this.player = this.physics.add.sprite(400, 520, 'square_mold');
        this.player.setCollideWorldBounds(true);
        this.player.body.setImmovable(true);

        this.watermelons = this.physics.add.group();
        this.obstacles = this.physics.add.group();

        this.cursors = this.input.keyboard.createCursorKeys();

        this.input.on('pointerdown', (pointer) => {
            unlockMobileAudio();
            this.player.x = Phaser.Math.Clamp(pointer.worldX, 40, 760);
        });

        this.input.on('pointermove', (pointer) => {
            if (pointer.isDown) {
                this.player.x = Phaser.Math.Clamp(pointer.worldX, 40, 760);
            }
        });

        this.spawnTimerMelon = this.time.addEvent({
            delay: 1200,
            callback: this.spawnWatermelon,
            callbackScope: this,
            loop: true
        });

        this.spawnTimerObstacle = this.time.addEvent({
            delay: 3500,
            callback: this.spawnObstacle,
            callbackScope: this,
            loop: true
        });

        this.physics.add.overlap(this.player, this.watermelons, this.catchWatermelon, null, this);
        this.physics.add.overlap(this.player, this.obstacles, this.hitObstacle, null, this);

        // UI Event Listeners
        document.getElementById('restart-btn').onclick = () => {
            document.getElementById('gameover-modal').style.display = 'none';
            this.resetGame();
        };

        document.getElementById('next-level-btn').onclick = () => {
            document.getElementById('levelcomplete-modal').style.display = 'none';
            currentLevel = 2;
            globalScore = 0;
            this.nextQuizThreshold = 50;
            this.questionIndex = 0;
            this.scene.restart({ triggerFirstQuiz: true });
        };

        document.getElementById('win-restart-btn').onclick = () => {
            document.getElementById('win-modal').style.display = 'none';
            currentLevel = 1;
            this.resetGame();
        };

        if (this.shouldTriggerFirstQuiz) {
            this.shouldTriggerFirstQuiz = false;
            this.time.delayedCall(300, () => {
                this.triggerQuiz();
            });
        }
    }

    update() {
        if (this.cursors.left.isDown) {
            this.player.setVelocityX(-420);
        } else if (this.cursors.right.isDown) {
            this.player.setVelocityX(420);
        } else {
            this.player.setVelocityX(0);
        }

        this.watermelons.children.iterate((melon) => {
            if (melon && melon.y > 600) melon.destroy();
        });

        this.obstacles.children.iterate((obs) => {
            if (obs && obs.y > 600) obs.destroy();
        });
    }

    spawnWatermelon() {
        const x = Phaser.Math.Between(50, 750);
        const melon = this.watermelons.create(x, 0, 'watermelon');
        melon.setVelocityY(220 + Math.min(globalScore * 2, 200));
    }

    spawnObstacle() {
        const x = Phaser.Math.Between(50, 750);
        const obstacle = this.obstacles.create(x, 0, 'obstacle');
        obstacle.setVelocityY(260);
    }

    catchWatermelon(player, melon) {
        melon.destroy();
        playSound('correct_snd', this);
        globalScore += 10;
        this.scoreText.setText('Score: ' + globalScore + ' / 300');

        if (globalScore >= 300) {
            if (currentLevel === 1) {
                this.triggerLevelComplete();
            } else {
                this.triggerWin();
            }
            return;
        }

        if (globalScore >= this.nextQuizThreshold) {
            this.nextQuizThreshold += 50;
            this.triggerQuiz();
        }
    }

    hitObstacle(player, obstacle) {
        obstacle.destroy();
        playSound('wrong_snd', this);
        globalLives -= 1;
        this.livesText.setText('Lives: ❤️ ' + globalLives);
        this.cameras.main.flash(200, 255, 0, 0);

        if (globalLives <= 0) {
            this.triggerGameOver();
        }
    }

    triggerGameOver() {
        playSound('wrong_snd', this);
        this.physics.pause();
        this.spawnTimerMelon.paused = true;
        this.spawnTimerObstacle.paused = true;

        const gameOverModal = document.getElementById('gameover-modal');
        document.getElementById('final-score-text').innerText = "आपका कुल अंक (Total Score): " + globalScore;
        gameOverModal.style.display = 'block';
    }

    triggerLevelComplete() {
        playSound('correct_snd', this);
        this.physics.pause();
        this.spawnTimerMelon.paused = true;
        this.spawnTimerObstacle.paused = true;

        document.getElementById('levelcomplete-modal').style.display = 'block';
    }

    triggerWin() {
        playSound('correct_snd', this);
        this.physics.pause();
        this.spawnTimerMelon.paused = true;
        this.spawnTimerObstacle.paused = true;

        const winModal = document.getElementById('win-modal');
        document.getElementById('win-score-text').innerText = "अद्भुत! आपने स्तर 2 भी पूर्ण करके 300 अंक प्राप्त कर लिए हैं!";
        winModal.style.display = 'block';
    }

    triggerQuiz() {
        this.physics.pause();
        this.spawnTimerMelon.paused = true;
        this.spawnTimerObstacle.paused = true;

        const currentQuestions = currentLevel === 1 ? level1Questions : level2Questions;
        const currentData = currentQuestions[this.questionIndex % currentQuestions.length];
        this.questionIndex++;

        const modal = document.getElementById('quiz-modal');
        const qTitle = document.getElementById('quiz-title');
        const qText = document.getElementById('quiz-question');
        const optionsDiv = document.getElementById('quiz-options');
        const feedbackDiv = document.getElementById('quiz-feedback');

        qTitle.innerText = currentLevel === 1 ? "📖 कहानी प्रश्न (Story Quiz)" : "📝 व्याकरण प्रश्न (Grammar Quiz)";
        qText.innerText = currentData.question;
        optionsDiv.innerHTML = '';
        feedbackDiv.style.display = 'none';

        const shuffledOptions = getShuffledOptions(currentData);

        shuffledOptions.forEach((optionData) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-btn';
            btn.innerText = optionData.text;

            btn.onclick = () => {
                const allBtns = optionsDiv.querySelectorAll('.quiz-btn');
                allBtns.forEach(b => b.disabled = true);

                if (optionData.isCorrect) {
                    playSound('correct_snd', this);
                    globalScore += 20;
                    feedbackDiv.className = 'feedback-correct';
                    feedbackDiv.innerText = "✅ सही उत्तर! (+20 बोनस अंक)";
                } else {
                    playSound('wrong_snd', this);
                    globalScore -= 30;
                    if (globalScore < 0) globalScore = 0;
                    feedbackDiv.className = 'feedback-wrong';
                    feedbackDiv.innerText = "❌ गलत उत्तर! (-30 अंक)";
                }

                this.scoreText.setText('Score: ' + globalScore + ' / 300');
                feedbackDiv.style.display = 'block';

                setTimeout(() => {
                    modal.style.display = 'none';
                    if (globalScore >= 300) {
                        if (currentLevel === 1) {
                            this.triggerLevelComplete();
                        } else {
                            this.triggerWin();
                        }
                    } else {
                        this.resumeGame();
                    }
                }, 1200);
            };

            optionsDiv.appendChild(btn);
        });

        modal.style.display = 'block';
    }

    resumeGame() {
        this.physics.resume();
        this.spawnTimerMelon.paused = false;
        this.spawnTimerObstacle.paused = false;
    }

    resetGame() {
        globalScore = 0;
        globalLives = 3;
        this.nextQuizThreshold = 50;
        this.questionIndex = 0;
        this.scene.restart({ triggerFirstQuiz: true });
    }
}

// --- Phaser Config ---
const config = {
    type: Phaser.AUTO,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 800,
        height: 600
    },
    parent: 'game-container',
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [LogoScene, InstructionScene, GameScene]
};

const game = new Phaser.Game(config);
</script>
