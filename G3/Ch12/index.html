<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>एआई का कमाल - खेल संग्रह</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            touch-action: manipulation;
            color: #f8fafc;
        }

        /* Screen Routing */
        .screen {
            display: none;
            width: 100%;
            max-width: 800px;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        /* SCREEN 1: Splash Screen */
        #screen1 {
            height: 80vh;
            justify-content: center;
            align-items: center;
        }

        .logo-container {
            animation: fadeInScale 1.5s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .brand-logo-img {
            max-width: 80%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
        }

        .splash-timer {
            margin-top: 15px;
            width: 60%;
            max-width: 180px;
            height: 6px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
        }

        .splash-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            animation: loadProgress 5s linear forwards;
        }

        /* SCREEN 2: Level Selection */
        .card-box {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #334155;
            backdrop-filter: blur(12px);
            padding: 24px 18px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }

        .card-box h2 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 1.6rem;
        }

        .level-select-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
            width: 100%;
        }

        .btn-primary {
            padding: 14px 28px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            width: 100%;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #059669, #0d9488);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.4);
        }

        .btn-primary:active, .btn-secondary:active {
            transform: scale(0.96);
        }

        /* SCREEN 3: Game Headers & Board */
        .game-header h1 {
            color: #38bdf8;
            font-size: 1.4rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .stats-board {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            padding: 8px 24px;
            border-radius: 50px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            margin: 10px 0 20px 0;
            font-weight: bold;
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        .score-val { color: #38bdf8; font-size: 1.1rem; }

        /* Level 1 UI Elements */
        .matching-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            max-width: 750px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .column-header {
            font-size: 0.95rem;
            font-weight: 700;
            padding: 8px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.6);
            color: #a7f3d0;
            border: 1px solid #059669;
        }

        .column-header.col-b {
            color: #fde68a;
            border-color: #d97706;
        }

        .match-card {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #475569;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #f1f5f9;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .match-card.selected {
            border-color: #a855f7;
            background: #581c87;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            transform: scale(1.02);
        }

        .match-card.matched {
            border-color: #22c55e !important;
            background: rgba(20, 83, 45, 0.8) !important;
            color: #86efac;
            cursor: default;
            opacity: 0.85;
        }

        .match-card.wrong-flash {
            border-color: #ef4444 !important;
            background: rgba(127, 29, 29, 0.9) !important;
            animation: shake 0.4s ease-in-out;
        }

        /* Level 2 UI Elements (Ashuddhi Shodhan) */
        .grammar-box {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid #475569;
            padding: 20px;
            border-radius: 18px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .sentence-display {
            background: rgba(15, 23, 42, 0.8);
            border: 1px dashed #f59e0b;
            padding: 15px;
            border-radius: 12px;
            color: #fef3c7;
            font-size: 1.15rem;
            font-weight: bold;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .option-btn {
            background: rgba(51, 65, 85, 0.7);
            border: 2px solid #64748b;
            padding: 12px;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .option-btn:hover {
            border-color: #38bdf8;
            background: rgba(71, 85, 105, 0.9);
        }

        .option-btn.correct-ans {
            border-color: #22c55e !important;
            background: rgba(20, 83, 45, 0.9) !important;
            color: #86efac;
        }

        .option-btn.wrong-ans {
            border-color: #ef4444 !important;
            background: rgba(127, 29, 29, 0.9) !important;
            color: #fca5a5;
            animation: shake 0.4s ease-in-out;
        }

        /* SCREEN 4: End Screen */
        .end-card {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155;
            padding: 35px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }

        .end-card h2 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 10px; }
        .end-card p { color: #cbd5e1; font-size: 1rem; margin-bottom: 25px; }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        @media (min-width: 600px) {
            .card-box { padding: 35px; }
            .card-box h2 { font-size: 1.8rem; }
            .game-header h1 { font-size: 1.8rem; }
            .stats-board { font-size: 1.1rem; }
            .match-card { font-size: 1rem; padding: 16px; }
            .matching-container { gap: 24px; }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: Splash Screen -->
    <div id="screen1" class="screen active">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Innovine Logo" class="brand-logo-img">
            <div class="splash-timer">
                <div class="splash-progress"></div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: Level Selection Screen -->
    <div id="screen2" class="screen">
        <div class="card-box">
            <h2>🎯 लेवल चुनें</h2>
            <p style="color: #cbd5e1; margin-bottom: 10px;">अपनी पसंद का गेम खेलें:</p>
            <div class="level-select-container">
                <button class="btn-primary" onclick="startLevel(1)">लेवल 1: सही जोड़ी मिलाओ (A और B) 🧩</button>
                <button class="btn-primary btn-secondary" onclick="startLevel(2)">लेवल 2: अशुद्धि-शोधन (व्याकरण) ✍️</button>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: Game Board -->
    <div id="screen3" class="screen">
        <div class="game-header">
            <h1 id="gameTitle">एआई का कमाल</h1>
        </div>

        <div class="stats-board">
            स्कोर: <span id="score" class="score-val">0</span> / <span id="total-score">5</span>
        </div>

        <!-- Level 1 Board -->
        <div id="level1Board" class="matching-container" style="display: none;">
            <div class="column">
                <div class="column-header">कॉलम A (कार्य / भावना)</div>
                <div id="colA" class="column"></div>
            </div>
            <div class="column">
                <div class="column-header col-b">कॉलम B (माध्यम / कर्ता)</div>
                <div id="colB" class="column"></div>
            </div>
        </div>

        <!-- Level 2 Board -->
        <div id="level2Board" class="grammar-box" style="display: none;">
            <p style="color: #a7f3d0; font-weight: 600;">अशुद्ध वाक्य को देखकर सही शुद्ध वाक्य चुनें:</p>
            <div id="incorrectSentence" class="sentence-display">अशुद्ध वाक्य लोड हो रहा है...</div>
            <div id="optionsGrid" class="options-grid"></div>
        </div>
    </div>

    <!-- SCREEN 4: End Screen -->
    <div id="screen4" class="screen">
        <div class="end-card">
            <h2>🎉 अद्भुत प्रदर्शन!</h2>
            <p id="endMessage">आपने सफलतापूर्वक लेवल पूरा कर लिया है!</p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-primary" onclick="goToScreen(2)">अन्य लेवल चुनें 🎯</button>
                <button class="btn-primary btn-secondary" onclick="restartCurrentLevel()">पुनः खेलें 🔄</button>
            </div>
        </div>
    </div>

    <script>
        const audioFiles = {
            correct: new Audio('assets/correct.mp3'),
            wrong: new Audio('assets/wrong.mp3')
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioFiles[type]) {
                audioFiles[type].currentTime = 0;
                audioFiles[type].play().catch(() => playSynthSound(type));
            } else {
                playSynthSound(type);
            }
        }

        function playSynthSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'select') {
                osc.frequency.setValueAtTime(450, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(140, now + 0.12);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        // LEVEL 1 DATA (Matching)
        const pairsBank = [
            { id: 1, optionA: '🚗 बिना ड्राइवर गाड़ी चलाना', optionB: '🤖 एआई (स्वचालित कार)' },
            { id: 2, optionA: '💖 दया और मानवीय भावनाएं', optionB: '🧠 इंसान (मानव)' },
            { id: 3, optionA: '🌐 भाषाओं का तुरंत अनुवाद', optionB: '⚡ एआई मशीन' },
            { id: 4, optionA: '🎨 मौलिक कला और रचनात्मकता', optionB: '🎨 इंसानी दिमाग' },
            { id: 5, optionA: '🔓 चेहरा पहचानकर सुरक्षा', optionB: '👁️ एआई सुरक्षा प्रणाली' }
        ];

        // LEVEL 2 DATA (Ashuddhi Shodhan)
        const grammarBank = [
            {
                incorrect: "अशुद्ध : बच्चो खेल रहे है।",
                options: [
                    "बच्चे खेल रहे हैं।",
                    "बच्चो खेल रहा हैं।",
                    "बच्चे खेल रहा है।"
                ],
                correctIndex: 0
            },
            {
                incorrect: "अशुद्ध : रोहन ने गाना गाया हैं।",
                options: [
                    "रोहन गाना गाते हैं।",
                    "रोहन ने गाना गाया।",
                    "रोहन गाना गा रहा हैं।"
                ],
                correctIndex: 1
            },
            {
                incorrect: "अशुद्ध : मेरे को घर जाना है।",
                options: [
                    "मेरे घर जाना है।",
                    "मुझे घर जाना है।",
                    "मुझको घर जाते हैं।"
                ],
                correctIndex: 1
            },
            {
                incorrect: "अशुद्ध : एआई बहुत बुद्धिमान होती है।",
                options: [
                    "एआई बहुत बुद्धिमान होता है।",
                    "एआई बुद्धिमत्ता है।",
                    "एआई बहुत बुद्धिमान हैं।"
                ],
                correctIndex: 0
            }
        ];

        let currentLevel = 1;
        let selectedA = null;
        let selectedB = null;
        let score = 0;
        let level2Index = 0;

        function goToScreen(screenNumber) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen${screenNumber}`).classList.add('active');
        }

        window.onload = () => {
            setTimeout(() => {
                goToScreen(2);
            }, 5000);
        };

        function startLevel(lvl) {
            currentLevel = lvl;
            score = 0;
            document.getElementById('score').innerText = score;
            goToScreen(3);

            if (lvl === 1) {
                document.getElementById('gameTitle').innerText = "🧩 लेवल 1: सही जोड़ी मिलाओ";
                document.getElementById('level1Board').style.display = 'grid';
                document.getElementById('level2Board').style.display = 'none';
                initLevel1();
            } else if (lvl === 2) {
                document.getElementById('gameTitle').innerText = "✍️ लेवल 2: अशुद्धि-शोधन";
                document.getElementById('level1Board').style.display = 'none';
                document.getElementById('level2Board').style.display = 'flex';
                initLevel2();
            }
        }

        /* --- LEVEL 1 LOGIC --- */
        function initLevel1() {
            selectedA = null;
            selectedB = null;
            document.getElementById('total-score').innerText = pairsBank.length;

            const colAContainer = document.getElementById('colA');
            const colBContainer = document.getElementById('colB');
            colAContainer.innerHTML = '';
            colBContainer.innerHTML = '';

            const listA = [...pairsBank].sort(() => Math.random() - 0.5);
            const listB = [...pairsBank].sort(() => Math.random() - 0.5);

            listA.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerText = item.optionA;
                card.onclick = () => handleSelectA(card, item.id);
                colAContainer.appendChild(card);
            });

            listB.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerText = item.optionB;
                card.onclick = () => handleSelectB(card, item.id);
                colBContainer.appendChild(card);
            });
        }

        function handleSelectA(cardElement, id) {
            if (cardElement.classList.contains('matched')) return;
            playSound('select');
            document.querySelectorAll('#colA .match-card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');
            selectedA = { element: cardElement, id: id };
            checkMatch();
        }

        function handleSelectB(cardElement, id) {
            if (cardElement.classList.contains('matched')) return;
            playSound('select');
            document.querySelectorAll('#colB .match-card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');
            selectedB = { element: cardElement, id: id };
            checkMatch();
        }

        function checkMatch() {
            if (selectedA && selectedB) {
                if (selectedA.id === selectedB.id) {
                    playSound('correct');
                    selectedA.element.classList.remove('selected');
                    selectedB.element.classList.remove('selected');
                    selectedA.element.classList.add('matched');
                    selectedB.element.classList.add('matched');

                    selectedA = null;
                    selectedB = null;
                    score++;
                    document.getElementById('score').innerText = score;

                    if (score === pairsBank.length) {
                        setTimeout(() => {
                            document.getElementById('endMessage').innerText = "आपने सभी जोडियों का सही मिलान किया!";
                            goToScreen(4);
                        }, 500);
                    }
                } else {
                    playSound('wrong');
                    const tempA = selectedA.element;
                    const tempB = selectedB.element;
                    tempA.classList.add('wrong-flash');
                    tempB.classList.add('wrong-flash');

                    selectedA = null;
                    selectedB = null;

                    setTimeout(() => {
                        tempA.classList.remove('selected', 'wrong-flash');
                        tempB.classList.remove('selected', 'wrong-flash');
                    }, 500);
                }
            }
        }

        /* --- LEVEL 2 LOGIC (Grammar / Ashuddhi-Shodhan) --- */
        function initLevel2() {
            level2Index = 0;
            document.getElementById('total-score').innerText = grammarBank.length;
            loadGrammarQuestion();
        }

        function loadGrammarQuestion() {
            const currentQ = grammarBank[level2Index];
            document.getElementById('incorrectSentence').innerText = currentQ.incorrect;
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';

            currentQ.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${index + 1}. ${optText}`;
                btn.onclick = () => handleGrammarAnswer(btn, index, currentQ.correctIndex);
                optionsGrid.appendChild(btn);
            });
        }

        function handleGrammarAnswer(btnElement, selectedIdx, correctIdx) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selectedIdx === correctIdx) {
                playSound('correct');
                btnElement.classList.add('correct-ans');
                score++;
                document.getElementById('score').innerText = score;

                setTimeout(() => {
                    level2Index++;
                    if (level2Index < grammarBank.length) {
                        loadGrammarQuestion();
                    } else {
                        document.getElementById('endMessage').innerText = "आपने सभी अशुद्ध वाक्यों का सही व्याकरण शोधन किया!";
                        goToScreen(4);
                    }
                }, 1000);
            } else {
                playSound('wrong');
                btnElement.classList.add('wrong-ans');
                allBtns[correctIdx].classList.add('correct-ans');

                setTimeout(() => {
                    level2Index++;
                    if (level2Index < grammarBank.length) {
                        loadGrammarQuestion();
                    } else {
                        document.getElementById('endMessage').innerText = "गेम समाप्त! आपने व्याकरण शोधन का अभ्यास किया।";
                        goToScreen(4);
                    }
                }, 1400);
            }
        }

        function restartCurrentLevel() {
            startLevel(currentLevel);
        }
    </script>
</body>
</html>
