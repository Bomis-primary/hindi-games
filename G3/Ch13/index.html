<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>व्याकरण बोध: मुहावरे - घटनाक्रम खेल</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #game-container {
            background: #ffffff;
            max-width: 680px;
            width: 100%;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #1a252f;
            margin-bottom: 15px;
            font-size: 1.6em;
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #eef2f7;
            padding: 10px 15px;
            border-radius: 8px;
        }

        #level-indicator {
            font-weight: bold;
            color: #2c3e50;
        }

        .btn-toggle {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-toggle:hover {
            background-color: #2980b9;
        }

        .instructions {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        /* Level 1 List Styles */
        #events-list {
            list-style-type: none;
            margin-bottom: 20px;
        }

        #events-list li {
            background-color: #fafafa;
            border: 2px solid #e0e0e0;
            margin: 8px 0;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            user-select: none;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        }

        #events-list li:active {
            cursor: grabbing;
        }

        #events-list li.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .drag-icon {
            margin-right: 12px;
            color: #aaa;
            font-size: 1.2em;
        }

        /* Level 2 Matching Container Styles */
        #matching-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .match-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            background-color: #fafafa;
            border: 2px solid #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .match-card:hover {
            border-color: #3498db;
            background-color: #f0f7fc;
        }

        .match-card.selected {
            border-color: #f39c12;
            background-color: #fef9e7;
            transform: scale(1.02);
        }

        .match-card.matched {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            cursor: default;
        }

        .match-card.wrong {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-check {
            background-color: #27ae60;
            color: white;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }

        #feedback {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.05em;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h2>हिम्मत की दौड़ - घटनाक्रम व व्याकरण</h2>
        
        <div class="controls-header">
            <span id="level-indicator">स्तर: 1</span>
            <button id="level-toggle-btn" class="btn-toggle">स्तर 2 पर जाएं</button>
        </div>

        <p class="instructions" id="instructions-text">घटनाओं को सही कालानुक्रमिक (Chronological) क्रम में व्यवस्थित करने के लिए ड्रैग करें:</p>

        <!-- Level 1 Drag List -->
        <ul id="events-list"></ul>

        <!-- Level 2 Interactive Match Grid -->
        <div id="matching-container">
            <div class="match-column" id="idioms-column"></div>
            <div class="match-column" id="meanings-column"></div>
        </div>

        <div class="button-group">
            <button id="check-btn" class="btn btn-check">उत्तर जांचें</button>
            <button id="reset-btn" class="btn btn-reset">पुनः प्रयास करें</button>
        </div>

        <div id="feedback"></div>
    </div>

    <script>
        // ==========================================
        // DATA POOL
        // ==========================================
        const masterEventsPool = [
            // LEVEL 1: Main Story Line
            { id: "e1", level: 1, text: "डेरेक रेडमंड का जन्म 3 सितंबर 1965 को इंग्लैंड में हुआ।", correctOrder: 1 },
            { id: "e2", level: 1, text: "डेरेक का सपना ओलंपिक में स्वर्ण पदक जीतना था।", correctOrder: 2 },
            { id: "e3", level: 1, text: "डेरेक ने 7 वर्ष की उम्र में एथलेटिक्स क्लब में अभ्यास शुरू किया।", correctOrder: 3 },
            { id: "e4", level: 1, text: "1992 बार्सिलोना ओलंपिक 400 मीटर सेमीफाइनल की दौड़ शुरू हुई।", correctOrder: 4 },
            { id: "e5", level: 1, text: "250 मीटर पर डेरेक के पैर की हैमस्ट्रिंग में चोट लगी और वह गिर पड़े।", correctOrder: 5 },
            { id: "e6", level: 1, text: "डेरेक दर्द में भी उठे और लंगड़ाते हुए आगे बढ़ने लगे।", correctOrder: 6 },
            { id: "e7", level: 1, text: "पिता जिम रेडमंड मैदान में आए और अपने बेटे को सहारा दिया।", correctOrder: 7 },
            { id: "e8", level: 1, text: "दर्शकों की तालियों के बीच दोनों ने मिलकर फिनिश लाइन पार की।", correctOrder: 8 },

            // LEVEL 2: Idioms and Meanings
            { id: "m1", level: 2, idiom: "दाँतों तले उँगली दबाना", meaning: "बहुत आश्चर्यचकित होना" },
            { id: "m2", level: 2, idiom: "सिर ऊँचा करना", meaning: "गर्व बढ़ाना" },
            { id: "m3", level: 2, idiom: "मैदान मारना", meaning: "सफलता प्राप्त करना" },
            { id: "m4", level: 2, idiom: "कंधे से कंधा मिलाना", meaning: "मिलकर साथ देना" }
        ];

        // ==========================================
        // GAME CONTROLLER
        // ==========================================
        class TimelineGame {
            constructor() {
                this.currentLevel = 1;
                this.activeEvents = [];
                this.draggedIndex = null;
                
                // Match State Level 2
                this.selectedIdiom = null;
                this.selectedMeaning = null;
                this.userMatches = {};

                this.levelIndicator = document.getElementById('level-indicator');
                this.levelToggleBtn = document.getElementById('level-toggle-btn');
                this.instructionsText = document.getElementById('instructions-text');
                this.eventsList = document.getElementById('events-list');
                this.matchingContainer = document.getElementById('matching-container');
                this.idiomsColumn = document.getElementById('idioms-column');
                this.meaningsColumn = document.getElementById('meanings-column');
                this.feedback = document.getElementById('feedback');
                this.checkBtn = document.getElementById('check-btn');
                this.resetBtn = document.getElementById('reset-btn');

                this.bindEvents();
                this.loadLevel(this.currentLevel);
            }

            bindEvents() {
                this.levelToggleBtn.addEventListener('click', () => this.toggleLevel());
                this.checkBtn.addEventListener('click', () => this.checkAnswer());
                this.resetBtn.addEventListener('click', () => this.loadLevel(this.currentLevel));
            }

            shuffle(array) {
                let shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            loadLevel(levelNumber) {
                this.currentLevel = levelNumber;
                this.levelIndicator.innerText = `स्तर: ${this.currentLevel}`;
                this.levelToggleBtn.innerText = this.currentLevel === 1 ? "स्तर 2 पर जाएं" : "स्तर 1 पर जाएं";
                this.feedback.innerText = "";
                this.selectedIdiom = null;
                this.selectedMeaning = null;
                this.userMatches = {};

                if (this.currentLevel === 1) {
                    this.instructionsText.innerText = "घटनाओं को सही कालानुक्रमिक (Chronological) क्रम में व्यवस्थित करने के लिए ड्रैग करें:";
                    this.eventsList.style.display = "block";
                    this.matchingContainer.style.display = "none";

                    const levelData = masterEventsPool.filter(e => e.level === 1);
                    this.activeEvents = this.shuffle(levelData);
                    this.renderList();
                } else {
                    this.instructionsText.innerText = "मुहावरों को उनके सही अर्थ से सुमेलित करने के लिए बाएँ और दाएँ कार्ड्स पर क्लिक करें:";
                    this.eventsList.style.display = "none";
                    this.matchingContainer.style.display = "grid";

                    this.renderMatching();
                }
            }

            toggleLevel() {
                const nextLevel = this.currentLevel === 1 ? 2 : 1;
                this.loadLevel(nextLevel);
            }

            // --- LEVEL 1 RENDER ---
            renderList() {
                this.eventsList.innerHTML = "";
                this.activeEvents.forEach((event, index) => {
                    const li = document.createElement('li');
                    li.setAttribute('draggable', 'true');
                    li.dataset.index = index;
                    li.innerHTML = `<span class="drag-icon">☰</span> <span>${event.text}</span>`;

                    li.addEventListener('dragstart', (e) => this.handleDragStart(e, index));
                    li.addEventListener('dragover', (e) => this.handleDragOver(e));
                    li.addEventListener('drop', (e) => this.handleDrop(e, index));
                    li.addEventListener('dragend', (e) => this.handleDragEnd(e));

                    this.eventsList.appendChild(li);
                });
            }

            handleDragStart(e, index) {
                this.draggedIndex = index;
                e.dataTransfer.effectAllowed = 'move';
                e.target.classList.add('dragging');
            }

            handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            }

            handleDrop(e, targetIndex) {
                e.preventDefault();
                if (this.draggedIndex === null || this.draggedIndex === targetIndex) return;

                const movedItem = this.activeEvents.splice(this.draggedIndex, 1)[0];
                this.activeEvents.splice(targetIndex, 0, movedItem);

                this.renderList();
            }

            handleDragEnd(e) {
                e.target.classList.remove('dragging');
                this.draggedIndex = null;
            }

            // --- LEVEL 2 RENDER ---
            renderMatching() {
                this.idiomsColumn.innerHTML = "";
                this.meaningsColumn.innerHTML = "";

                const levelData = masterEventsPool.filter(e => e.level === 2);
                const idioms = this.shuffle(levelData);
                const meanings = this.shuffle(levelData);

                idioms.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.dataset.id = item.id;
                    card.dataset.type = 'idiom';
                    card.innerText = item.idiom;
                    card.addEventListener('click', () => this.handleMatchClick(card));
                    this.idiomsColumn.appendChild(card);
                });

                meanings.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.dataset.id = item.id;
                    card.dataset.type = 'meaning';
                    card.innerText = item.meaning;
                    card.addEventListener('click', () => this.handleMatchClick(card));
                    this.meaningsColumn.appendChild(card);
                });
            }

            handleMatchClick(card) {
                if (card.classList.contains('matched')) return;

                if (card.dataset.type === 'idiom') {
                    document.querySelectorAll('#idioms-column .match-card').forEach(c => {
                        if (!c.classList.contains('matched')) c.classList.remove('selected');
                    });
                    card.classList.add('selected');
                    this.selectedIdiom = card;
                } else {
                    document.querySelectorAll('#meanings-column .match-card').forEach(c => {
                        if (!c.classList.contains('matched')) c.classList.remove('selected');
                    });
                    card.classList.add('selected');
                    this.selectedMeaning = card;
                }

                if (this.selectedIdiom && this.selectedMeaning) {
                    const idiomId = this.selectedIdiom.dataset.id;
                    const meaningId = this.selectedMeaning.dataset.id;

                    if (idiomId === meaningId) {
                        this.selectedIdiom.classList.remove('selected');
                        this.selectedMeaning.classList.remove('selected');
                        this.selectedIdiom.classList.add('matched');
                        this.selectedMeaning.classList.add('matched');

                        this.userMatches[idiomId] = true;
                        this.selectedIdiom = null;
                        this.selectedMeaning = null;
                    } else {
                        const tempIdiom = this.selectedIdiom;
                        const tempMeaning = this.selectedMeaning;

                        tempIdiom.classList.add('wrong');
                        tempMeaning.classList.add('wrong');

                        setTimeout(() => {
                            tempIdiom.classList.remove('wrong', 'selected');
                            tempMeaning.classList.remove('wrong', 'selected');
                        }, 700);

                        this.selectedIdiom = null;
                        this.selectedMeaning = null;
                    }
                }
            }

            // --- CHECK ANSWERS ---
            checkAnswer() {
                if (this.currentLevel === 1) {
                    let isCorrect = true;
                    const listItems = this.eventsList.children;

                    this.activeEvents.forEach((event, index) => {
                        if (event.correctOrder !== index + 1) {
                            isCorrect = false;
                            listItems[index].style.backgroundColor = '#f8d7da';
                            listItems[index].style.borderColor = '#f5c6cb';
                        } else {
                            listItems[index].style.backgroundColor = '#d4edda';
                            listItems[index].style.borderColor = '#c3e6cb';
                        }
                    });

                    if (isCorrect) {
                        this.feedback.innerText = "अद्भुत! आपने सभी उत्तर सही क्रम में लगाए हैं। 🎉";
                        this.feedback.style.color = "#27ae60";
                    } else {
                        this.feedback.innerText = "कुछ उत्तर गलत क्रम में हैं। लाल रंग वाले बॉक्स जांचें और पुनः प्रयास करें। ❌";
                        this.feedback.style.color = "#e74c3c";
                    }
                } else {
                    const totalIdioms = masterEventsPool.filter(e => e.level === 2).length;
                    const matchedCount = Object.keys(this.userMatches).length;

                    if (matchedCount === totalIdioms) {
                        this.feedback.innerText = "अद्भुत! आपने सभी मुहावरों के सही अर्थ सुमेलित कर दिए हैं। 🎉";
                        this.feedback.style.color = "#27ae60";
                    } else {
                        this.feedback.innerText = `आपने ${totalIdioms} में से ${matchedCount} सही मिलाए हैं। बाकी भी सुमेलित करें! ❌`;
                        this.feedback.style.color = "#e74c3c";
                    }
                }
            }
        }

        // Run Game on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            new TimelineGame();
        });
    </script>
</body>
</html>
