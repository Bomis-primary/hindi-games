<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हिंदी व्याकरण क्विज़</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 25px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: left;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-primary { background-color: #4a90e2; color: white; }
        .btn-secondary { background-color: #50e3c2; color: #333; font-weight: bold; }
        .btn-option { background-color: #eef2f5; color: #333; border: 1px solid #dcdfe3; }
        .btn-option:hover { background-color: #e0e6ed; }
        .btn-option.correct { background-color: #2ecc71; color: white; }
        .btn-option.wrong { background-color: #e74c3c; color: white; }
        .screen { display: none; }
        .screen.active { display: block; }
        .question-text { font-size: 18px; margin-bottom: 20px; font-weight: 600; color: #2c3e50; }
        .score-text { font-size: 20px; text-align: center; margin-bottom: 20px; }
        .controls { display: flex; justify-content: space-between; margin-top: 20px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="screen active">
        <h1>हिंदी व्याकरण अभ्यास</h1>
        <p style="text-align: center;">अपना स्तर चुनिए:</p>
        <div class="btn-container">
            <button class="btn btn-primary" onclick="selectLevel(1)">
                लेवल 1: आधारभूत अभ्यास 📘
            </button>
            <button class="btn btn-secondary" onclick="selectLevel(2)">
                लेवल 2: व्याकरण बोध (पर्यायवाची शब्द) ✍️
            </button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen">
        <h2 id="level-title">लेवल 2: पर्यायवाची शब्द</h2>
        <div class="question-text" id="question-text">प्रश्न यहाँ दिखेगा</div>
        <div class="btn-container" id="options-container"></div>
        <div class="controls">
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" style="display:none; margin-left: auto;">अगला प्रश्न ➡️</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
        <h2>परिणाम 🏆</h2>
        <div class="score-text" id="score-text"></div>
        <div class="btn-container">
            <button class="btn btn-primary" onclick="restartQuiz()">पुनः प्रयास करें 🔄</button>
            <button class="btn btn-option" onclick="goHome()">मुख्य पृष्ठ पर जाएँ 🏠</button>
        </div>
    </div>
</div>

<script>
// Level 2 Questions (Grammar: Synonyms / पर्यायवाची शब्द)
const level2Questions = [
    {
        q: "जिन शब्दों के अर्थ समान या लगभग एक जैसे होते हैं, उन्हें क्या कहते हैं?",
        options: ["विलोम शब्द", "पर्यायवाची शब्द", "संज्ञा", "सर्वनाम"],
        answer: 1
    },
    {
        q: "'हवा' शब्द का सही पर्यायवाची शब्द कौन-सा है?",
        options: ["वायु", "जल", "अग्नि", "भूमि"],
        answer: 0
    },
    {
        q: "'महल' शब्द का सही पर्यायवाची शब्द क्या होगा?",
        options: ["झोपड़ी", "प्रासाद", "वन", "पहाड़"],
        answer: 1
    },
    {
        q: "'पवन' शब्द किस शब्द का पर्यायवाची है?",
        options: ["पानी", "हवा", "आकाश", "सूरज"],
        answer: 1
    },
    {
        q: "'भवन' शब्द का समान अर्थ (पर्यायवाची) देने वाला शब्द चुनिए:",
        options: ["घर / महल", "रास्ता", "पेड़", "नदी"],
        answer: 0
    },
    {
        q: "'राजा' शब्द का सही पर्यायवाची शब्द इनमें से कौन-सा है?",
        options: ["नृप", "सैनिक", "प्रजा", "सेवक"],
        answer: 0
    },
    {
        q: "'सूर्य' शब्द का पर्यायवाची शब्द क्या होगा?",
        options: ["चंद्रमा", "रवि", "मेघ", "तारा"],
        answer: 1
    },
    {
        q: "'पानी' शब्द का सही पर्यायवाची शब्द बताइए:",
        options: ["जल", "अनल", "आकाश", "पर्वत"],
        answer: 0
    },
    {
        q: "'आकाश' शब्द का पर्यायवाची शब्द इनमें से कौन-सा है?",
        options: ["गगन", "धरती", "सागर", "पाताल"],
        answer: 0
    },
    {
        q: "'फूल' शब्द का समानार्थक (पर्यायवाची) शब्द क्या होगा?",
        options: ["पुष्प", "पत्ता", "फल", "तथा"],
        answer: 0
    }
];

// Fallback Level 1 Questions
const level1Questions = [
    {
        q: "वर्णों के समूह को क्या कहते हैं?",
        options: ["वर्णमाला", "शब्द", "वाक्य", "पद"],
        answer: 0
    },
    {
        q: "हिंदी में कितने स्वर होते हैं?",
        options: ["10", "11", "12", "13"],
        answer: 1
    }
];

let currentQuestions = [];
let currentQuestionIndex = 0;
let score = 0;

function selectLevel(level) {
    if (level === 2) {
        currentQuestions = level2Questions;
        document.getElementById('level-title').innerText = "लेवल 2: पर्यायवाची शब्द";
    } else {
        currentQuestions = level1Questions;
        document.getElementById('level-title').innerText = "लेवल 1: आधारभूत अभ्यास";
    }
    
    currentQuestionIndex = 0;
    score = 0;
    
    showScreen('quiz-screen');
    loadQuestion();
}

function loadQuestion() {
    const qData = currentQuestions[currentQuestionIndex];
    document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${qData.q}`;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    document.getElementById('next-btn').style.display = 'none';

    qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(selectedIndex, selectedBtn) {
    const qData = currentQuestions[currentQuestionIndex];
    const buttons = document.querySelectorAll('#options-container .btn-option');
    
    buttons.forEach(btn => btn.disabled = true);

    if (selectedIndex === qData.answer) {
        selectedBtn.classList.add('correct');
        score++;
    } else {
        selectedBtn.classList.add('wrong');
        buttons[qData.answer].classList.add('correct');
    }

    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < currentQuestions.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    showScreen('result-screen');
    document.getElementById('score-text').innerText = `आपने ${currentQuestions.length} में से ${score} अंक प्राप्त किए!`;
}

function restartQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    showScreen('quiz-screen');
    loadQuestion();
}

function goHome() {
    showScreen('welcome-screen');
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}
</script>

</body>
</html>
