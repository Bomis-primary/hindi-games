<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हिंदी व्याकरण क्विज़</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 25px;
            box-sizing: border-box;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-container img {
            max-width: 120px;
            height: auto;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            padding: 14px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: left;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-primary { background-color: #4a90e2; color: white; }
        .btn-secondary { background-color: #50e3c2; color: #333; font-weight: bold; }
        .btn-option { background-color: #eef2f5; color: #333; border: 1px solid #dcdfe3; }
        .btn-option:hover { background-color: #e0e6ed; }
        .btn-option.correct { background-color: #2ecc71; color: white; }
        .btn-option.wrong { background-color: #e74c3c; color: white; }
        .screen { display: none; }
        .screen.active { display: block; }
        .question-text { font-size: 18px; margin-bottom: 20px; font-weight: 600; color: #2c3e50; }
        .score-text { font-size: 20px; text-align: center; margin-bottom: 20px; }
        .controls { display: flex; justify-content: space-between; margin-top: 20px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Logo Section -->
    <div class="logo-container">
        <img src="assets/logo.png" alt="Logo">
    </div>

    <!-- Welcome Screen -->
    <div id="welcome-screen" class="screen active">
        <h1>हिंदी व्याकरण अभ्यास</h1>
        <p style="text-align: center;">अपना स्तर चुनिए:</p>
        <div class="btn-container">
            <button class="btn btn-primary" onclick="selectLevel(1)">
                लेवल 1: पर्यायवाची शब्द 📘
            </button>
            <button class="btn btn-secondary" onclick="selectLevel(2)">
                लेवल 2: दिए गए शब्द का सही अर्थ चुनिए ✍️
            </button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen">
        <h2 id="level-title">व्याकरण अभ्यास</h2>
        <div class="question-text" id="question-text">प्रश्न यहाँ दिखेगा</div>
        <div class="btn-container" id="options-container"></div>
        <div class="controls">
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" style="display:none; margin-left: auto;">अगला प्रश्न ➡️</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
        <h2>परिणाम 🏆</h2>
        <div class="score-text" id="score-text"></div>
        <div class="btn-container">
            <button class="btn btn-primary" onclick="restartQuiz()">पुनः प्रयास करें 🔄</button>
            <button class="btn btn-option" onclick="goHome()">मुख्य पृष्ठ पर जाएँ 🏠</button>
        </div>
    </div>
</div>

<script>
// Audio Elements (Right = Clapping, Wrong = Wrong Sound)
const correctSound = new Audio('assets/freesound_community-claps-44774.mp3');
const wrongSound = new Audio('assets/wrong.mp3');

// Raw Level 1 Questions Data (Synonyms)
const rawLevel1Questions = [
    {
        q: "जिन शब्दों के अर्थ समान या लगभग एक जैसे होते हैं, उन्हें क्या कहते हैं?",
        correct: "पर्यायवाची शब्द",
        wrongs: ["विलोम शब्द", "संज्ञा", "सर्वनाम"]
    },
    {
        q: "'हवा' शब्द का सही पर्यायवाची शब्द कौन-सा है?",
        correct: "वायु",
        wrongs: ["जल", "अग्नि", "भूमि"]
    },
    {
        q: "'महल' शब्द का सही पर्यायवाची शब्द क्या होगा?",
        correct: "प्रासाद",
        wrongs: ["झोपड़ी", "वन", "पहाड़"]
    },
    {
        q: "'भवन' शब्द का समान अर्थ (पर्यायवाची) देने वाला शब्द चुनिए:",
        correct: "घर / महल",
        wrongs: ["रास्ता", "पेड़", "नदी"]
    },
    {
        q: "'राजा' शब्द का सही पर्यायवाची शब्द इनमें से कौन-सा है?",
        correct: "नृप",
        wrongs: ["सैनिक", "प्रजा", "सेवक"]
    },
    {
        q: "'सूर्य' शब्द का पर्यायवाची शब्द क्या होगा?",
        correct: "रवि",
        wrongs: ["चंद्रमा", "मेघ", "तारा"]
    },
    {
        q: "'पानी' शब्द का सही पर्यायवाची शब्द बताइए:",
        correct: "जल",
        wrongs: ["अनल", "आकाश", "पर्वत"]
    }
];

// Raw Level 2 Questions Data (Shabdarth - 7 Words)
const rawLevel2Questions = [
    {
        q: "दिए गए शब्द का सही अर्थ बताने वाला शब्द चुनिए: 'शीघ्र'",
        correct: "जल्दी",
        wrongs: ["धीमे", "देर", "आसानी"]
    },
    {
        q: "दिए गए शब्द का सही अर्थ बताने वाला शब्द चुनिए: 'सदा'",
        correct: "हमेशा",
        wrongs: ["कभी-कभी", "कभी नहीं", "अक्सर"]
    },
    {
        q: "दिए गए शब्द का सही अर्थ बताने वाला शब्द चुनिए: 'अंधेरा'",
        correct: "अंधकार",
        wrongs: ["उजाला", "चांदनी", "रोशनी"]
    },
    {
        q: "दिए गए शब्द का सही अर्थ बताने वाला शब्द चुनिए: 'कुटिया'",
        correct: "झोपड़ी",
        wrongs: ["महल", "किला", "भवन"]
    },
    {
        q: "दिए गए शब्द का सही अर्थ बताने वाला शब्द चुनिए: 'प्रसन्न'",
        correct: "खुश",
        wrongs: ["दुखी", "उदास", "क्रोधित"]
    },
    {
        q: "दिए गए शब्द का सही अर्थ बताने वाला शब्द चुनिए: 'प्रतियोगिता'",
        correct: "मुकाबला / होड़",
        wrongs: ["मित्रता", "सहयोग", "वार्तालाप"]
    },
    {
        q: "दिए गए शब्द का सही अर्थ बताने वाला शब्द चुनिए: 'अपूर्व'",
        correct: "अनोखा",
        wrongs: ["पुराना", "साधारण", "कठिन"]
    }
];

let currentQuestions = [];
let currentQuestionIndex = 0;
let score = 0;

// Helper function to shuffle array randomly
function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Function to randomize options so the correct answer isn't always 1st or 2nd
function prepareQuestions(rawData) {
    return rawData.map(item => {
        const allOptions = [item.correct, ...item.wrongs];
        const shuffledOptions = shuffleArray(allOptions);
        const correctIndex = shuffledOptions.indexOf(item.correct);
        return {
            q: item.q,
            options: shuffledOptions,
            answer: correctIndex
        };
    });
}

function selectLevel(level) {
    if (level === 1) {
        currentQuestions = prepareQuestions(rawLevel1Questions);
        document.getElementById('level-title').innerText = "लेवल 1: पर्यायवाची शब्द";
    } else {
        currentQuestions = prepareQuestions(rawLevel2Questions);
        document.getElementById('level-title').innerText = "लेवल 2: दिए गए शब्द का सही अर्थ चुनिए";
    }
    
    currentQuestionIndex = 0;
    score = 0;
    
    showScreen('quiz-screen');
    loadQuestion();
}

function loadQuestion() {
    const qData = currentQuestions[currentQuestionIndex];
    document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${qData.q}`;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    document.getElementById('next-btn').style.display = 'none';

    qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
    });
}

function playAudio(sound) {
    sound.currentTime = 0;
    sound.play().catch(e => console.log("Audio play error:", e));
}

function checkAnswer(selectedIndex, selectedBtn) {
    const qData = currentQuestions[currentQuestionIndex];
    const buttons = document.querySelectorAll('#options-container .btn-option');
    
    buttons.forEach(btn => btn.disabled = true);

    if (selectedIndex === qData.answer) {
        selectedBtn.classList.add('correct');
        playAudio(correctSound);
        score++;
    } else {
        selectedBtn.classList.add('wrong');
        buttons[qData.answer].classList.add('correct');
        playAudio(wrongSound);
    }

    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < currentQuestions.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    showScreen('result-screen');
    document.getElementById('score-text').innerText = `आपने ${currentQuestions.length} में से ${score} अंक प्राप्त किए!`;
}

function restartQuiz() {
    const activeLevel = document.getElementById('level-title').innerText.includes("1") ? 1 : 2;
    selectLevel(activeLevel);
}

function goHome() {
    showScreen('welcome-screen');
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}
</script>

</body>
</html>
